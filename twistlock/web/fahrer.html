<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15202B">
<title>TWISTLOCK</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/einfach.css">
</head>
<body>
<div class="app" id="app"><div class="inhalt"><div class="laedt">…</div></div></div>

<!-- Kamera des Handys. Wird nur durch die Schaltfläche „Kamera öffnen“ ausgelöst. -->
<input type="file" accept="image/*" capture="environment" id="cam"
       style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"
       tabindex="-1" aria-hidden="true">

<script src="/container.js"></script>
<script src="/zeit.js"></script>
<script src="/warteschlange.js"></script>
<script src="/sprache.js"></script>
<script src="/fahreransicht.js"></script>
<script>
"use strict";

const APP = document.getElementById("app");

/* ============ Zustand ============
   Alles, was der Bildschirm braucht, steht hier an einer Stelle. */
const Z = {
  ansicht:"laden", auftrag:null, heute:[], morgen:[], einst:{},
  online:navigator.onLine, datenZeit:null, ortungZeit:null, offen:0, offeneIds:[],
  laeuft:false, fahrzeugOffen:false,
  foto:null, ergebnis:null, abschluss:null, pruefung:null, bestaetigung:null,
  offenerVersuch:null, hinweis:null,
  problem:null, problemErgebnis:null,
  stand:null, vorher:"auftrag"
};
let daten = null;                       // letzte Antwort von /api/fahrer/tag
const gebucht = new Set();              // gegen doppelte Ereignisse bei Doppeltipp
let standBis = 0;                       // „Lkw steht sicher“ gilt 5 Minuten
let gps = null;

function neuZeichnen(){
  APP.innerHTML = FA.zeichne(Z);
  installKnopf();
}
function installKnopf(){
  const b = document.getElementById("install");
  if (b && typeof installEvent !== "undefined" && installEvent) {
    b.style.display = "flex"; b.textContent = t("installieren");
  }
}

/* ============ Offline-Warteschlange ============================
   Ohne Netz wird der ganze Vorgang auf dem Handy abgelegt: Foto,
   Auftrag, Ereignis-Kennung, Art, Uhrzeit der Aufnahme und die
   bestätigte Containernummer. Erst wenn das wirklich gespeichert ist,
   verschwindet die Aufnahme vom Bildschirm.                        */
async function zaehleOffen(){
  try {
    const liste = await TL_WARTE.alle();
    Z.offen = liste.length;
    Z.offeneIds = liste.map(v => v.id);
  } catch { Z.offen = 0; Z.offeneIds = []; }
}

/* Sendet die Warteschlange. Gibt zurück, ob alles weg ist.
   Es wird immer derselbe Vorgang gesendet — keine neue Uhrzeit,
   keine zweite Abholung. */
async function warteschlangeSenden(){
  let liste = [];
  try { liste = await TL_WARTE.alle(); } catch { return false; }
  for (const v of liste) {
    try {
      const r = await fetch(v.weg || "/api/fahrer/ereignis", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify(v.nutzlast) });
      if (r.ok || r.status === 404 || r.status === 400) await TL_WARTE.entferne(v.id);
      else return false;                 // Server hakt — später nochmal
    } catch { return false; }            // kein Netz — später nochmal
  }
  await zaehleOffen();
  return Z.offen === 0;
}

window.addEventListener("online",  () => { Z.online = true;  warteschlangeSenden().then(holen); });
window.addEventListener("offline", () => { Z.online = false; neuZeichnen(); });
setInterval(() => { if (navigator.onLine) warteschlangeSenden().then(() => neuZeichnen()); }, 45000);

/* ============ Standort ============
   Nur als Nachweis für das Büro. Funktioniert nur mit https. */
if (navigator.geolocation) {
  navigator.geolocation.watchPosition(
    p => { gps = { lat:p.coords.latitude, lon:p.coords.longitude };
           // Nur eine echte Ortung macht die Ortungsdaten frisch —
           // niemals ein Foto, ein Tastendruck oder ein zweiter Sendeversuch.
           Z.ortungZeit = new Date(p.timestamp || Date.now()).toISOString(); },
    () => {}, { enableHighAccuracy:true, maximumAge:30000, timeout:20000 });
  setInterval(() => {
    if (gps && navigator.onLine) fetch("/api/position",{method:"POST",
      headers:{"Content-Type":"application/json"}, body:JSON.stringify(gps)}).catch(()=>{});
  }, 60000);
}

/* ============ Kamera ============
   Das Bild wird verkleinert, damit es auch mit schlechtem Netz ankommt. */
const cam = document.getElementById("cam");
cam.addEventListener("change", () => {
  const f = cam.files && cam.files[0];
  cam.value = "";
  if (!f) return;                       // abgebrochen: Ansicht bleibt, nichts passiert
  const leser = new FileReader();
  leser.onload = () => {
    const bild = new Image();
    bild.onload = () => {
      const k = Math.min(1, 1400 / Math.max(bild.width, bild.height));
      const c = document.createElement("canvas");
      c.width = Math.round(bild.width*k); c.height = Math.round(bild.height*k);
      c.getContext("2d").drawImage(bild,0,0,c.width,c.height);
      fotoFertig(c.toDataURL("image/jpeg", 0.72));
    };
    bild.onerror = () => fotoFertig(leser.result);
    bild.src = leser.result;
  };
  leser.onerror = () => { Z.ansicht = "kamerahilfe"; neuZeichnen(); };
  leser.readAsDataURL(f);
});
function fotoFertig(bild){
  if (!Z.foto) return;
  Z.foto.bild = bild;                   // erst Vorschau, nichts wird gesendet
  Z.ansicht = "foto";
  neuZeichnen();
}

/* ============ Daten vom Büro ============ */
async function holen(){
  await zaehleOffen();
  try {
    const r = await fetch("/api/fahrer/tag", { cache:"no-store" });
    if (r.status === 401) { location.href = "/"; return; }
    daten = await r.json();
    Z.datenZeit = new Date().toISOString();
    Z.online = true;
  } catch {
    Z.online = false;
    if (!daten) { Z.ansicht = "keinNetz"; neuZeichnen(); return; }
  }
  uebernehmen();
  neuZeichnen();
}
/* Daten in den Zustand übertragen, ohne die laufende Ansicht zu stören */
function uebernehmen(){
  if (!daten) return;
  Z.heute  = daten.heute  || [];
  Z.morgen = daten.morgen || [];
  Z.einst  = daten.einst  || {};
  const offeneListe = Z.heute.filter(a => a.status !== "fertig");
  Z.auftrag = offeneListe[0] || null;
  const feste = ["foto","ergebnis","abschluss","problem","problemFrage","problemErgebnis",
                 "tagesplan","sprache","stand","kamerahilfe"];
  if (feste.includes(Z.ansicht)) return;          // Fahrer ist mitten in einem Schritt
  Z.ansicht = Z.auftrag ? "auftrag" : (Z.heute.length ? "feierabend" : "feierabend");
}

/* ============ Ereignis senden (Abholung, Ankunft, Abgabe) ============ */
async function ereignisSenden(auftrag, art, foto, extra, zeitVorgabe){
  const schluessel = auftrag.id + ":" + art;
  if (Z.laeuft || gebucht.has(schluessel)) return;   // Doppeltipp läuft ins Leere
  gebucht.add(schluessel);
  Z.laeuft = true; neuZeichnen();

  /* Zeitpunkt der Bestätigung. Beim Wiederholen nach einem Speicherfehler
     wird der ursprüngliche Zeitpunkt weitergereicht — eine Wiederholung
     verschiebt nicht, wann der Fahrer den Schritt bestätigt hat. */
  const zeit = zeitVorgabe || new Date().toISOString();
  const nutzlast = { auftragId:auftrag.id, art, foto, schluessel, zeit,
                     lat:gps&&gps.lat, lon:gps&&gps.lon, ...(extra || {}) };
  const vorgang = { id: schluessel, auftragId: auftrag.id, art, zeit,
                    weg: "/api/fahrer/ereignis", nutzlast,
                    nummer: (extra && extra.containerBestaetigt) || null,
                    abweichung: !!(extra && extra.abweichung),
                    ungeprueft: !!(extra && extra.containerUngeprueft),
                    hatFoto: !!foto };
  let antwort = null, fehlerText = null, netzfehler = false, gemerkt = true;
  try {
    const r = await fetch("/api/fahrer/ereignis",{ method:"POST",
      headers:{"Content-Type":"application/json"}, body:JSON.stringify(nutzlast) });
    const d = await r.json().catch(() => ({}));
    if (r.ok) antwort = d;
    else if (r.status === 400 || r.status === 404) fehlerText = d.fehler || null;
    else { netzfehler = true; gemerkt = await TL_WARTE.legeAb(vorgang); }
  } catch {
    netzfehler = true;
    gemerkt = await TL_WARTE.legeAb(vorgang);
  }
  await zaehleOffen();
  Z.laeuft = false;
  const jetzt = zeit;
  // Die Aufnahme verschwindet erst, wenn sie übertragen oder sicher abgelegt ist.
  if (antwort || gemerkt) Z.foto = null;

  if (antwort) {
    Z.online = true;
    Z.pruefung = null;
    await holen();
    if (art === "abgabe") {
      // Der abgeschlossene Auftrag, nicht der nächste: Kunde, Ort, Container
      // und Zeit gehören zu genau diesem Auftrag.
      Z.abschluss = { ort: auftrag.kunde || auftrag.zielOrt, zeit: jetzt,
                      nummer: auftrag.nummer,
                      container: auftrag.containerBestaetigt || auftrag.container,
                      naechster: antwort.naechster || null };
      Z.ansicht = "abschluss";
    } else if (art === "abholung") {
      Z.offenerVersuch = null;
      Z.ergebnis = { typ:"uebertragen", art, zeit:jetzt,
                     nummer: extra && extra.containerBestaetigt,
                     abweichung: !!(antwort.auftrag && antwort.auftrag.abweichung),
                     ungeprueft: !!(extra && extra.containerUngeprueft) };
      Z.ansicht = "ergebnis";
    } else {
      // Kleine Schritte brauchen keine eigene Seite: kurzer Hinweis genügt.
      Z.bestaetigung = bestaetigungsText(art);
      if (art === "entladenFertig") {
        // Entladeende ist nicht die Ablieferung: direkt zum Foto führen.
        Z.foto = { art:"abgabe", bild:null };
        Z.ansicht = "foto";
      } else {
        Z.ansicht = "auftrag";
      }
    }
  } else if (netzfehler && gemerkt) {
    // Aufnahme ist gesichert. Der Bildschirm geht weiter, damit der Fahrer
    // weiterarbeiten kann — aber er sieht, dass noch nichts gesendet ist.
    oertlichVormerken(auftrag, art, jetzt);
    Z.online = navigator.onLine;
    Z.offenerVersuch = null;
    Z.ergebnis = { typ:"gespeichert", art, zeit:jetzt,
                   nummer: extra && extra.containerBestaetigt,
                   ungeprueft: !!(extra && extra.containerUngeprueft) };
    Z.ansicht = "ergebnis";
  } else if (netzfehler) {
    // Weder gesendet noch gespeichert: die Aufnahme bleibt erhalten und der
    // Schritt bleibt offen. Der Versuch wird gemerkt, damit „Erneut speichern“
    // genau denselben Vorgang wiederholt — gleiches Foto, gleiche Uhrzeit.
    gebucht.delete(schluessel);
    Z.offenerVersuch = { auftrag, art, foto, extra, zeit };
    Z.ansicht = "speicherfehler";
  } else {
    gebucht.delete(schluessel);
    Z.ergebnis = { typ:"fehler", art, zeit:jetzt, text:fehlerText };
    Z.ansicht = "ergebnis";
  }
  neuZeichnen();
}
/* Kurze Rückmeldung zum gerade gebuchten Schritt — nicht die Überschrift
   der neuen Ansicht wiederholen. */
function bestaetigungsText(art){
  return { ankunft:t("bestAnkunft"), warten:t("bestWarten"),
           entladenStart:t("bestEntladenStart"), entladenFertig:t("bestEntladenFertig"),
           entladenLaenger:t("bestLaenger") }[art] || "";
}

/* Damit der Bildschirm auch ohne Netz sofort weitergeht.
   Die Zeiten werden vom Server noch einmal gesetzt, sobald er erreichbar ist. */
function oertlichVormerken(a, art, jetzt){
  if (art === "abholung")      { a.status = "geladen";         a.abholZeit = jetzt; }
  if (art === "ankunft")       { a.status = "angekommen";      a.ankunftZeit = jetzt; }
  if (art === "warten")        { a.status = "warten";          a.wartenZeit = jetzt; }
  if (art === "entladenStart") { a.status = "entladen";        a.entladeStart = jetzt;
    const plan = (Z.einst.entladezeitStandard || 120);
    a.rechnung = { ...(a.rechnung || {}), entladeEndePlan:
      new Date(new Date(jetzt).getTime() + plan*60000).toISOString(), entladeUnbekannt:false }; }
  if (art === "entladenFertig"){ a.status = "entladen_fertig"; a.entladeFertigZeit = jetzt; }
  if (art === "abgabe")        { a.status = "fertig";          a.abgabeZeit = jetzt; }
  Z.auftrag = (Z.heute || []).filter(x => x.status !== "fertig")[0] || null;
}

/* Drei getrennte Fragen zur Containernummer:
   1. wurde sie sicher erkannt?  2. sind Format und Prüfziffer gültig?
   3. ist es die Nummer aus dem Auftrag?
   Eine Übereinstimmung mit dem Auftrag darf eine falsche Prüfziffer
   nicht verdecken. */
function pruefungBauen(erkannt, opt){
  opt = opt || {};
  const a = Z.auftrag || {};
  const rein = TL_CONTAINER.rein(erkannt);
  const pruef = TL_CONTAINER.pruefe(rein);
  const gleich = TL_CONTAINER.vergleiche(a.container, rein) === "passt";
  const basis = { erkannt:rein, bestaetigt:rein, gleich, gueltig:pruef.gueltig,
                  sicher: opt.sicher !== false, eingabe: opt.eingabe || "",
                  versucht: !!opt.versucht, demo: !!opt.demo };
  if (!basis.sicher)  return { ...basis, zustand:"unsicher" };
  if (!basis.gueltig) return { ...basis, zustand:"ungueltig", ungeprueft:true };
  if (!gleich)        return { ...basis, zustand:"abweichung" };
  return { ...basis, zustand:"passt" };
}

/* ============ Problem melden ============ */
async function problemSenden(){
  const art = (Z.problem || {}).art;
  if (!art || Z.laeuft) return;
  Z.laeuft = true; neuZeichnen();
  const nutzlast = { art, auftragId: Z.auftrag ? Z.auftrag.id : null,
                     lat:gps&&gps.lat, lon:gps&&gps.lon };
  const jetzt = new Date().toISOString();
  let erg;
  try {
    const r = await fetch("/api/fahrer/meldung",{ method:"POST",
      headers:{"Content-Type":"application/json"}, body:JSON.stringify(nutzlast) });
    if (r.ok) {
      const d = await r.json().catch(() => ({}));
      erg = { art, typ:"gesendet", zeit:jetzt, gelesen:false, id:d.id || null };
    } else {
      erg = { art, typ:"fehler", zeit:jetzt };
    }
  } catch {
    const gemerkt = await TL_WARTE.legeAb({ id:"meldung:"+art+":"+jetzt, art:"meldung",
      zeit:jetzt, weg:"/api/fahrer/meldung", nutzlast });
    erg = gemerkt ? { art, typ:"wartet", zeit:jetzt }
                  : { art, typ:"fehler", zeit:jetzt, gemerkt:false };
    Z.online = navigator.onLine;
  }
  Z.laeuft = false;
  Z.problemErgebnis = erg;
  Z.ansicht = "problemErgebnis";
  neuZeichnen();
  if (erg.typ === "gesendet") leseBestaetigungHolen();
}
/* „Vom Büro gelesen“ wird nur angezeigt, wenn das Büro die Meldung
   wirklich gelesen hat. Solange nichts kommt, bleibt es „noch nicht“. */
let leseUhr = null;
function leseBestaetigungHolen(){
  clearInterval(leseUhr);
  leseUhr = setInterval(async () => {
    const e = Z.problemErgebnis;
    if (Z.ansicht !== "problemErgebnis" || !e || !e.id || e.gelesen) { clearInterval(leseUhr); return; }
    try {
      const r = await fetch("/api/fahrer/meldungen", { cache:"no-store" });
      if (!r.ok) return;
      const d = await r.json();
      const m = (d.meldungen || []).find(x => x.id === e.id);
      if (m && m.gelesen) { e.gelesen = true; neuZeichnen(); clearInterval(leseUhr); }
    } catch {}
  }, 15000);
}

/* ============ Änderung bestätigen ============ */
async function aenderungBestaetigen(){
  const a = Z.auftrag; if (!a) return;
  try {
    const r = await fetch("/api/fahrer/gesehen",{ method:"POST",
      headers:{"Content-Type":"application/json"}, body:JSON.stringify({ auftragId:a.id }) });
    if (r.ok) a.aenderungGesehen = { zeit:new Date().toISOString() };
  } catch {
    const gemerkt = await TL_WARTE.legeAb({ id:"gesehen:"+a.id, art:"gesehen",
      zeit:new Date().toISOString(), weg:"/api/fahrer/gesehen", nutzlast:{ auftragId:a.id } });
    if (gemerkt) a.aenderungGesehen = { zeit:new Date().toISOString() };
  }
  neuZeichnen();
}

/* ============ Sicherer Stand ============
   Die App kann nicht messen, ob der Lkw fährt. Darum fragt sie
   einmal nach und merkt die Antwort fünf Minuten.                */
function imStand(){ return Date.now() < standBis; }
function mitStand(aktion){
  if (imStand()) return aktion();
  Z.stand = { aktion };
  Z.vorher = Z.ansicht;
  Z.ansicht = "stand";
  neuZeichnen();
}

/* ============ Aktionen ============ */
const A = {
  vorlesen(){ sprich(FA.vorlesetext(Z)); },
  anrufen(){ const n = Z.einst.bueroTelefon; if (n) location.href = "tel:" + n; },

  tagesplan(){ Z.vorher = Z.ansicht === "tagesplan" ? "auftrag" : Z.ansicht;
               Z.ansicht = "tagesplan"; neuZeichnen(); },
  sprache(){   Z.vorher = "tagesplan"; Z.ansicht = "sprache"; neuZeichnen(); },
  spracheSetzen(d){ setzeSprache(d.k); Z.ansicht = "tagesplan"; neuZeichnen(); },

  zurueck(){
    if (Z.ansicht === "sprache")       { Z.ansicht = "tagesplan"; return neuZeichnen(); }
    if (Z.ansicht === "stand")         { Z.ansicht = Z.vorher || "auftrag"; Z.stand = null; return neuZeichnen(); }
    if (Z.ansicht === "kamerahilfe")   { Z.ansicht = "foto"; return neuZeichnen(); }
    if (Z.ansicht === "nummerEingeben"){ Z.ansicht = "container"; return neuZeichnen(); }
    if (Z.ansicht === "containerFrage"){ Z.ansicht = "container"; return neuZeichnen(); }
    if (Z.ansicht === "ungeprueft")    { Z.ansicht = "container"; return neuZeichnen(); }
    if (Z.ansicht === "laenger")       { Z.ansicht = "auftrag"; return neuZeichnen(); }
    Z.ansicht = "auftrag"; Z.foto = null; Z.ergebnis = null; Z.pruefung = null;
    Z.problem = null; Z.problemErgebnis = null;
    uebernehmen(); neuZeichnen();
  },
  nochmalLaden(){ Z.ansicht = "laden"; neuZeichnen(); holen(); },
  fahrzeug(){ Z.fahrzeugOffen = !Z.fahrzeugOffen; neuZeichnen(); },

  /* Nach einem Speicherfehler: derselbe Vorgang, dasselbe Foto. */
  erneutSpeichern(){
    const v = Z.offenerVersuch;
    if (!v) { Z.ansicht = "auftrag"; return neuZeichnen(); }
    gebucht.delete(v.auftrag.id + ":" + v.art);
    ereignisSenden(v.auftrag, v.art, v.foto, v.extra, v.zeit);
  },
  zurueckZumFoto(){
    const v = Z.offenerVersuch;
    if (v) Z.foto = { art:v.art, bild:v.foto };
    Z.ansicht = "foto"; neuZeichnen();
  },
  aenderungGesehen(){ mitStand(aenderungBestaetigen); },

  /* --- Foto --- */
  fotoAbholung(){ Z.foto = { art:"abholung", bild:null }; Z.ansicht = "foto"; neuZeichnen(); },
  fotoAbgabe(){   Z.foto = { art:"abgabe",   bild:null }; Z.ansicht = "foto"; neuZeichnen(); },
  kamera(){ mitStand(() => cam.click()); },
  fotoNeu(){
    if (!Z.foto) Z.foto = { art:"abholung", bild:null };
    Z.foto.bild = null; Z.pruefung = null; Z.ansicht = "foto";
    neuZeichnen(); mitStand(() => cam.click());
  },
  fotoVerwenden(){
    if (!Z.foto || !Z.foto.bild || !Z.auftrag) return;
    if (Z.foto.art === "abholung") {
      // Vor dem Buchen die Containernummer vergleichen.
      Z.pruefung = { zustand:"frage" };
      Z.ansicht = "container";
      return neuZeichnen();
    }
    ereignisSenden(Z.auftrag, Z.foto.art, Z.foto.bild);
  },
  fotoAbbrechen(){ Z.foto = null; Z.pruefung = null; Z.ansicht = "auftrag"; neuZeichnen(); },
  kamerahilfe(){ Z.ansicht = "kamerahilfe"; neuZeichnen(); },

  /* --- Containernummer --- */
  nummerStimmt(){
    const a = Z.auftrag; if (!a) return;
    Z.pruefung = pruefungBauen(a.container, { sicher:true, versucht:false });
    Z.ansicht = "container"; neuZeichnen();
  },
  nummerEingeben(){
    Z.pruefung = { ...(Z.pruefung || {}), zustand:"eingabe",
                   eingabe:(Z.pruefung && Z.pruefung.eingabe) || "" };
    Z.ansicht = "nummerEingeben"; neuZeichnen();
    const f = document.getElementById("nummerfeld"); if (f) f.focus();
  },
  nummerUebernehmen(){
    const feld = document.getElementById("nummerfeld");
    const roh = feld ? feld.value : "";
    const rein = TL_CONTAINER.rein(roh);
    if (!Z.auftrag) return;
    Z.pruefung = pruefungBauen(rein, { sicher:true, versucht:true, eingabe:roh });
    Z.ansicht = "container"; neuZeichnen();
  },
  trotzdem(){ Z.ansicht = "containerFrage"; neuZeichnen(); },
  ungeprueftUebernehmen(){ Z.ansicht = "ungeprueft"; neuZeichnen(); },
  abholungBestaetigen(){
    const a = Z.auftrag, p = Z.pruefung || {};
    if (!a || !Z.foto) return;
    const ungeprueft = Z.ansicht === "ungeprueft" || p.zustand === "ungueltig";
    ereignisSenden(a, "abholung", Z.foto.bild, {
      containerBestaetigt: p.bestaetigt || p.erkannt || a.container,
      containerErkannt: p.erkannt || null,
      containerUngeprueft: ungeprueft || undefined
    });
  },

  /* --- Ankunft, Warten, Entladen --- */
  ankunft(){ mitStand(() => { if (Z.auftrag) ereignisSenden(Z.auftrag, "ankunft", null); }); },
  warten(){ if (Z.auftrag) ereignisSenden(Z.auftrag, "warten", null); },
  entladenStart(){ mitStand(() => { if (Z.auftrag) ereignisSenden(Z.auftrag, "entladenStart", null); }); },
  entladenFertig(){ mitStand(() => { if (Z.auftrag) ereignisSenden(Z.auftrag, "entladenFertig", null); }); },
  laenger(){ Z.ansicht = "laenger"; neuZeichnen(); },
  laengerWahl(d){
    const m = d.min === "" ? null : Number(d.min);
    if (!Z.auftrag) return;
    // Der Schritt darf mehrfach vorkommen: Schlüssel jedes Mal neu.
    gebucht.delete(Z.auftrag.id + ":entladenLaenger");
    ereignisSenden(Z.auftrag, "entladenLaenger", null, { minuten:m });
  },

  /* --- Sicherer Stand --- */
  standJa(){
    standBis = Date.now() + 5*60000;
    const f = Z.stand && Z.stand.aktion; Z.stand = null;
    Z.ansicht = Z.vorher || "auftrag";
    neuZeichnen();
    if (f) f();
  },

  /* --- Senden wiederholen --- */
  async nochmalSenden(){
    await zaehleOffen();
    if (!Z.offen) {                       // nichts da, also nichts behaupten
      Z.hinweis = t("keinVorgangOffen");
      return neuZeichnen();
    }
    Z.laeuft = true; neuZeichnen();
    const fertig = await warteschlangeSenden();
    Z.laeuft = false;
    if (fertig) {
      // Erst jetzt gilt die Übertragung als bestätigt.
      if (Z.ergebnis) Z.ergebnis.typ = "uebertragen";
      if (Z.problemErgebnis) Z.problemErgebnis.typ = "gesendet";
      await holen();
    } else if (Z.ergebnis) {
      Z.ergebnis.typ = "gespeichert";     // liegt weiter auf dem Gerät
    }
    neuZeichnen();
  },

  /* --- Problem melden --- */
  problem(){ Z.vorher = Z.ansicht; Z.problem = null; Z.ansicht = "problem"; neuZeichnen(); },
  problemWahl(d){ Z.problem = { art:d.art }; Z.ansicht = "problemFrage"; neuZeichnen(); },
  problemSenden(){ problemSenden(); },

  /* --- Abschluss --- */
  naechster(){ Z.abschluss = null; Z.ansicht = "auftrag"; uebernehmen(); neuZeichnen(); },

  navi(){ /* der Link öffnet die Karten-App des Handys */ }
};

/* Ein Klickempfänger für alles. Kein Wischen, kein langes Drücken, kein Doppeltipp. */
APP.addEventListener("click", e => {
  const b = e.target.closest("[data-tun]");
  if (!b) return;
  const f = A[b.dataset.tun];
  if (typeof f === "function") f(b.dataset);
});

/* Solange eine Aufnahme weder gesendet noch gespeichert ist, warnt der
   Browser vor dem Schließen — soweit er das zulässt. */
window.addEventListener("beforeunload", e => {
  if (!Z.offenerVersuch) return;
  e.preventDefault();
  e.returnValue = t("verlassenWarnung");
  return t("verlassenWarnung");
});

/* ============ Start ============ */
warteschlangeSenden().then(holen);
setInterval(() => {
  const fest = ["foto","ergebnis","stand","kamerahilfe","problem","problemFrage","problemErgebnis",
                "container","containerFrage","nummerEingeben","laenger"];
  if (!Z.laeuft && !fest.includes(Z.ansicht)) holen().then(entladezeitPruefen);
}, 60000);

/* Ist die geplante Entladezeit abgelaufen? Dann einmal nachfragen.
   Ohne Antwort wird nichts abgeschlossen und keine Abfahrt angenommen. */
function entladezeitPruefen(){
  const a = Z.auftrag;
  if (!a || a.status !== "entladen" || Z.ansicht !== "auftrag") return;
  const r = a.rechnung || {};
  if (r.entladeUnbekannt || !r.entladeEndePlan) return;
  if (new Date(r.entladeEndePlan).getTime() > Date.now()) return;
  Z.ansicht = "nachfrage";
  neuZeichnen();
}
</script>
