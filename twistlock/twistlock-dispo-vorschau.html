const fahrerVon = id => D.fahrer.find(x => x.id === id) || null;
const zugVon    = id => D.zugmaschinen.find(x => x.id === id) || null;
const chsVon    = id => D.chassis.find(x => x.id === id) || null;
const auftragVon= id => D.auftraege.find(x => x.id === id) || null;

/* Welcher Termin ist für diesen Auftrag gerade der maßgebliche?
   Vor der Abholung zählt der Abholtermin, danach der Liefertermin.
   Das muss sichtbar sein — „Termin 11:00“ allein ist zweideutig. */
function massgeblich(a){
  /* Ist am Vortag beladen worden, gibt es am Einsatztag keinen Abholtermin
     mehr, auf den man pünktlich sein müsste — dann zählt die Anlieferung. */
  if (!vortagBeladen(a) && !a.ablauf.abholung && a.abhol.zeit)
    return { art:"Abholung", ort:a.abhol.firma, datum:a.abhol.datum, zeit:a.abhol.zeit,
             iso:zeitpunkt(a.abhol.datum, a.abhol.zeit) };
  return { art:"Anlieferung", ort:a.liefer.firma, datum:a.liefer.datum, zeit:a.liefer.zeit,
           iso:zeitpunkt(a.liefer.datum, a.liefer.zeit) };
}

/* Wurde der Container schon am Vortag auf das Chassis gezogen?
   Dann entfällt am Einsatztag die Beladezeit — das Fahrzeug fährt los. */
function vortagBeladen(a){
  return !!(a && a.beladung && a.beladung.art === "vortag");
}
/* Sehr früher Termin bei Beladung am selben Tag: sachlicher Hinweis,
   keine Sperre. Grenze bewusst als Konstante, damit sie auffindbar ist. */
const FRUEH_AB = "07:30";
function fruehterminHinweis(a){
  if (vortagBeladen(a)) return null;
  const m = massgeblich(a);
  const zeit = (a.abhol && a.abhol.zeit) || m.zeit;
  if (!zeit || zeit >= FRUEH_AB) return null;
  return "Früher Termin – Beladung am Vortag prüfen.";
}

/* Aktueller Arbeitsschritt in Worten. */
/* Verbleibende Entladezeit.
   Rückgabe: { min } wenn sie bekannt ist, sonst { unklar:true, grund }.

   Wichtig: Ein abgelaufener Planwert heißt NICHT „fertig“. Fertig ist die
   Entladung erst, wenn der Fahrer sie bestätigt. Läuft die geplante Zeit
   ab, ohne dass er sich meldet, ist das Ende unklar — daraus darf keine
   sofortige Abfahrt gerechnet werden. */
function entladeRest(a){
  if (!a.ablauf.entladenStart || a.ablauf.entladenEnde)
    return { min:null, unklar:false, grund:null };

  const ver = a.entladeVerlaengerung;
  if (ver && ver.unbekannt)
    return { min:null, unklar:true,
             grund:"Der Fahrer hat „Weiß ich noch nicht“ gewählt." };

  /* „Dauert länger“: die neue Restzeit zählt ab dem Zeitpunkt der Eingabe. */
  const start = ver ? ver.ab : a.ablauf.entladenStart;
  const dauer = ver ? ver.min : a.planung.entladenMin;
  const rest = dauer - minZw(start, jetztIso());
  if (rest <= 0)
    return { min:null, unklar:true,
             grund:"Entladeende unklar: die geplante Entladezeit ist abgelaufen, " +
                   "der Fahrer hat aber noch nicht „Entladung fertig“ gemeldet." };
  return { min:rest, unklar:false, grund:null };
}

/* Das Ergebnis der Tourrechnung zu diesem Auftrag. Es ist die EINE
   Grundlage für Tagesplan, Auftragsdetail, Belegung und Alarmprüfung —
   damit nirgends zwei verschiedene Zahlen für dieselbe Sache stehen. */
function tourErgebnis(a){
  if (!a.rechnung2) ketteRechnen();
  return a.rechnung2 || null;
}

/* Voraussichtliche Ankunft am maßgeblichen Termin.
   Abholankunft und Kundenankunft werden getrennt geführt: „Termin 11:00“
   heißt je nach Stand Abholung oder Anlieferung, und beide Ankünfte
   verschieben sich unterschiedlich. */
function prognose(a){
  const m = massgeblich(a);
  if (!m.iso) return { iso:null, grund:"Kein Termin hinterlegt" };
  if (a.ablauf.abgabe) return { iso:null, grund:"Auftrag ist abgeschlossen" };

  /* Ist der Fahrer schon da, ist die Ankunft keine Vorhersage mehr,
     sondern eine Tatsache. */
  if (m.art === "Anlieferung" && a.ablauf.ankunft)
    return { iso:a.ablauf.ankunft, grund:null, istAnkunft:true };
  if (m.art === "Abholung" && a.ablauf.abholung)
    return { iso:a.ablauf.abholung, grund:null, istAnkunft:true };

  /* Prognosezeitpunkt und Ortungszeitpunkt werden getrennt geführt und
     einzeln geprüft. Neu gerechnet wird oft, geortet nicht. */
  const zuv = datenZuverlaessig(a.prognoseZeit || a.datenZeit, a.ortungZeit);
  if (!zuv.ok) return { iso:null, grund:zuv.grund };

  const r = tourErgebnis(a);
  if (!r) return { iso:null, grund:"Keine Berechnung vorhanden" };
  if (r.unklar) return { iso:null, grund:r.grund };

  const iso = m.art === "Abholung" ? r.abholAnkunft : r.kundenAnkunft;
  if (!iso) return { iso:null, grund:r.grund || "Keine Berechnung vorhanden" };
  return { iso, grund:null, ausKette:!!r.ausKette, nurPlan:!!r.nurPlan, bezug:m.art };
}

/* Zeitstatus: Farbe plus der Satz, der sie erklärt. */
function zeitstatus(a){
  const m = massgeblich(a);
  const p = prognose(a);
  if (a.storniert) return { klasse:"m-grau", satz:"Storniert", res:null, ankunft:null };
  if (a.ablauf.abgabe) return { klasse:"m-gruen", satz:"Abgeliefert", res:null, ankunft:null };
  if (!p.iso) return { klasse:"m-grau", satz:"Ankunft unklar", zusatz:p.grund, res:null, ankunft:null };
  /* Reiner Plan ohne Ortung und ohne Verzug: sachlich „nach Plan“, nicht
     „0 Min. Reserve“. Eine knappe Lage wäre eine Behauptung ohne Daten. */
  if (p.nurPlan)
    return { klasse:"m-marine", satz:"Nach Plan",
             zusatz:"noch keine Ortung, keine Abweichung berechnet",
             res:null, ankunft:p.iso, nurPlan:true };
  const res = reserve(m.iso, p.iso);
  const k = ampel(res);
  /* Bereits angekommen: das ist Vergangenheit, keine Vorhersage. */
  if (p.istAnkunft) {
    if (res < 0) return { klasse:"m-rot", satz:Math.abs(res)+" Min. zu spät angekommen",
                          zusatz:"Fahrzeug ist vor Ort", res, ankunft:p.iso, istAnkunft:true };
    return { klasse:"m-gruen", satz:"Pünktlich angekommen",
             zusatz:"Fahrzeug ist vor Ort", res, ankunft:p.iso, istAnkunft:true };
  }
  if (k === "rot")   return { klasse:"m-rot",  satz:Math.abs(res)+" Min. verspätet", res, ankunft:p.iso };
  if (k === "gelb")  return { klasse:"m-gelb", satz:res+" Min. Reserve", res, ankunft:p.iso };
  if (k === "gruen") return { klasse:"m-gruen",satz:res+" Min. Reserve", res, ankunft:p.iso };
  return { klasse:"m-grau", satz:"Ankunft unklar", res:null, ankunft:null };
}

/* ===========================================================
   6b · Zentrale Status-Engine

   EIN Zustand je Auftrag, für alle Ansichten. Tagesplan, Wochenplan,
   Auftragsdetail, Fahrer-App, Auftraggeber-Link und Meldungen lesen
   ab hier dasselbe. Es gibt keine zweite Statusermittlung.

   Abgeleitet wird ausschließlich aus dem, was vorliegt: Freigabe,
   Bestätigung des Fahrers und der Ablauf. Nichts davon wird hier
   geschrieben — diese Funktion urteilt nur.
   =========================================================== */
const STATUS_WOERTER = {
  geplant:            { intern:"Geplant",              extern:"Geplant",                      klasse:"m-grau"   },
  freigegeben:        { intern:"Freigegeben",          extern:"Geplant",                      klasse:"m-grau"   },
  auftragGesehen:     { intern:"Fahrer hat bestätigt", extern:"Fahrer hat Auftrag erhalten",  klasse:"m-grau"   },
  anfahrtAbholung:    { intern:"Anfahrt Abholung",     extern:"Fahrer hat Auftrag erhalten",  klasse:"m-marine" },
  beiAbholung:        { intern:"An der Abholstelle",   extern:"Fahrer hat Auftrag erhalten",  klasse:"m-marine" },
  containerUebernommen:{intern:"Container übernommen", extern:"Container übernommen",         klasse:"m-marine" },
  unterwegsKunde:     { intern:"Unterwegs zum Kunden", extern:"Unterwegs",                    klasse:"m-marine" },
  angekommenKunde:    { intern:"Beim Kunden angekommen",extern:"Beim Empfänger angekommen",   klasse:"m-marine" },
  warten:             { intern:"Wartet",               extern:"Wartet auf Entladung",         klasse:"m-gelb"   },
  entladung:          { intern:"Entladung läuft",      extern:"Entladung läuft",              klasse:"m-marine" },
  entladungFertig:    { intern:"Entladen fertig",      extern:"Entladung abgeschlossen",      klasse:"m-marine" },
  nachlauf:           { intern:"Nachlauf",             extern:"Entladung abgeschlossen",      klasse:"m-marine" },
  abgeschlossen:      { intern:"Fertig",               extern:"Transport abgeschlossen",      klasse:"m-gruen"  },
  storniert:          { intern:"Storniert",            extern:"Transport abgesagt",           klasse:"m-grau"   },
  nichtZugewiesen:    { intern:"Nicht zugewiesen",     extern:"Geplant",                      klasse:"m-gelb"   },
  entwurf:            { intern:"Entwurf",              extern:"Geplant",                      klasse:"m-grau"   }
};

/* Der eine Zustand. Reihenfolge von hinten nach vorn: der weiteste
   erreichte Schritt gewinnt. */
function transportStatus(a){
  if (!a) return "geplant";
  if (a.storniert)            return "storniert";
  if (a.ablauf.abgabe)        return "abgeschlossen";
  if (a.ablauf.entladenEnde)  return "entladungFertig";
  if (a.ablauf.entladenStart) return "entladung";
  if (a.ablauf.warten)        return "warten";
  if (a.ablauf.ankunft)       return "angekommenKunde";
  if (a.ablauf.abholung) {
    /* Nach der Abholung: fährt er noch, oder ist er schon in der
       Kundenzone? Das entscheidet die Ortung, nicht ein Knopf. */
    return zoneLage(a).beiKunde ? "angekommenKunde" : "unterwegsKunde";
  }
  if (!a.planung.fahrerId)    return "nichtZugewiesen";
  if (!a.freigegeben)         return "entwurf";
  if (a.bestaetigt) {
    const z = zoneLage(a);
    if (z.beiAbholung) return "beiAbholung";
    if (z.faehrt)      return "anfahrtAbholung";
    return "auftragGesehen";
  }
  return "freigegeben";
}

/* Wo steht das Fahrzeug dieses Auftrags gerade — gemessen, nicht geraten.
   Ohne brauchbare Ortung ist alles false; dann trägt der Ablauf allein. */
function zoneLage(a){
  const leer = { beiAbholung:false, beiKunde:false, faehrt:false, zone:null, frisch:false };
  if (!a || !a.planung || !a.planung.zugmaschineId) return leer;
  const z = zugVon(a.planung.zugmaschineId);
  const t = z && z.telematik;
  if (!t || !t.verbunden || !t.gpsGueltig) return leer;
  if (!zeitstempelPruefen(t.letzteMeldung, "Ortungszeitpunkt").ok) return leer;

  const zAb = geofenceFuer(a.abhol.adresse, a.abhol.firma);
  const zKu = geofenceFuer(a.liefer.adresse, a.liefer.firma);
  const beiAbholung = inZone(t.latitude, t.longitude, zAb);
  const beiKunde    = inZone(t.latitude, t.longitude, zKu);
  return { beiAbholung, beiKunde, frisch:true,
           faehrt: !!t.bewegung && !beiAbholung && !beiKunde,
           zone: beiKunde ? zKu : beiAbholung ? zAb : null };
}

/* Anzeige intern. Ersetzt die frühere eigene Ableitung — dieselben
   Wörter wie bisher, nur jetzt aus der zentralen Engine. */
function schritt(a){
  const st = transportStatus(a);
  const w = STATUS_WOERTER[st] || STATUS_WOERTER.geplant;
  return { wort:w.intern, klasse:w.klasse, status:st };
}

/* Wie zuverlässig laufen die Statuswechsel bei diesem Auftrag von
   allein? Die Dispo muss wissen, worauf sie sich verlässt. */
function automatisierungsGrad(a){
  const z = a && a.planung ? zugVon(a.planung.zugmaschineId) : null;
  const t = z && z.telematik;
  const zAb = geofenceFuer(a.abhol.adresse, a.abhol.firma);
  const zKu = geofenceFuer(a.liefer.adresse, a.liefer.firma);
  if (!t || !t.verbunden)
    return { stufe:"keine", wort:"Nur manuelle Statusmeldungen", klasse:"m-grau",
             grund:"Für dieses Fahrzeug ist kein Telematikgerät verbunden." };
  if (!t.gpsGueltig || !zeitstempelPruefen(t.letzteMeldung, "Ortungszeitpunkt").ok)
    return { stufe:"gps-alt", wort:"GPS fehlt oder ist veraltet", klasse:"m-gelb",
             grund:"Letzte Meldung " + (t.letzteMeldung ? hhmm(t.letzteMeldung) + " Uhr" : "unbekannt") +
                   ". Solange gilt nur, was gemeldet wird." };
  if (!zAb || !zKu)
    return { stufe:"teil", wort:"GPS aktiv, Zone fehlt", klasse:"m-gelb",
             grund:"Für " + (!zAb ? "die Abholstelle" : "den Lieferort") +
                   " ist keine Zone hinterlegt. Ankunft dort wird nicht automatisch erkannt." };
  if (a.automatik && a.automatik.an === false)
    return { stufe:"aus", wort:"Automatik ausgeschaltet", klasse:"m-gelb",
             grund:"Die Dispo hat die automatischen Statuswechsel für diesen Auftrag abgeschaltet." };
  return { stufe:"voll", wort:"GPS + Geofence aktiv", klasse:"m-gruen",
           grund:"Ankunft und Abfahrt an beiden Zonen werden automatisch erkannt." };
}

/* ===========================================================
   6c · Ereignisprotokoll und Zero-Touch-Automatik

   Zwei Grundsätze:

   1. Jeder Eintrag im Verlauf sagt, woher er kommt. „Beim Kunden
      angekommen“ ist etwas anderes, wenn es das GPS gemeldet hat, als
      wenn der Fahrer es gedrückt hat.

   2. Automatisch gesetzt wird nur, was technisch sicher ist. Dass ein
      Fahrzeug eine Zone betritt, ist eine Messung. Dass ein CMR
      unterschrieben ist, ist es nicht — das wird vorgeschlagen und
      bleibt eine Bestätigung.
   =========================================================== */
const QUELLEN = {
  automatisch: { wort:"Automatisch", klasse:"q-auto",   erklaer:"aus Ortung und Zone erkannt" },
  fahrer:      { wort:"Fahrer",      klasse:"q-fahrer", erklaer:"vom Fahrer gemeldet" },
  dispo:       { wort:"Dispo",       klasse:"q-dispo",  erklaer:"von der Disposition eingetragen" },
  system:      { wort:"System",      klasse:"q-system", erklaer:"von TWISTLOCK berechnet" },
  ki:          { wort:"Assistent",   klasse:"q-ki",     erklaer:"vom Dispo-Assistenten" }
};

/* Einen Verlaufseintrag schreiben. Einzige Stelle dafür — damit keine
   Quelle vergessen wird. */
function protokoll(a, quelle, text){
  if (!a) return;
  if (!Array.isArray(a.verlauf)) a.verlauf = [];
  a.verlauf.push({ zeit:jetztIso(), text, quelle:quelle || "system" });
}

/* ---- Zonenwechsel erkennen ----
   Verglichen wird die aktuelle Lage mit der zuletzt gespeicherten. Nur
   bei einer Änderung entsteht ein Ereignis — sonst liefe bei jedem
   Zeichnen dasselbe noch einmal durch. */
function zonenWechsel(a){
  const raus = [];
  const lage = zoneLage(a);
  if (!lage.frisch) return raus;
  const vorher = a.zoneStand || null;
  const jetztZone = lage.beiKunde ? "kunde" : lage.beiAbholung ? "abholung" : "strecke";
  if (vorher === jetztZone) return raus;

  if (vorher === "abholung" && jetztZone !== "abholung") raus.push({ art:"verlassen", zone:"abholung" });
  if (vorher === "kunde"    && jetztZone !== "kunde")    raus.push({ art:"verlassen", zone:"kunde" });
  if (jetztZone === "abholung") raus.push({ art:"betreten", zone:"abholung" });
  if (jetztZone === "kunde")    raus.push({ art:"betreten", zone:"kunde" });
  a.zoneStand = jetztZone;
  return raus;
}

/* Ein Vorschlag ist kein Status. Er steht sichtbar am Auftrag und wartet
   auf ein Ja — von der Dispo oder vom Fahrer. */
function vorschlagAnlegen(a, schluessel, titel, text){
  if (!Array.isArray(a.vorschlaege)) a.vorschlaege = [];
  if (a.vorschlaege.some(x => x.schluessel === schluessel && !x.erledigt)) return false;
  a.vorschlaege.push({ id:"vs"+Date.now()+Math.random().toString(36).slice(2,5),
                       schluessel, titel, text, zeit:jetztIso(), erledigt:false });
  return true;
}

/* Die Automatik. Läuft bewusst nur an klar benannten Stellen: beim Start
   und nach jedem simulierten Ereignis — nicht bei jedem Zeichnen.
   Rückgabe: Anzahl der Änderungen, damit der Aufrufer weiß, ob sich
   überhaupt etwas getan hat. */
function automatikLauf(){
  let n = 0;
  D.auftraege.forEach(a => {
    if (a.storniert || a.ablauf.abgabe) return;
    if (!a.automatik) a.automatik = { an:true, korrigiert:null, letzterWechsel:null };
    if (!a.automatik.an) return;

    zonenWechsel(a).forEach(w => {
      D.geofenceEreignisse.unshift({ zeit:jetztIso(), auftragId:a.id,
                                     zone:w.zone, art:w.art });
      if (D.geofenceEreignisse.length > 80) D.geofenceEreignisse.length = 80;

      /* --- technisch sicher: hier wird gesetzt --- */
      if (w.art === "betreten" && w.zone === "kunde" && !a.ablauf.ankunft && a.ablauf.abholung) {
        a.ablauf.ankunft = jetztIso();
        a.automatik.letzterWechsel = jetztIso();
        protokoll(a, "automatisch", "Zone „" + a.liefer.firma + "“ betreten – beim Kunden angekommen");
        n++;
      }
      if (w.art === "betreten" && w.zone === "abholung" && !a.ablauf.abholung) {
        protokoll(a, "automatisch", "Zone „" + a.abhol.firma + "“ betreten – an der Abholstelle");
        n++;
      }

      /* --- nicht sicher ableitbar: hier wird nur vorgeschlagen --- */
      if (w.art === "verlassen" && w.zone === "abholung" && !a.ablauf.abholung) {
        if (vorschlagAnlegen(a, "abholung", "Container übernommen?",
              "Das Fahrzeug hat die Abholstelle verlassen. Ob der Container wirklich " +
              "auf dem Chassis ist, kann die Ortung nicht wissen – bitte bestätigen.")) n++;
      }
      if (w.art === "verlassen" && w.zone === "kunde" && a.ablauf.ankunft && !a.ablauf.abgabe) {
        if (vorschlagAnlegen(a, "abgabe", "Transport abgeschlossen?",
              "Das Fahrzeug hat den Lieferort verlassen. Ob Ablieferung und Papiere " +
              "vollständig sind, lässt sich daraus nicht schließen – bitte bestätigen.")) n++;
      }
    });

    /* Steht das Fahrzeug beim Kunden und ist angekommen, aber es wurde
       noch kein Warten vermerkt? Stillstand in der Kundenzone ist eine
       Messung, kein Geschäftsvorgang — das darf gesetzt werden. */
    const lage = zoneLage(a);
    if (lage.beiKunde && a.ablauf.ankunft && !a.ablauf.warten && !a.ablauf.entladenStart) {
      const z = zugVon(a.planung.zugmaschineId);
      const steht = z && z.telematik && !z.telematik.bewegung && z.telematik.geschwindigkeit === 0;
      if (steht && minZw(a.ablauf.ankunft, jetztIso()) >= 2) {
        a.ablauf.warten = jetztIso();
        protokoll(a, "automatisch", "Fahrzeug steht beim Kunden – Aufenthalt begonnen");
        n++;
      }
    }
    /* Entladung selbst ist nie sicher messbar: Rampe, Stapler, Papiere —
       davon sieht die Ortung nichts. Also nur ein Vorschlag. */
    if (a.ablauf.warten && !a.ablauf.entladenStart &&
        minZw(a.ablauf.warten, jetztIso()) >= 10) {
      if (vorschlagAnlegen(a, "entladenStart", "Entladung begonnen?",
            "Das Fahrzeug steht seit " + Math.round(minZw(a.ablauf.warten, jetztIso())) +
            " Minuten beim Kunden. Ob die Entladung läuft, kann die Ortung nicht erkennen.")) n++;
    }
  });
  if (n) speichern();
  return n;
}

/* Vorschlag annehmen — von Dispo oder Fahrer. Erst hier wird geschrieben. */
function vorschlagAnnehmen(a, id, quelle){
  const vs = (a.vorschlaege || []).find(x => x.id === id);
  if (!vs || vs.erledigt) return false;
  const wer = quelle || "dispo";
  if (vs.schluessel === "abholung" && !a.ablauf.abholung) {
    a.ablauf.abholung = jetztIso();
    protokoll(a, wer, "Containerübernahme bestätigt");
  } else if (vs.schluessel === "entladenStart" && !a.ablauf.entladenStart) {
    a.ablauf.entladenStart = jetztIso();
    if (!a.ablauf.warten) a.ablauf.warten = jetztIso();
    protokoll(a, wer, "Entladung begonnen bestätigt");
  } else if (vs.schluessel === "abgabe" && !a.ablauf.abgabe) {
    if (!a.ablauf.entladenEnde) a.ablauf.entladenEnde = jetztIso();
    a.ablauf.abgabe = jetztIso();
    protokoll(a, wer, "Ablieferung bestätigt");
  } else {
    vs.erledigt = true; return false;
  }
  vs.erledigt = true; vs.angenommen = true;
  ketteRechnen(); speichern();
  return true;
}
function vorschlagAblehnen(a, id){
  const vs = (a.vorschlaege || []).find(x => x.id === id);
  if (!vs) return false;
  vs.erledigt = true; vs.angenommen = false;
  protokoll(a, "dispo", "Vorschlag abgelehnt: " + vs.titel);
  speichern();
  return true;
}

/* ---- Manuelle Korrektur (Override) ----
   Die Dispo weiß manchmal mehr als das GPS. Eine Korrektur schaltet die
   Automatik für diesen Auftrag ab, damit der nächste Zonenwechsel sie
   nicht sofort wieder überschreibt. */
const SCHRITT_FELDER = [
  { k:"abholung",      wort:"Container übernommen" },
  { k:"ankunft",       wort:"Beim Kunden angekommen" },
  { k:"warten",        wort:"Aufenthalt begonnen" },
  { k:"entladenStart", wort:"Entladung begonnen" },
  { k:"entladenEnde",  wort:"Entladung fertig" },
  { k:"abgabe",        wort:"Transport abgeschlossen" }
];
function statusKorrigieren(a, feld, setzen){
  const def = SCHRITT_FELDER.find(x => x.k === feld);
  if (!def) return false;
  const vorher = a.ablauf[feld];
  a.ablauf[feld] = setzen ? jetztIso() : null;
  /* Ein späterer Schritt ohne den früheren wäre widersprüchlich. Beim
     Zurücknehmen fallen deshalb alle folgenden Schritte mit weg. */
  if (!setzen) {
    const ab = SCHRITT_FELDER.findIndex(x => x.k === feld);
    SCHRITT_FELDER.slice(ab+1).forEach(x => { a.ablauf[x.k] = null; });
  }
  a.automatik = a.automatik || {};
  a.automatik.an = false;
  a.automatik.korrigiert = jetztIso();
  protokoll(a, "dispo", (setzen ? "Status gesetzt: " : "Status zurückgenommen: ") + def.wort +
                        (vorher ? " (war " + hhmm(vorher) + " Uhr)" : "") +
                        " – Automatik für diesen Auftrag ausgeschaltet");
  ketteRechnen(); speichern();
  return true;
}

/* ===========================================================
   7 · Alarme
   Erst ab 20 Minuten berechneter Verspätung, nur einmal je Auftrag,
   und niemals aus unzuverlässigen Daten.
   =========================================================== */
function alarmePruefen(){
  let neu = 0;
  D.auftraege.forEach(a => {
    if (a.storniert || a.ablauf.abgabe || a.alarmGesendet) return;
    /* Wer schon da ist, kommt nicht mehr voraussichtlich zu spät.
       Ein Verspätungsalarm ist eine Vorhersage, keine Nachricht über
       etwas, das bereits eingetreten und im Ablauf sichtbar ist. */
    if (a.ablauf.ankunft) return;
    const zuv = datenZuverlaessig(a.datenZeit, a.ortungZeit);
    if (!zuv.ok) return;                       // unzuverlässig → kein Alarm
    const s = zeitstatus(a);
    if (s.res == null || s.res > -GRENZE_ALARM) return;
    a.alarmGesendet = true;
    meldungAnlegen({
      art:"verspaetung", auftragId:a.id,
      titel:"Voraussichtlich " + Math.abs(s.res) + " Minuten verspätet.",
      text:"Kunde " + a.kunde + ", Termin " + (massgeblich(a).zeit || "—") + " Uhr (" +
           massgeblich(a).art + "). Alarm ab " + GRENZE_ALARM +
           " Minuten, einmal je Auftrag."
    });
    a.verlauf.push(v(jetztIso(), "Verspätungsalarm ausgelöst (" + Math.abs(s.res) + " Min.)"));
    neu++;
  });

  // Containerabweichung und ungeprüfte Nummer als Meldung, einmalig
  D.auftraege.forEach(a => {
    if (a.container.abweichung && !D.meldungen.some(m => m.auftragId===a.id && m.art==="abweichung")) {
      meldungAnlegen({ art:"abweichung", auftragId:a.id,
        titel:"Containernummer stimmt nicht überein.",
        text:"Kunde " + a.kunde + "." });
      neu++;
    }
    if (a.container.ungeprueft && !D.meldungen.some(m => m.auftragId===a.id && m.art==="ungeprueft")) {
      meldungAnlegen({ art:"ungeprueft", auftragId:a.id,
        titel:"Containernummer noch ungeprüft.",
        text:"Die Nummer konnte nicht sicher gelesen werden. Kunde " + a.kunde + "." });
      neu++;
    }
  });
  return neu;
}
function meldungAnlegen(m){
  D.meldungen.unshift(Object.assign({ id:"m"+Date.now()+Math.random().toString(36).slice(2,6),
                                      zeit:jetztIso(), gesehen:false }, m));
}

/* ===========================================================
   7b · Verspätungsrisiko

   Nicht erst melden, wenn der Termin verloren ist. Das Risiko entsteht
   aus Dingen, die sich einzeln benennen lassen — deshalb liefert die
   Funktion immer auch die Gründe mit. Der Prozentwert ist eine
   Demo-Bewertung dieser Gründe, keine Statistik.
   =========================================================== */
function risikoBerechnen(a){
  if (!a || a.storniert || a.ablauf.abgabe)
    return { stufe:"keins", prozent:0, gruende:[], guete:null };
  /* Ein Risiko ist eine Aussage über den laufenden Tag. Für einen Auftrag
     nächste Woche gibt es nichts vorherzusagen — dort entscheidet die
     Planung, und dafür ist die Konfliktprüfung zuständig. */
  const laeuft = !!(a.ablauf.abholung || a.ablauf.ankunft || a.ablauf.entladenStart);
  if (!laeuft && a.tag !== HEUTE())
    return { stufe:"keins", prozent:0, gruende:[], guete:null,
             hinweis:"Noch kein laufender Tag – bewertet wird über die Planung, nicht über ein Risiko." };

  const gruende = [];
  let p = 0;
  const g = datenGuete(a);

  /* 1. Wie viel Reserve bleibt nach der laufenden Rechnung? */
  const s = zeitstatus(a);
  if (s.res != null) {
    if (s.res < 0)      { p += 55; gruende.push("Berechnete Ankunft liegt bereits " + Math.abs(s.res) + " Minuten nach dem Termin."); }
    else if (s.res < 10){ p += 30; gruende.push("Nur noch " + s.res + " Minuten Reserve bis zum Termin."); }
    else if (s.res < 20){ p += 15; gruende.push(s.res + " Minuten Reserve – wenig Spielraum für Störungen."); }
  } else if (!s.nurPlan) {
    p += 20; gruende.push("Ankunft derzeit nicht belastbar berechenbar.");
  }

  /* 2. Läuft die Entladung länger als geplant? */
  const e = entladeRest(a);
  if (e.unklar) { p += 20; gruende.push(e.grund || "Entladeende unklar."); }
  if (a.entladeVerlaengerung && !a.entladeVerlaengerung.unbekannt) {
    p += 15; gruende.push("Der Fahrer hat die Entladung um " +
                          a.entladeVerlaengerung.min + " Minuten verlängert.");
  }

  /* 3. Was sagen unsere eigenen Erfahrungen über diesen Kunden? */
  const lern = lernStandzeit(a.auftraggeberId, "entladung");
  if (lern.minuten != null && a.planung.entladenMin &&
      lern.minuten > a.planung.entladenMin + 10) {
    p += 15;
    gruende.push("Bei diesem Auftraggeber dauerte die Entladung bisher im Schnitt " +
                 lern.minuten + " Minuten, geplant sind " + a.planung.entladenMin + ".");
  }

  /* 4. Ist die Strecke gerade langsamer als der Planwert? */
  const z = zugVon(a.planung.zugmaschineId);
  const r = routeBerechnen(a.abhol.adresse, a.liefer.adresse, z, jetztIso());
  const plan = fahrzeit(a.abhol.adresse, a.liefer.adresse);
  if (laeuft && r.minuten != null && r.minuten > plan + 8) {
    p += 12;
    gruende.push("Aktuelle Routenlage " + r.minuten + " Minuten gegenüber " + plan +
                 " Minuten Planwert (" + (r.verkehr || "Demo-Annahme") + ").");
  }

  /* 5. Hängt ein Vorgänger? */
  if (a.rechnung2 && a.rechnung2.ausKette && s.res != null && s.res < 20) {
    p += 10; gruende.push("Der vorherige Auftrag dieser Tour verschiebt die Ankunft mit.");
  }

  /* 6. Bei schlechter Datenlage keine Genauigkeit vortäuschen. */
  if (g.stufe === "niedrig" && p > 0) {
    gruende.push("Datenqualität niedrig – die Einschätzung ist entsprechend grob.");
  }

  p = Math.max(0, Math.min(95, p));
  const stufe = p >= 55 ? "hoch" : p >= 25 ? "mittel" : p > 0 ? "niedrig" : "keins";
  return { stufe, prozent:p, gruende, guete:g.stufe,
           klasse: stufe === "hoch" ? "m-rot" : stufe === "mittel" ? "m-gelb"
                 : stufe === "niedrig" ? "m-marine" : "m-grau" };
}

/* Einmal je Durchlauf für alle Aufträge rechnen und am Auftrag ablegen.
   So muss keine Ansicht das je Zeile neu tun. */
function risikoRechnen(){
  D.auftraege.forEach(a => { a.risiko = risikoBerechnen(a); });
}
function risikoVon(a){
  if (!a.risiko) a.risiko = risikoBerechnen(a);
  return a.risiko;
}

/* ===========================================================
   8 · Doppelbelegung
   Eine gefährdete Planung darf gespeichert werden, bleibt aber
   sichtbar als Konflikt stehen.
   =========================================================== */
/* Wann ist das Gespann für diesen Auftrag wirklich gebunden?
   Nicht nur am Lieferort: Anfahrt zur Abholung, Warten und Beladen dort,
   Fahrt zum Kunden, Warten und Entladen, Restarbeiten, gegebenenfalls
   Rückgabe-/Depotstopp und die Übergangsfahrt zum nächsten Auftrag.
   Alle Werte sind ausdrücklich Demo-Planwerte.

   Gerechnet wird durchgehend mit echten Zeitpunkten, deshalb greift das
   auch über Mitternacht. Der Einsatztag spielt dabei keine Rolle. */
/* GEPLANTE Belegung: allein aus den vereinbarten Terminen und Planwerten.
   Das ist der Anspruch an die Planung — unabhängig davon, wie der Tag
   tatsächlich läuft. Sie ist die Grundlage der Konfliktprüfung: Ob zwei
   Aufträge zusammen passen, entscheidet sich am Plan, nicht daran, dass
   die Tourkette sie ohnehin hintereinander legt. */
function belegungGeplant(a){
  const p = a.planung || {};
  const abIso = zeitpunkt(a.abhol.datum, a.abhol.zeit);
  const anIso = zeitpunkt(a.liefer.datum, a.liefer.zeit);
  const fehlt = [];
  if (!abIso && !anIso) fehlt.push("Abhol- oder Liefertermin");
  if (p.entladenMin == null) fehlt.push("geplante Entladezeit");
  if (p.ladenMin == null)    fehlt.push("geplante Ladezeit");
  if (fehlt.length) return { unvollstaendig:true, fehlt };

  const fahrtHin = fahrzeit(a.abhol.adresse, a.liefer.adresse);
  const wartenAbhol = p.wartenAbholMin || 0;
  const abschnitte = [];
  let t, von;

  if (vortagBeladen(a)) {
    /* Am Vortag beladen: am Einsatztag entfallen Anfahrt zur Abholung,
       Warten und Beladen. Das Gespann startet mit der Fahrt zum Kunden.
       Es wird keine zusätzliche Fahrzeit erfunden — nur weggelassen,
       was an diesem Tag nicht mehr anfällt. */
    const losfahrt = anIso ? inMin(-fahrtHin, anIso) : null;
    if (!losfahrt) return { unvollstaendig:true, fehlt:["Liefertermin"] };
    von = losfahrt; t = losfahrt;
    abschnitte.push({ min:0, wort:"Am Vortag beladen — keine Beladezeit am Einsatztag" });
  } else {
    const abholStart = abIso || inMin(-(wartenAbhol + p.ladenMin + fahrtHin), anIso);
    von = inMin(-PLAN.anfahrtAbholung, abholStart);
    t = abholStart;
    abschnitte.push({ min:PLAN.anfahrtAbholung, wort:"Anfahrt zur Abholung" });
  }
  const weiter = (min, wort) => { if (min > 0) { abschnitte.push({min, wort}); t = inMin(min, t); } };

  if (!vortagBeladen(a)) {
    weiter(wartenAbhol, "Warten bei der Abholung");
    weiter(p.ladenMin, "Beladung");
  }
  weiter(fahrtHin, "Fahrt zum Kunden");
  if (anIso && new Date(t) < new Date(anIso))
    weiter(Math.round(minZw(t, anIso)), "Warten bis zum Liefertermin");
  weiter(p.wartenMin || 0, "Warten beim Kunden");
  weiter(p.entladenMin, "Entladung");
  weiter(PLAN.nacharbeit, "Restarbeiten");
  if (a.container && a.container.rueckgabeOrt) {
    weiter(PLAN.fahrtZumDepot, "Fahrt zur Leercontainer-Rückgabe");
    weiter(PLAN.depotstopp, "Rückgabe / Depotstopp");
  }
  weiter(PLAN.uebergang, "Übergangsfahrt zum nächsten Auftrag");
  return { von, bis:t, abschnitte, unvollstaendig:false };
}

/* AKTUELLE Belegung aus der Tourrechnung: was der Tag gerade hergibt.
   Eine verlängerte Entladung verschiebt sie; ein unklares Entladeende
   lässt sie offen. Beides wird getrennt von der geplanten Belegung
   ausgewiesen, damit nichts Altes als aktuelle Aussage durchgeht. */
function belegung(a){
  const geplant = belegungGeplant(a);
  if (geplant.unvollstaendig) return geplant;

  const r = tourErgebnis(a);
  if (!r) return { von:geplant.von, bis:geplant.bis, offen:false,
                   geplant, abschnitte:geplant.abschnitte, unvollstaendig:false };

  if (r.unklar || !r.belegungBis) {
    return { von:r.belegungVon || geplant.von, bis:null, offen:true,
             grund:r.grund || "Entladeende unklar",
             geplant, geplantBis:geplant.bis,
             abschnitte:r.abschnitte || [], unvollstaendig:false };
  }
  return { von:r.belegungVon, bis:r.belegungBis, offen:false,
           geplant, geplantBis:geplant.bis,
           abschnitte:r.abschnitte || [], unvollstaendig:false };
}

function konflikte(a){
  const raus = [];
  if (a.storniert || a.ablauf.abgabe) return raus;
  const b = belegung(a);
  if (!b || b.unvollstaendig) return raus;

  const ueberschneidet = (x, y) =>
    !!(x && y && x.von && x.bis && y.von && y.bis &&
       new Date(x.von) < new Date(y.bis) && new Date(y.von) < new Date(x.bis));

  D.auftraege.forEach(o => {
    /* Ein anderer Einsatztag schließt einen Konflikt NICHT aus — eine Tour
       kann über Mitternacht laufen. Deshalb wird hier nicht nach Tag gefiltert. */
    if (o.id === a.id || o.storniert || o.ablauf.abgabe) return;
    const ob = belegung(o);
    if (!ob || ob.unvollstaendig) return;

    /* Zwei Arten von Konflikt, beide zählen:
       - Der Plan selbst geht nicht auf (geplant gegen geplant).
       - Die tatsächliche Bindung frisst in das zugesagte Fenster des
         anderen hinein (aktuell gegen geplant). Damit ändert sich die
         Anzeige, sobald eine Entladung länger dauert. */
    const ueberlappt = ueberschneidet(b.geplant, ob.geplant) ||
                       ueberschneidet(b, ob.geplant) ||
                       ueberschneidet(b.geplant, ob);
    if (!ueberlappt) return;

    /* Wer ist zuerst dran? Daraus wird der konkrete Satz gebaut.
       Genannt wird die tatsächliche Bindung, ersatzweise die geplante. */
    const nimmBel = x => (x.bis ? x : x.geplant);
    const bA = nimmBel(b), bO = nimmBel(ob);
    const frueher = new Date(bA.von) <= new Date(bO.von) ? {auf:a, bel:bA} : {auf:o, bel:bO};
    const spaeter = frueher.auf === a ? {auf:o, bel:bO} : {auf:a, bel:bA};
    const satz = (frueher.bel.bis
        ? "Gebunden noch bis etwa " + hhmm(frueher.bel.bis) + " Uhr (Auftrag " +
          frueher.auf.nummer + ")."
        : "Bindung von Auftrag " + frueher.auf.nummer + " ist offen.") +
      " Nächste Abholung bereits um " +
      hhmm(inMin(PLAN.anfahrtAbholung, spaeter.bel.von)) + " Uhr.";

    const nimm = (was, wer) => raus.push({ was, wer, mit:o, satz });
    if (a.planung.fahrerId && a.planung.fahrerId === o.planung.fahrerId)
      nimm("Fahrer", (fahrerVon(a.planung.fahrerId)||{}).name);
    if (a.planung.zugmaschineId && a.planung.zugmaschineId === o.planung.zugmaschineId)
      nimm("Zugmaschine", (zugVon(a.planung.zugmaschineId)||{}).kennzeichen);
    if (a.planung.chassisId && a.planung.chassisId === o.planung.chassisId)
      nimm("Chassis", (chsVon(a.planung.chassisId)||{}).nummer);
  });
  return raus;
}

/* Mit welchen Aufträgen gibt es eine Überschneidung? Ein Auftrag wird
   einmal genannt, auch wenn Fahrer, Zugmaschine und Chassis gleichzeitig
   kollidieren — das ist dieselbe Überschneidung. */
function konfliktAuftraege(kf){
  const raus = [];
  kf.forEach(k => { if (raus.indexOf(k.mit.nummer) < 0) raus.push(k.mit.nummer); });
  return raus;
}

/* Lässt sich die Planung überhaupt prüfen? Fehlen Planwerte, wird das
   gesagt — „Kein Konflikt“ wäre dann eine unbelegte Behauptung. */
function konfliktLage(a){
  if (a.storniert || a.ablauf.abgabe) return { pruefbar:true, konflikte:[] };
  const b = belegung(a);
  if (b && b.unvollstaendig)
    return { pruefbar:false, konflikte:[], fehlt:b.fehlt };
  /* Offenes Entladeende: es gibt kein belastbares Belegungsende. Dann wird
     weder ein Konflikt noch „kein Konflikt“ behauptet. */
  if (b && b.offen)
    return { pruefbar:false, offen:true, konflikte:[], grund:b.grund,
             text:"Belegung offen – nächste Tour derzeit nicht sicher planbar." };
  return { pruefbar:true, konflikte:konflikte(a) };
}

/* ===========================================================
   9 · Kleine Helfer für die Anzeige
   =========================================================== */
function esc(x){
  return String(x == null ? "" : x)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
/* Containernummer lesbar: MSCU 123456-6 */
function contLesbar(s){
  if (!s) return "—";
  const t = String(s).toUpperCase().replace(/[^A-Z0-9]/g,"");
  if (t.length !== 11) return String(s);
  return t.slice(0,4)+" "+t.slice(4,10)+"-"+t.slice(10);
}
/* Prüfziffer nach ISO 6346 — das rechnet die Vorschau wirklich. */
function contGueltig(s){
  const t = String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  if (!/^[A-Z]{4}\d{7}$/.test(t)) return false;
  const werte = {A:10,B:12,C:13,D:14,E:15,F:16,G:17,H:18,I:19,J:20,K:21,L:23,M:24,N:25,
                 O:26,P:27,Q:28,R:29,S:30,T:31,U:32,V:34,W:35,X:36,Y:37,Z:38};
  let summe = 0;
  for (let i=0;i<10;i++){
    const z = t[i];
    const w = /\d/.test(z) ? Number(z) : werte[z];
    summe += w * Math.pow(2,i);
  }
  return (summe % 11) % 10 === Number(t[10]);
}
function marke(klasse, text, zusatz){
  return '<span class="marke '+klasse+'">'+esc(text)+'</span>' +
         (zusatz ? '<span class="neben">'+esc(zusatz)+'</span>' : '');
}
const simMarke = txt => '<span class="sim">'+esc(txt||"Simuliert")+'</span>';

/* ===========================================================
   10 · Zeichnen
   =========================================================== */
const BEREICHE = [
  { k:"tagesplan",  wort:"Tagesplan" },
  { k:"wochenplan", wort:"Wochenplan" },
  { k:"auftraege",  wort:"Aufträge" },
  { k:"smart",      wort:"Smart Dispo" },
  { k:"stamm",      wort:"Stammdaten" },
  { k:"meldungen",  wort:"Meldungen" }
];

/* ===========================================================
   10 · Auftraggeber-Ansicht (extern)

   Getrennte Oberfläche, aber dieselben Daten. Es gibt hier keine
   zweite Statuslogik, keine zweite Ankunftsberechnung und keine
   zweite Kopie der Aufträge — alles kommt aus denselben Funktionen,
   die auch die Dispo benutzt. Übersetzt wird nur die Sprache.

   Ein Token verweist auf einen Link-Datensatz. Erst dieser legt fest,
   was freigegeben ist. Aus der Adresse wird nichts übernommen außer
   dem Token selbst.
   =========================================================== */
const LINK_BASIS = "https://tracking.im-cargo.de/t/";
const linkAdresse = l => LINK_BASIS + l.token;
const kundeVon = id => (D.auftraggeber || []).find(k => k.id === id) || null;

function linkZustand(l){
  if (!l) return "unbekannt";
  if (l.status === "deaktiviert") return "deaktiviert";
  if (l.gueltigBis && HEUTE() > l.gueltigBis) return "abgelaufen";
  return "aktiv";
}

/* Auflösung eines Tokens. Später macht das der Server; der Aufbau ist
   hier schon derselbe: erst der Datensatz, dann die Aufträge — nie
   umgekehrt. Jeder Auftrag wird zusätzlich gegen die Auftraggeber-ID
   des Links geprüft. Ein Token kann damit nie einen fremden Auftrag
   öffnen, auch wenn eine ID irgendwo durchgereicht würde. */
function linkAufloesen(token){
  const l = (D.links || []).find(x => x.token === token);
  if (!l) return { ok:false, grund:"unbekannt" };
  const z = linkZustand(l);
  if (z !== "aktiv") return { ok:false, grund:z, link:l };
  const k = kundeVon(l.auftraggeberId);
  if (!k) return { ok:false, grund:"unbekannt", link:l };
  if (!k.externErlaubt) return { ok:false, grund:"gesperrt", link:l };

  let liste = [];
  if (l.art === "einzel") {
    const a = auftragVon(l.auftragId);
    if (a && a.auftraggeberId === l.auftraggeberId && !a.storniert && a.freigegeben) liste = [a];
  } else {
    const bis = tagPlusVon(l.wocheStart, 6);
    liste = D.auftraege.filter(a =>
      a.auftraggeberId && a.auftraggeberId === l.auftraggeberId &&
      !a.storniert && a.freigegeben &&
      a.tag >= l.wocheStart && a.tag <= bis);
  }
  /* Sortiert nach dem Termin, der auch angezeigt wird — der Anlieferung
     beim Auftraggeber. Der Abholtermin am Terminal ist seine Sache nicht. */
  liste = liste.slice().sort((x,y) => {
    if (x.tag !== y.tag) return x.tag < y.tag ? -1 : 1;
    const mx = externTermin(x).iso, my = externTermin(y).iso;
    if (!mx) return 1; if (!my) return -1;
    return new Date(mx) - new Date(my);
  });
  return { ok:true, link:l, kunde:k, auftraege:liste };
}

/* Kundensprache. Genommen wird der Zustand der zentralen Status-Engine
   und nur übersetzt — es gibt hier keine zweite Ableitung. */
function externStatus(a){
  const st = transportStatus(a);
  const w = STATUS_WOERTER[st] || STATUS_WOERTER.geplant;
  const klasse = st === "abgeschlossen" ? "x-fertig"
               : (st === "entladungFertig" || st === "angekommenKunde" || st === "nachlauf") ? "x-gut"
               : (st === "unterwegsKunde" || st === "entladung" || st === "warten" ||
                  st === "containerUebernommen" || st === "beiAbholung" ||
                  st === "anfahrtAbholung") ? "x-aktiv"
               : "x-plan";
  return { wort:w.extern, klasse, status:st };
}

/* Der für den Auftraggeber maßgebliche Termin ist immer die Anlieferung
   bei ihm. Der Abholtermin am Terminal ist unsere Sache, nicht seine. */
function externTermin(a){
  return { datum:a.liefer.datum, zeit:a.liefer.zeit,
           iso:zeitpunkt(a.liefer.datum, a.liefer.zeit) };
}

/* Erwartete Ankunft beim Auftraggeber. Genommen wird dieselbe Rechnung wie
   intern — nur eben das Feld für die Kundenankunft. Es gibt hier keine
   zweite Ankunftsberechnung. Trägt die Rechnung nicht, wird das gesagt und
   keine Uhrzeit behauptet. */
function externAnkunft(a){
  if (a.ablauf.abgabe)
    return { iso:null, text:null, sicher:false, fertig:true, hinweis:null };
  /* Wer da ist, ist da — das ist eine Tatsache, keine Vorhersage. */
  if (a.ablauf.ankunft)
    return { iso:a.ablauf.ankunft, text:hhmm(a.ablauf.ankunft) + " Uhr",
             sicher:true, angekommen:true, hinweis:null };

  const unklar = { iso:null, text:null, sicher:false,
                   hinweis:"Aktuelle Ankunftszeit momentan nicht zuverlässig bestimmbar." };
  const r = tourErgebnis(a);
  if (!r || r.unklar || !r.kundenAnkunft) return unklar;
  if (r.nurPlan)
    return { iso:r.kundenAnkunft, text:"wie geplant " + hhmm(r.kundenAnkunft) + " Uhr",
             sicher:true, nurPlan:true, hinweis:null };
  if (!datenZuverlaessig(a.prognoseZeit || a.datenZeit, a.ortungZeit).ok) return unklar;
  return { iso:r.kundenAnkunft, text:"ca. " + hhmm(r.kundenAnkunft) + " Uhr",
           sicher:true, hinweis:null };
}

/* Verspätung ist eine eigene Angabe neben dem Status, kein Ersatz dafür.
   Solange nur der Plan vorliegt, gibt es keine Verspätung zu melden —
   das wäre eine Aussage ohne Datengrundlage. */
function externVerspaetung(a){
  if (a.ablauf.abgabe) return null;
  const ank = externAnkunft(a);
  if (!ank.sicher || ank.nurPlan) return null;
  const res = reserve(externTermin(a).iso, ank.iso);
  if (res == null || res >= 0) return null;
  return { min:Math.abs(res), angekommen:!!ank.angekommen };
}

/* Wie alt ist die Ortung? Dieselbe Prüfung wie intern, nur anders
   formuliert. */
function externOrtung(a){
  if (!a.ortungZeit) return { frisch:false, alterMin:null, zeit:null };
  return { frisch: zeitstempelPruefen(a.ortungZeit, "Ortungszeitpunkt").ok,
           alterMin: Math.round(minZw(a.ortungZeit, jetztIso())), zeit:a.ortungZeit };
}

/* Zeitleiste aus dem vorhandenen Ablauf. Keine eigene Historie. */
function externZeitleiste(a){
  const punkte = [];
  if (a.bestaetigt)          punkte.push({ zeit:a.bestaetigt, wort:"Fahrer hat Auftrag erhalten" });
  if (a.ablauf.abholung)     punkte.push({ zeit:a.ablauf.abholung, wort:"Container übernommen" });
  if (a.ablauf.ankunft)      punkte.push({ zeit:a.ablauf.ankunft, wort:"Beim Empfänger angekommen" });
  if (a.ablauf.warten)       punkte.push({ zeit:a.ablauf.warten, wort:"Wartet auf Entladung" });
  if (a.ablauf.entladenStart)punkte.push({ zeit:a.ablauf.entladenStart, wort:"Entladung begonnen" });
  if (a.ablauf.entladenEnde) punkte.push({ zeit:a.ablauf.entladenEnde, wort:"Entladung abgeschlossen" });
  if (a.ablauf.abgabe)       punkte.push({ zeit:a.ablauf.abgabe, wort:"Transport abgeschlossen" });
  return punkte;
}

/* ---------- Externe Ansicht zeichnen ---------- */
function ansichtExtern(){
  const E = U.extern;
  const r = linkAufloesen(E.token);
  let h = externDemoLeiste();
  if (!r.ok) return h + externSperre(r.grund);

  const einzeln = E.auftragId
    ? r.auftraege.find(x => x.id === E.auftragId)   // nur aus der erlaubten Menge
    : (r.link.art === "einzel" ? r.auftraege[0] : null);

  if (E.auftragId && !einzeln) return h + externSperre("unbekannt");

  h += externKopf(r, einzeln);
  h += einzeln ? externEinzel(einzeln, r) : externWoche(r);
  h += externFuss();
  return h;
}

function externDemoLeiste(){
  if (!U.extern || !U.extern.demo) return "";
  return '<div class="x-demoleiste"><span class="x-demomarke">DEMO – Auftraggeberansicht</span>' +
    '<span class="x-demotext">So sieht der Auftraggeber den Link. Nur in dieser Vorschau sichtbar.</span>' +
    '<button class="x-zurueck" data-tun="externZurueck">Zurück zur Dispo</button></div>';
}

function externSperre(grund){

function externFuss(){

    '<button class="x-knopf" data-tun="externAktualisieren">Status aktualisieren</button>' +

/* Kalenderwoche nach ISO — nur für die Überschrift. */
function kwVon(datum){
  const d = new Date(datum + "T12:00:00");
  const t = new Date(d.getTime());
  t.setDate(t.getDate() + 3 - ((d.getDay() + 6) % 7));
  const ersterDo = new Date(t.getFullYear(), 0, 4);
  ersterDo.setDate(ersterDo.getDate() + 3 - ((ersterDo.getDay() + 6) % 7));
  return 1 + Math.round((t - ersterDo) / (7 * 86400000));
}

function externWoche(r){
  const l = r.link;
  const tage = [];
  for (let i = 0; i < 7; i++) tage.push(tagPlusVon(l.wocheStart, i));
  let h = '<main class="x-woche">';
  const gesamt = r.auftraege.length;
  h += '<p class="x-summe">' + gesamt + (gesamt === 1 ? " Transport" : " Transporte") +
       ' in dieser Woche</p>';
  tage.forEach(t => {
    const liste = r.auftraege.filter(a => a.tag === t);
    /* Leere Tage bleiben sichtbar, nehmen aber nur eine Zeile ein —
       sonst scrollt man auf dem Handy an nichts vorbei. */
    if (!liste.length) {
      h += '<section class="x-tag leer"><h2>' + esc(tagKurz(t)) +
           ' <span class="x-leer">Kein Transport geplant.</span></h2>';
      h += '</section>';
      return;
    }
    h += '<section class="x-tag">' + '<h2>' + esc(tagKurz(t)) + '</h2>';
    h += liste.map(a => externKarte(a)).join("");
    h += '</section>';
  });
  return h + '</main>';
}

/* Ein Satz zur Verspätung — vor der Ankunft eine Vorhersage, danach eine
   Feststellung. Beides darf nicht gleich klingen. */
function verspaetungSatz(vsp){
  if (!vsp) return "";
  return vsp.angekommen
    ? vsp.min + " Minuten später als geplant eingetroffen"
    : "Voraussichtliche Verspätung: ca. " + vsp.min + " Minuten";
}

function externKarte(a){
  const st = externStatus(a);
  const vsp = externVerspaetung(a);
  const m = externTermin(a);
  /* Nur die Kante bekommt die Farbe. Die Karte bleibt weiß — das Wort im
     Statusfeld sagt ohnehin, was gemeint ist. */
  return '<article class="x-karte ' + st.klasse.replace("x-","k-") +
    '" data-tun="externAuftrag" data-wert="' +
    esc(a.id) + '" tabindex="0">' +
    '<div class="x-karte-kopf">' +
      '<span class="x-nummer">Transport ' + esc(a.nummer) + '</span>' +
      '<span class="x-status ' + st.klasse + '">' + esc(st.wort) + '</span>' +
    '</div>' +
    '<div class="x-karte-leib">' +
      '<p class="x-route">' + esc(a.abhol.firma || "—") + ' → ' + esc(a.liefer.firma || "—") + '</p>' +
      '<p class="x-termin">Termin ' + esc(m.zeit ? m.zeit + " Uhr" : "—") + '</p>' +
      (a.container.erwartet
        ? '<p class="x-cont">Container ' + esc(contLesbar(a.container.erwartet)) + '</p>' : '') +
      (vsp ? '<p class="x-verspaetet">' + esc(verspaetungSatz(vsp)) + '</p>' : '') +

}

function externEinzel(a, r){
  const st = externStatus(a);
  const vsp = externVerspaetung(a);
  const m = externTermin(a);
  const ank = externAnkunft(a);
  const fertig = !!a.ablauf.abgabe;

  let h = '<main class="x-einzel">';
  if (r.link.art === "woche")
    h += '<button class="x-zurueck-liste" data-tun="externListe">← Zur Wochenübersicht</button>';

  h += '<div class="x-grossstatus ' + st.klasse + '">' +
    '<span class="x-grosswort">' + esc(st.wort) + '</span>' +

    '</div>';

  h += '<section class="x-block"><h2>Transport ' + esc(a.nummer) + '</h2><dl class="x-paar">' +
    xz("Ihre Referenz", a.kundenRef || "—") +
    xz("Container", a.container.erwartet ? contLesbar(a.container.erwartet) : "noch nicht zugeteilt") +
    xz("Von", (a.abhol.firma || "—") + (a.abhol.adresse ? ", " + a.abhol.adresse : "")) +
    xz("Nach", (a.liefer.firma || "—") + (a.liefer.adresse ? ", " + a.liefer.adresse : "")) +
    xz("Anlieferung geplant", (m.zeit ? m.zeit + " Uhr" : "—") + " am " + tagKurz(m.datum)) +

       fertig ? "Transport abgeschlossen" : (ank.text || ank.hinweis)) +

  h += externStandort(a);

function xz(was, wert){

}

/* Live-Standort. Nach Abschluss verschwindet er — dann gibt es nichts
   mehr zu verfolgen. Ist die Ortung zu alt, wird keine Ankunft mehr
   behauptet. */
function externStandort(a){
  if (a.ablauf.abgabe) return "";
  if (!a.ablauf.abholung || a.ablauf.ankunft) return "";
  if (!a.standort) return "";
  const o = externOrtung(a);
  let h = '<section class="x-block x-ortung"><h2>Live-Standort <span class="x-demo">Demo</span></h2>';
  h += '<dl class="x-paar">' + xz("Position", a.standort.text) +
       xz("Ziel", a.liefer.firma || "—") + '</dl>';
  if (o.frisch) {
    const ank = externAnkunft(a);
    h += '<p class="x-ortzeit">Zuletzt aktualisiert: ' + esc(hhmm(o.zeit)) + ' Uhr</p>';
    h += '<p class="x-ortzeit">Voraussichtliche Ankunft: ' +
         esc(ank.text || "momentan nicht zuverlässig bestimmbar") + '</p>';
  } else {
    h += '<p class="x-ortzeit">Standort zuletzt vor ' + (o.alterMin == null ? "längerer Zeit" : o.alterMin + " Minuten") +
         ' aktualisiert.</p>';
    h += '<p class="x-ortwarnung">Aktuelle Ankunftszeit momentan nicht zuverlässig bestimmbar.</p>';
  }
  h += '<p class="x-sim">Live-Standort – Demo. Die Position stammt aus Beispieldaten, ' +
       'nicht aus einer echten Ortung.</p>';
  return h + '</section>';
}
