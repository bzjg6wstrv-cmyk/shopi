/* ===========================================================
   12 · Bedienung
   =========================================================== */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-tun]");
  if (!el) return;
  const tun = el.getAttribute("data-tun");
  const wert = el.getAttribute("data-wert");
  const art = el.getAttribute("data-art");
  const a = auftragVon(U.auftragId);

  /* ---- Auftraggeberansicht ----
     Steht zuerst: in dieser Ansicht gibt es keine Dispo-Bedienung. */
  if (U.extern) {
    if (tun === "externZurueck") {
      U.extern = null; U.bereich = U.vorher || "tagesplan"; zeichne();
      window.scrollTo(0,0); return;
    }
    if (tun === "externAuftrag") {
      /* Geöffnet wird nur, was der Link ohnehin freigibt — geprüft wird
         das beim Zeichnen erneut, nicht hier. */
      U.extern = Object.assign({}, U.extern, { auftragId:wert });
      zeichne(); window.scrollTo(0,0); return;
    }
    if (tun === "externListe") {
      U.extern = Object.assign({}, U.extern, { auftragId:null });
      zeichne(); window.scrollTo(0,0); return;
    }
    if (tun === "externAktualisieren") {
      /* Bewusst ohne Datenänderung: es gibt keinen Server, der etwas
         Neues liefern könnte. Genau das sagt der Hinweis auch. */
      zeichne();
      frage("Status aktualisieren",
        "<p>Demo – keine echte Serveraktualisierung. Die Anzeige stammt aus den " +
        "Beispieldaten dieser Vorschau.</p><p>Später holt diese Schaltfläche den Stand " +
        "vom Server, oder der Stand kommt von selbst über eine offene Verbindung.</p>",
        [{ wort:"Verstanden", haupt:true }]);
      return;
    }
    if (tun === "bild") { bildZeigen(wert || "Foto", el.getAttribute("src")); return; }
    return;                       // alles andere ist hier nicht bedienbar
  }

  /* ---- Freigabelinks ---- */
  if (tun === "linkEinzelNeu") {
    const ziel = auftragVon(wert);
    if (!ziel || !ziel.auftraggeberId) return;
    const l = { token:tokenBauen(), art:"einzel", auftraggeberId:ziel.auftraggeberId,
                wocheStart:null, auftragId:ziel.id, erstellt:jetztIso(),
                gueltigBis:tagPlusVon(ziel.tag, 14), status:"aktiv" };
    D.links.push(l); speichern();
    U.notiz = "Freigabelink erzeugt. Er gibt genau diesen einen Transport frei — " +
              "keinen weiteren Auftrag dieses oder eines anderen Auftraggebers.";
    zeichne(); return;
  }
  if (tun === "linkWocheNeu") {
    const k = kundeVon(wert);
    if (!k) return;
    const feld = document.getElementById("wo_" + wert);
    const start = wochenStart((feld && feld.value) || HEUTE());
    const vorhanden = D.links.find(l => l.art === "woche" && l.auftraggeberId === k.id &&
                                        l.wocheStart === start && linkZustand(l) === "aktiv");
    if (vorhanden) {
      U.notiz = "Für " + k.firma + " gibt es für diese Woche bereits einen aktiven Link.";
      zeichne(); return;
    }
    D.links.push({ token:tokenBauen(), art:"woche", auftraggeberId:k.id,
                   wocheStart:start, auftragId:null, erstellt:jetztIso(),
                   gueltigBis:tagPlusVon(tagPlusVon(start, 6), 7), status:"aktiv" });
    speichern();
    U.notiz = "Wochen-Link für " + k.firma + " erzeugt. Er zeigt ausschließlich die " +
              "Transporte dieses Auftraggebers in dieser Woche.";
    zeichne(); return;
  }
  if (tun === "linkKopieren") {
    const l = (D.links || []).find(x => x.token === wert);
    if (!l) return;
    /* Kopieren kann in einer eingebetteten Vorschau verboten sein. Dann
       wird nichts behauptet — die Adresse steht ohnehin sichtbar da. */
    const adresse = linkAdresse(l);
    const melden = txt => frage("Freigabelink", "<p>" + esc(txt) + "</p>" +
      '<p><code style="word-break:break-all">' + esc(adresse) + '</code></p>' +
      '<p>Simulierter Freigabelink – kein echter Online-Zugriff.</p>',
      [{ wort:"Schließen", haupt:true }]);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(adresse)
        .then(() => melden("In die Zwischenablage kopiert."))
        .catch(() => melden("Kopieren hat der Browser nicht erlaubt. Adresse zum Abschreiben:"));
    } else {
      melden("Dieser Browser erlaubt kein Kopieren. Adresse zum Abschreiben:");
    }
    return;
  }
  if (tun === "linkVorschau") {
    U.vorher = U.bereich === "detail" || U.bereich === "formular"
      ? (U.vorher || "tagesplan") : U.bereich;
    externOeffnen(wert, null, true);
    return;
  }
  if (tun === "linkAus") {
    const l = (D.links || []).find(x => x.token === wert);
    if (!l) return;
    frage("Link deaktivieren?",
      "<p>Der Auftraggeber sieht danach nur noch den Satz „Dieser Transportlink wurde " +
      "deaktiviert.“ — keine Daten mehr.</p><p>Rückgängig machen lässt sich das nur, " +
      "indem ein neuer Link erzeugt wird.</p>",
      [{ wort:"Abbrechen" },
       { wort:"Deaktivieren", gefahr:true, tun:() => {
           l.status = "deaktiviert"; speichern();
           U.notiz = "Link deaktiviert. Er zeigt keine Daten mehr.";
           zeichne();
         } }]);
    return;
  }
  if (tun === "linkNeu") {
    const l = (D.links || []).find(x => x.token === wert);
    if (!l) return;
    frage("Link neu erzeugen?",
      "<p>Die bisherige Adresse wird ungültig. Wer sie gespeichert hat, sieht danach " +
      "nichts mehr und braucht die neue Adresse.</p>",
      [{ wort:"Abbrechen" },
       { wort:"Neu erzeugen", haupt:true, tun:() => {
           l.token = tokenBauen(); l.status = "aktiv"; l.erstellt = jetztIso();
           l.gueltigBis = l.art === "woche"
             ? tagPlusVon(tagPlusVon(l.wocheStart, 6), 7)
             : tagPlusVon(HEUTE(), 14);
           speichern();
           U.notiz = "Neue Adresse erzeugt. Die alte ist ab sofort ungültig.";
           zeichne();
         } }]);
    return;
  }
  if (tun === "kundeExtern") {
    const k = kundeVon(wert);
    if (!k) return;
    k.externErlaubt = !k.externErlaubt; speichern();
    U.notiz = k.externErlaubt
      ? "Externe Ansicht für " + k.firma + " erlaubt. Bestehende aktive Links zeigen wieder Daten."
      : "Externe Ansicht für " + k.firma + " gesperrt. Alle Links dieses Auftraggebers " +
        "zeigen ab sofort keine Daten mehr.";
    zeichne(); return;
  }
  if (tun === "dokExtern") {
    if (!a) return;
    const d = a.dokumente[Number(wert)];
    if (!d) return;
    d.extern = !d.extern;
    a.verlauf.push(v(jetztIso(), (d.extern ? "Dokument für Auftraggeber freigegeben: "
                                           : "Freigabe zurückgenommen: ") + d.art));
    speichern();
    U.notiz = d.extern
      ? d.art + " ist jetzt im Auftraggeber-Link sichtbar."
      : d.art + " ist im Auftraggeber-Link nicht mehr sichtbar.";
    zeichne(); return;
  }

  if (tun === "bereich") {
    U.bereich = wert; U.vorher = wert;
    U.notiz = null; U.fehler = {}; zeichne();
    document.getElementById("inhalt").focus();
    return;
  }
  if (tun === "tag") {
    U.tag = wert === "heute" ? HEUTE() : TAG_PLUS(1);
    U.notiz = null; zeichne(); return;
  }
  if (tun === "filter") { U.filter = wert; zeichne(); return; }
  if (tun === "oeffnen") {
    /* Herkunft merken, damit „Zurück“ wieder dorthin führt. */
    U.vorher = U.bereich === "detail" || U.bereich === "formular"
      ? (U.vorher || "tagesplan") : U.bereich;
    U.auftragId = wert; U.bereich = "detail"; U.notiz = null; zeichne();
    window.scrollTo(0,0); return;
  }
  /* Aus dem Wochenplan: öffnen, bearbeiten, Fahrer ändern — jeweils in die
     vorhandenen Ansichten, ohne zweite Auftragsmaske. */
  if (tun === "oeffnenAus" || tun === "bearbeitenAus" || tun === "fahrerAendernAus") {
    const ziel = auftragVon(wert);
    if (!ziel) return;
    U.vorher = el.getAttribute("data-aus") || "wochenplan";
    U.auftragId = ziel.id; U.notiz = null;
    if (tun === "oeffnenAus") { U.bereich = "detail"; zeichne(); window.scrollTo(0,0); return; }
    if (tun === "bearbeitenAus") {
      U.formular = formAus(ziel); U.fehler = {}; U.bereich = "formular";
      zeichne(); window.scrollTo(0,0); return;
    }
    /* Fahrer ändern benutzt denselben Dialog wie im Detail. */
    U.bereich = "detail"; zeichne(); window.scrollTo(0,0);
    const knopf = document.querySelector('[data-tun="fahrerAendern"]');
    if (knopf) knopf.click();
    return;
  }
  if (tun === "zurueck" || tun === "abbrechen") {
    U.bereich = U.vorher || "tagesplan";
    U.formular = null; U.fehler = {}; U.notiz = null; zeichne(); return;
  }
  if (tun === "wocheZurueck" || tun === "wocheVor" || tun === "wocheHeute") {
    const start = U.woche || wochenStart(U.tag || HEUTE());
    U.woche = tun === "wocheHeute" ? wochenStart(HEUTE())
            : tagPlusVon(start, tun === "wocheVor" ? 7 : -7);
    U.notiz = null; zeichne(); return;
  }
  if (tun === "neu") {
    U.formular = LEER_FORM(); U.formular.tag = U.tag;
    U.formular.abholDatum = U.tag; U.formular.lieferDatum = U.tag;
    U.fehler = {}; U.bereich = "formular"; U.notiz = null; zeichne(); window.scrollTo(0,0); return;
  }
  if (tun === "bearbeiten" && a) {
    U.formular = formAus(a); U.fehler = {}; U.bereich = "formular"; U.notiz = null;
    zeichne(); window.scrollTo(0,0); return;
  }
  if (tun === "entwurf") { formSpeichern(false); return; }
  if (tun === "freigabeSpeichern") { formSpeichern(true); return; }

  if (tun === "freigeben" && a) {
    const F = formAus(a);
    const E = pruefen(F, true);
    if (Object.keys(E).length) {
      U.formular = F; U.fehler = E; U.bereich = "formular";
      U.notiz = "Für die Freigabe fehlen noch Angaben — sie sind unten rot markiert.";
      zeichne(); return;
    }
    a.freigegeben = true;
    a.verlauf.push(v(jetztIso(),"Für Fahrer freigegeben (Demo)"));
    speichern();
    U.notiz = '<b>Demo-Freigabe.</b> Nichts wurde zugestellt — die Fahrer-App ist nicht verbunden.';
    zeichne(); return;
  }

  if (tun === "fahrerAendern" && a) {
    const opts = D.fahrer.map(f =>
      '<option value="'+f.id+'"'+(a.planung.fahrerId===f.id?" selected":"")+'>'+esc(f.name)+
      (f.aktiv?"":" — nicht verfügbar")+'</option>').join("");
    frage("Fahrer ändern",
      '<div class="feld"><label for="neuerFahrer">Neuer Fahrer</label>' +
      '<select id="neuerFahrer"><option value="">— nicht zugewiesen —</option>'+opts+'</select>' +
      '<div class="erklaer">Ein Fahrerwechsel ist eine wesentliche Änderung. Die Fahrer&shy;bestätigung ' +
      'wird dadurch wieder offen.</div></div>',
      [{wort:"Abbrechen"},
       {wort:"Fahrer übernehmen", haupt:true, tun:() => {
         const stand = standZumBearbeiten(a);
         const neu = document.getElementById("neuerFahrer").value || null;
         if (neu === stand.planung.fahrerId) {
           U.notiz = "Es wurde derselbe Fahrer gewählt — nichts geändert."; zeichne(); return;
         }
         const alt = fahrerVon(stand.planung.fahrerId), nf = fahrerVon(neu);
         const wortlaut = "Fahrer geändert: " + (alt?alt.name:"nicht zugewiesen") +
                          " → " + (nf?nf.name:"nicht zugewiesen");

         /* Ein Fahrerwechsel ist eine wesentliche Änderung und geht denselben
            Weg wie jede andere: bei einem freigegebenen Auftrag zuerst in den
            Entwurf, erst die Freigabe ändert, was der Fahrer sieht. */
         if (a.freigegeben) {
           const e = a.entwurf ? a.entwurf : formZuStand(formAus(a), a);
           e.planung = Object.assign({}, e.planung, { fahrerId:neu });
           e.gespeichert = jetztIso();
           a.entwurf = e;
           a.verlauf.push(v(jetztIso(), wortlaut + " — als Entwurf, noch nicht freigegeben"));
           speichern();
           U.notiz = '<b>Änderungen noch nicht freigegeben.</b> ' + esc(wortlaut) +
                     '. Der Fahrer sieht weiter den freigegebenen Stand — erst „Änderungen ' +
                     'freigeben“ übernimmt den Wechsel.';
         } else {
           a.planung.fahrerId = neu;
           a.verlauf.push(v(jetztIso(), wortlaut));
           ketteRechnen(); alarmePruefen(); speichern();
           U.notiz = esc(wortlaut) + ". Der Auftrag ist weiterhin ein Entwurf.";
         }
         zeichne();
       }}]);
    return;
  }

  if (tun === "entwurfFreigeben" && a) {
    if (!a.entwurf) { U.notiz = "Es liegt kein Änderungsentwurf vor."; zeichne(); return; }
    const F = formAus(a);                 // liest den Entwurfsstand
    const E = pruefen(F, true);
    if (Object.keys(E).length) {
      U.formular = F; U.fehler = E; U.bereich = "formular";
      U.notiz = "Für die Freigabe der Änderungen fehlen noch Angaben — unten rot markiert.";
      zeichne(); window.scrollTo(0,0); return;
    }
    const vorher = wesentlichesAus(a);
    standSetzen(a, a.entwurf);
    a.entwurf = null;
    const wesentlich = vorher !== wesentlichesAus(a);
    a.verlauf.push(v(jetztIso(), "Änderungen freigegeben (Demo)" +
      (wesentlich ? " — wesentliche Angaben geändert" : "")));
    if (wesentlich && a.bestaetigt) {
      a.bestaetigt = null;
      a.verlauf.push(v(jetztIso(), "Wesentliche Änderung — Fahrerbestätigung ist wieder offen"));
    }
    a.prognoseZeit = jetztIso();
    ketteRechnen(); alarmePruefen(); speichern();
    U.notiz = '<b>Demo-Freigabe.</b> Die Änderungen sind jetzt der freigegebene Stand.' +
      (wesentlich ? ' Die Fahrerbestätigung ist wieder offen.' : '') +
      ' Es wurde nichts zugestellt — die Fahrer-App ist nicht verbunden.';
    zeichne(); return;
  }

  if (tun === "entwurfVerwerfen" && a) {
    if (!a.entwurf) { U.notiz = "Es liegt kein Änderungsentwurf vor."; zeichne(); return; }
    frage("Änderungen wirklich verwerfen?",
      '<p>Der Änderungsentwurf zu Auftrag <b>'+esc(a.nummer)+'</b> wird gelöscht. ' +
      'Der zuletzt freigegebene Stand bleibt unverändert bestehen.</p>' +
      '<p style="margin-top:8px">Das lässt sich nicht rückgängig machen.</p>',
      [{wort:"Nein, behalten"},
       {wort:"Ja, verwerfen", gefahr:true, tun:() => {
         a.entwurf = null;
         a.verlauf.push(v(jetztIso(), "Änderungsentwurf verworfen"));
         speichern();
         U.notiz = "Der Änderungsentwurf ist verworfen. Der freigegebene Stand gilt unverändert.";
         zeichne();
       }}]);
    return;
  }

  if (tun === "kopieren" && a) {
    frage("Auftrag kopieren",
      '<p>Die wiederkehrende Tour wird übernommen. Erledigte Zustände, Fotos, Zeitpunkte und ' +
      'die Fahrerbestätigung werden zurückgesetzt.</p>' +
      '<div class="feld" style="margin-top:12px"><label for="kopieTag">Neues Datum</label>' +
      '<input type="date" id="kopieTag" value="'+esc(TAG_PLUS(1))+'"></div>' +
      '<p style="margin-top:10px"><b>Bitte erneut prüfen:</b> Containernummer und Referenz- / ' +
      'Freistellnummer werden nicht übernommen, weil sie je Sendung verschieden sind.</p>',
      [{wort:"Abbrechen"},
       {wort:"Kopie anlegen", haupt:true, tun:() => {
         const neuTag = document.getElementById("kopieTag").value;
         if (!neuTag) { U.notiz = "Ohne neues Datum wurde keine Kopie angelegt."; zeichne(); return; }
         D.laufNummer++;
         const k = JSON.parse(JSON.stringify(a));
         k.id = "a"+Date.now(); k.nummer = String(D.laufNummer);
         k.tag = neuTag;
         k.abhol.datum = neuTag; k.liefer.datum = neuTag;
         k.abhol.referenz = "";                       // je Sendung verschieden
         k.container.erwartet = "";                   // muss neu geprüft werden
         k.container.bestaetigt = null; k.container.siegel = "";
         k.container.abweichung = false; k.container.ungeprueft = false; k.container.trotzdem = false;
         k.container.rueckgabeTermin = null;
         k.ablauf = { abholung:null, ankunft:null, warten:null, entladenStart:null,
                      entladenEnde:null, abgabe:null };
         k.entladeVerlaengerung = null;
         k.fotos = { abholung:null, abgabe:null };
         k.dokumente = [];
         k.bestaetigt = null; k.freigegeben = false; k.storniert = false;
         k.alarmGesendet = false; k.prognose = null;
         k.ortungZeit = null; k.datenZeit = null;
         k.verlauf = [ v(jetztIso(), "Kopie von Auftrag " + a.nummer + " für " + tagLang(neuTag)) ];
         D.auftraege.push(k);
         speichern();
         U.auftragId = k.id; U.tag = neuTag; U.bereich = "detail";
         U.notiz = '<b>Kopie angelegt als Entwurf.</b> Containernummer und Freistellnummer sind ' +
                   'bewusst leer — bitte für diese Sendung neu eintragen und prüfen.';
         zeichne(); window.scrollTo(0,0);
       }}]);
    return;
  }

  if (tun === "anrufen" && a) {
    const f = fahrerVon(a.planung.fahrerId);
    frage("Fahrer anrufen",
      f ? '<p>In der fertigen App würde jetzt <b>'+esc(f.telefon)+'</b> ('+esc(f.name)+') gewählt.</p>' +
          '<p style="margin-top:8px">In dieser Vorschau wird <b>nicht</b> angerufen.</p>' +
          '<p style="margin-top:8px">Dispo-Telefon: <b>0421 98994620</b></p>'
        : '<p>Diesem Auftrag ist kein Fahrer zugewiesen.</p>',
      [{wort:"Schließen", haupt:true}]);
    return;
  }

  if (tun === "stornieren" && a) {
    frage("Auftrag wirklich stornieren?",
      '<p>Auftrag <b>'+esc(a.nummer)+'</b> für <b>'+esc(a.kunde)+'</b> wird storniert und zählt ' +
      'nicht mehr im Tagesplan. Der Verlauf bleibt erhalten.</p>',
      [{wort:"Nein, behalten"},
       {wort:"Ja, stornieren", gefahr:true, tun:() => {
         a.storniert = true;
         a.verlauf.push(v(jetztIso(),"Auftrag storniert"));
         speichern();
         U.notiz = "Auftrag "+a.nummer+" ist storniert.";
         zeichne();
       }}]);
    return;
  }

  if (tun === "notizSpeichern" && a) {
    const feld = document.getElementById("notizfeld");
    a.dispoNotiz = feld ? feld.value : "";
    a.verlauf.push(v(jetztIso(),"Interne Dispo-Notiz geändert"));
    speichern();
    U.notiz = "Notiz gespeichert. Die Fahrerbestätigung bleibt unverändert — eine interne Notiz " +
              "ist keine wesentliche Änderung.";
    zeichne(); return;
  }

  if (tun === "dok" && a) {
    a.dokumente.push({ art:wert, name:wert+"-"+a.nummer+".pdf", stand:"hinterlegt (Demo, keine Datei)" });
    a.verlauf.push(v(jetztIso(), wert+" hinterlegt (Demo)"));
    speichern();
    U.notiz = wert+" wurde als Demo-Eintrag hinterlegt. Es wurde keine Datei hochgeladen.";
    zeichne(); return;
  }

  if (tun === "bild") {
    const bild = el.getAttribute("src");
    bildZeigen(wert || "Foto", bild);
    return;
  }

  /* Demo-Schritte des Fahrers, damit die Entladelogik erlebbar wird */
  if (tun === "fahrerschritt" && a) {
    if (wert === "verlaengern30" || wert === "verlaengern60") {
      const min = wert === "verlaengern30" ? 30 : 60;
      a.entladeVerlaengerung = { min, ab:jetztIso(), unbekannt:false };
      a.verlauf.push(v(jetztIso(), "Fahrer meldet: dauert " + min + " Minuten länger"));
      /* Nur die Prognose ist neu — geortet wurde dabei nichts. */
      a.prognoseZeit = jetztIso();
      ketteRechnen(); alarmePruefen();
      speichern();
      U.notiz = "Die neue Restzeit von " + min + " Minuten zählt ab jetzt — nicht ab dem " +
                "ursprünglichen Entladebeginn.";
    } else if (wert === "unbekannt") {
      a.entladeVerlaengerung = { min:null, ab:jetztIso(), unbekannt:true };
      a.verlauf.push(v(jetztIso(), "Fahrer meldet: Entladeende weiß er noch nicht"));
      a.prognoseZeit = jetztIso();
      ketteRechnen(); alarmePruefen();
      speichern();
      U.notiz = "Solange das Entladeende unbekannt ist, wird keine nächste Ankunft vorhergesagt.";
    } else if (wert === "entladenFertig") {
      a.ablauf.entladenEnde = jetztIso();
      a.entladeVerlaengerung = null;
      a.prognoseZeit = jetztIso();          // Ortungszeitpunkt bleibt, wie er war
      a.verlauf.push(v(jetztIso(), "Entladung fertig gemeldet"));
      ketteRechnen(); alarmePruefen();
      speichern();
      U.notiz = "Entladung beendet. Die Folgeankunft wird ab dem tatsächlichen Entladeende neu " +
                "gerechnet. Der Auftrag ist damit noch nicht abgeschlossen — die Ablieferung " +
                "bestätigt der Fahrer getrennt.";
    }
    zeichne(); return;
  }

  if (tun === "gesehen") {
    const m = D.meldungen.find(x => x.id === wert);
    if (m) {
      m.gesehen = true;
      const au = auftragVon(m.auftragId);
      if (au) au.verlauf.push(v(jetztIso(),"Meldung von der Dispo zur Kenntnis genommen"));
      speichern();
      U.notiz = "Meldung als gesehen markiert. Die Ursache ist damit nicht behoben.";
    }
    zeichne(); return;
  }

  /* Stammdaten */
  if (tun === "stammNeu" || tun === "stammBearbeiten") {
    stammDialog(art, tun === "stammBearbeiten" ? wert : null);
    return;
  }

  if (tun === "reset") {
    frage("Demodaten wirklich zurücksetzen?",
      '<p>Alle in dieser Vorschau eingegebenen Aufträge, Änderungen und Meldungen werden ' +
      'gelöscht und durch die ursprünglichen Beispieldaten ersetzt.</p>' +
      '<p style="margin-top:8px">Das lässt sich nicht rückgängig machen.</p>',
      [{wort:"Nein, behalten"},
       {wort:"Ja, zurücksetzen", gefahr:true, tun:() => {
         D = demoDaten(); alarmePruefen(); speichern();
         U.bereich = "tagesplan"; U.tag = HEUTE(); U.filter = "alle"; U.auftragId = null;
         U.notiz = "Die Beispieldaten sind wiederhergestellt.";
         zeichne(); window.scrollTo(0,0);
       }}]);
    return;
  }
});

/* Datumsauswahl */
document.addEventListener("change", e => {
  if (e.target.id === "tagwahl") {
    U.tag = e.target.value || HEUTE();
    U.notiz = null; zeichne();
  }
  /* „Noch unbekannt“ blendet die Nummernprüfung sinnvoll aus */
  if (e.target.id === "f_contUnbekannt" && U.formular) {
    U.formular = formLesen();
    U.fehler = {};
    zeichne();
  }
});

function stammDialog(art, id){
  const titel = { fahrer:"Fahrer", zug:"Zugmaschine", chassis:"Chassis" }[art] || "Eintrag";
  let leib = "";
  let vorhanden = null;
  if (art === "fahrer") {
    vorhanden = id ? D.fahrer.find(x => x.id === id) : null;
    leib =
      '<div class="feld"><label for="s_name">Name</label><input id="s_name" type="text" value="'+
        esc(vorhanden ? vorhanden.name : "")+'"></div>' +
      '<div class="feld" style="margin-top:10px"><label for="s_tel">Telefon</label>' +
        '<input id="s_tel" type="tel" value="'+esc(vorhanden ? vorhanden.telefon : "")+'"></div>' +
      '<div class="feld" style="margin-top:10px"><label for="s_spr">Sprache</label>' +
        '<select id="s_spr">' + ["Deutsch","Türkisch","Polnisch","Rumänisch","Arabisch"].map(s =>
          '<option'+(vorhanden && vorhanden.sprache===s ? " selected":"")+'>'+s+'</option>').join("") +
        '</select></div>' +
      '<div class="feld" style="margin-top:10px"><label><input id="s_aktiv" type="checkbox" '+
        'style="width:auto;min-height:0"'+(!vorhanden || vorhanden.aktiv ? " checked":"")+'> Aktiv (sonst: nicht verfügbar)</label></div>';
  } else if (art === "zug") {
    vorhanden = id ? D.zugmaschinen.find(x => x.id === id) : null;
    leib =
      '<div class="feld"><label for="s_kz">Kennzeichen</label><input id="s_kz" type="text" value="'+
        esc(vorhanden ? vorhanden.kennzeichen : "")+'"></div>' +
      '<div class="feld" style="margin-top:10px"><label><input id="s_aktiv" type="checkbox" '+
        'style="width:auto;min-height:0"'+(!vorhanden || vorhanden.aktiv ? " checked":"")+'> Aktiv (sonst: Werkstatt)</label></div>' +
      '<div class="feld" style="margin-top:10px"><label for="s_grund">Hinweis</label>' +
        '<input id="s_grund" type="text" value="'+esc(vorhanden ? (vorhanden.grund||"") : "")+'" ' +
        'placeholder="zum Beispiel: Werkstatt bis Freitag"></div>';
  } else {
    vorhanden = id ? D.chassis.find(x => x.id === id) : null;
    leib =
      '<div class="feld"><label for="s_nr">Kennzeichen oder interne Nummer</label>' +
        '<input id="s_nr" type="text" value="'+esc(vorhanden ? vorhanden.nummer : "")+'"></div>' +
      '<div class="feld" style="margin-top:10px"><label for="s_gr">Größe / Eignung</label>' +
        '<input id="s_gr" type="text" value="'+esc(vorhanden ? vorhanden.groesse : "")+'" ' +
        'placeholder="zum Beispiel: 40 ft Standard"></div>' +
      '<div class="feld" style="margin-top:10px"><label><input id="s_miete" type="checkbox" '+
        'style="width:auto;min-height:0"'+(vorhanden && vorhanden.gemietet ? " checked":"")+'> Gemietet</label></div>';
  }

  frage((id ? titel+" bearbeiten" : titel+" anlegen"), leib,
    [{wort:"Abbrechen"},
     {wort:"Speichern", haupt:true, tun:() => {
       const g = i => { const e = document.getElementById(i); return e ? e.value.trim() : ""; };
       const c = i => { const e = document.getElementById(i); return e ? e.checked : false; };
       if (art === "fahrer") {
         const name = g("s_name");
         if (!name) { U.notiz = "Ohne Namen wurde kein Fahrer gespeichert."; zeichne(); return; }
         const o = vorhanden || { id:"f"+Date.now() };
         o.name = name; o.telefon = g("s_tel"); o.sprache = g("s_spr"); o.aktiv = c("s_aktiv");
         if (!vorhanden) D.fahrer.push(o);
       } else if (art === "zug") {
         const kz = g("s_kz");
         if (!kz) { U.notiz = "Ohne Kennzeichen wurde keine Zugmaschine gespeichert."; zeichne(); return; }
         const o = vorhanden || { id:"z"+Date.now() };
         o.kennzeichen = kz; o.aktiv = c("s_aktiv"); o.grund = g("s_grund");
         if (!vorhanden) D.zugmaschinen.push(o);
       } else {
         const nr = g("s_nr");
         if (!nr) { U.notiz = "Ohne Nummer wurde kein Chassis gespeichert."; zeichne(); return; }
         const o = vorhanden || { id:"c"+Date.now() };
         o.nummer = nr; o.groesse = g("s_gr") || "—"; o.gemietet = c("s_miete");
         if (!vorhanden) D.chassis.push(o);
       }
       speichern();
       U.notiz = titel + " gespeichert. Der Eintrag steht jetzt in den Auftragsformularen zur Auswahl.";
       zeichne();
     }}]);
}

/* Für Prüfzwecke von außen lesbar. Die Oberfläche benutzt das nicht. */
window.DISPO = {
  zustand: () => ({ D, U }),
  linkAufloesen, linkZustand, linkAdresse, kundeVon, tokenBauen,
  externStatus, externVerspaetung, externAnkunft, externOrtung,
  externZeitleiste, externOeffnen,
  regeln: { GRENZE_ORANGE, GRENZE_ALARM, MAX_ALTER, PLAN },
  zeitstatus, konflikte, konfliktLage, belegung, prognose, folgePrognose,
  tourRechnen, tourErgebnis, zeitstempelPruefen, datenZuverlaessig, UHR_TOLERANZ,
  contGueltig, massgeblich, entladeRest, tourFolge, naechsterAuftrag,
  ketteRechnen, alarmePruefen, entwurfUnterschiede, fahrzeit,
  wochenStart, vortagBeladen, fruehterminHinweis, konfliktSaetze, planVergleich
};

start();
</script>
</body>
</html>
