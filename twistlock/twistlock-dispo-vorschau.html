<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15202B">
<title>TWISTLOCK Dispo — Demo-Vorschau</title>
<style>
/* ===========================================================
   TWISTLOCK Dispo — Demo-Vorschau für I&M CARGO, Bremen

   Eine Datei, keine Anhänge, kein Server. Farben und Begriffe
   sind bewusst dieselben wie in der Fahrer-Vorschau, damit beides
   als ein Produkt wirkt.

   Grundsatz der Gestaltung: Farbe ist nie die einzige Information.
   Neben jeder Farbe steht immer ein Satz, der sie erklärt.
   =========================================================== */
:root{
  --ink:#15202B;          /* Text                                 */
  --soft:#47525D;         /* Nebentext, Kontrast 7,4:1 auf Weiß   */
  --paper:#FFFFFF;
  --seite:#E9EBE7;
  --linie:#CBD0CC;
  --linie2:#E3E6E2;

  --gruen:#0A6B31;  --gruen-flaeche:#E4F1E9;
  --gelb:#8A5200;   --gelb-flaeche:#FBEFD6;
  --rot:#A3161D;    --rot-flaeche:#FAE8E8;
  --marine:#1B4C78; --marine-flaeche:#E8F0F7;
  --grau-flaeche:#F2F3F1;

  --rand:16px;
  --radius:10px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--seite);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:17px;
  line-height:1.45;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3{margin:0;line-height:1.2}
p{margin:0}
button{font-family:inherit}

:focus-visible{outline:3px solid var(--marine);outline-offset:2px;border-radius:4px}

/* ---------- Demo-Kopf ---------- */
.demo-kopf{background:var(--ink);color:#fff;padding:12px var(--rand)}
.demo-kopf .zeile{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.demo-marke{display:inline-block;padding:3px 9px;border-radius:4px;font-weight:700;
  background:#FFD34D;color:#2A1D00;letter-spacing:.06em;font-size:14px}
.demo-kopf h1{font-size:20px;font-weight:700}
.demo-kopf .uhr{margin-left:auto;font-size:15px;color:#D6DBD9;font-variant-numeric:tabular-nums}
.demo-kopf .unter{font-size:15px;color:#D6DBD9;margin-top:6px;max-width:96ch}

.demo-notiz{background:#FFF8E1;border-left:8px solid #B07100;color:#5E3A00;
  padding:10px 14px;font-size:15px}
.demo-notiz b{color:#4A2E00}

/* ---------- Gerüst ---------- */
.rahmen{display:flex;align-items:flex-start;gap:0;min-height:60vh}
.navi{flex:0 0 232px;background:var(--paper);border-right:2px solid var(--linie);
  padding:12px;position:sticky;top:0}
.navi button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:13px 12px;margin-bottom:8px;border:2px solid var(--linie);border-radius:var(--radius);
  background:var(--paper);color:var(--ink);font-size:17px;font-weight:600;cursor:pointer}
.navi button:hover{background:var(--grau-flaeche)}
.navi button[aria-current="page"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.navi .zahl{margin-left:auto;font-size:15px;font-weight:700;padding:1px 8px;border-radius:999px;
  background:var(--rot);color:#fff}
.navi button[aria-current="page"] .zahl{background:#fff;color:var(--rot)}

.inhalt{flex:1 1 auto;min-width:0;padding:var(--rand)}

/* ---------- Bausteine ---------- */
.karte{background:var(--paper);border:2px solid var(--linie);border-radius:var(--radius);
  padding:14px;margin-bottom:14px}
.karte > h2{font-size:20px;margin-bottom:10px}
.karte > h3{font-size:17px;margin-bottom:8px}

.btn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--ink);
  border-radius:var(--radius);background:var(--paper);color:var(--ink);
  padding:11px 15px;font-size:16px;font-weight:600;cursor:pointer;min-height:46px}
.btn:hover{background:var(--grau-flaeche)}
.btn.haupt{background:var(--ink);color:#fff}
.btn.haupt:hover{background:#25313D}
.btn.gross{font-size:18px;padding:14px 20px;min-height:54px}
.btn.gefahr{border-color:var(--rot);color:var(--rot)}
.btn.gefahr:hover{background:var(--rot-flaeche)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-reihe{display:flex;flex-wrap:wrap;gap:10px}

/* Statusfarben — immer mit erklärendem Text daneben */
.marke{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;
  border:2px solid;font-size:15px;font-weight:700;white-space:nowrap}
.m-gruen{color:var(--gruen);background:var(--gruen-flaeche);border-color:var(--gruen)}
.m-gelb {color:var(--gelb); background:var(--gelb-flaeche); border-color:var(--gelb)}
.m-rot  {color:var(--rot);  background:var(--rot-flaeche);  border-color:var(--rot)}
.m-grau {color:var(--soft); background:var(--grau-flaeche); border-color:var(--soft)}
.m-marine{color:var(--marine);background:var(--marine-flaeche);border-color:var(--marine)}
.m-ink  {color:#fff;background:var(--ink);border-color:var(--ink)}

.sim{display:inline-block;padding:1px 8px;border-radius:4px;background:#FFD34D;color:#2A1D00;
  font-size:13px;font-weight:700;letter-spacing:.04em;white-space:nowrap}

.hinweis{background:var(--marine-flaeche);border-left:8px solid var(--marine);color:#16324B;
  padding:10px 13px;border-radius:0 6px 6px 0;font-size:15px;margin-bottom:12px}
.warnkasten{background:var(--rot-flaeche);border-left:8px solid var(--rot);color:#5E1013;
  padding:10px 13px;border-radius:0 6px 6px 0;font-size:15px;margin-bottom:12px}

/* Kennzahlen — bewusst nur drei, als Text, ohne Diagramme */
.zahlen{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.zahl-feld{flex:1 1 190px;border:2px solid var(--linie);border-radius:var(--radius);
  background:var(--paper);padding:11px 13px}
.zahl-feld .gross{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.zahl-feld .wort{font-size:15px;color:var(--soft)}
.zahl-feld.achtung{border-color:var(--rot);background:var(--rot-flaeche)}
.zahl-feld.achtung .gross{color:var(--rot)}

/* Datumsleiste + Filter */
.leiste{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.leiste .tag{font-weight:700;font-size:18px}
input[type=date],input[type=time],input[type=text],input[type=tel],input[type=number],select,textarea{
  font-family:inherit;font-size:16px;padding:10px;border:2px solid var(--linie);
  border-radius:8px;background:var(--paper);color:var(--ink);min-height:46px;width:100%}
textarea{min-height:72px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--marine);outline:none}

.filter{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filter button{border:2px solid var(--linie);background:var(--paper);color:var(--ink);
  border-radius:999px;padding:8px 14px;font-size:16px;font-weight:600;cursor:pointer;min-height:44px}
.filter button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* Tabelle */
/* Die Tabelle hat viele Spalten. Statt sie abzuschneiden, darf dieser
   eine Kasten waagerecht rollen — die Seite selbst nie. Ohne das wäre
   die Schaltfläche „Öffnen“ am rechten Rand unerreichbar. */
.tabellen-karte{overflow-x:auto}
.tabelle{width:100%;border-collapse:collapse;background:var(--paper);min-width:940px}
.tabelle th,.tabelle td{text-align:left;padding:9px 8px;border-bottom:2px solid var(--linie2);
  vertical-align:top;font-size:16px}
.tabelle td:first-child,.tabelle th:first-child{white-space:nowrap}
.tabelle th{background:var(--grau-flaeche);font-size:15px;border-bottom:2px solid var(--linie)}
.tabelle tr.nichtzug{background:#FFF8E1}
.tabelle tr.nichtzug td{border-bottom-color:#E8D9A8}
.tabelle .haupt-zelle{font-weight:700}
.tabelle .neben{display:block;font-size:14px;color:var(--soft);font-weight:400}
.num{font-variant-numeric:tabular-nums}

.leer{padding:22px;text-align:center;color:var(--soft);background:var(--paper);font-size:17px}

/* Formular */
.gruppe{border:2px solid var(--linie);border-radius:var(--radius);padding:13px;margin-bottom:14px;
  background:var(--paper)}
.gruppe > legend{font-weight:700;font-size:18px;padding:0 6px}
.felder{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.feld label{display:block;font-size:15px;font-weight:600;margin-bottom:4px}
.feld .erklaer{font-size:14px;color:var(--soft);margin-top:3px}
.feld.breit{grid-column:1/-1}
.feld .fehler{display:block;font-size:15px;color:var(--rot);font-weight:600;margin-top:4px}
.feld.hatfehler input,.feld.hatfehler select,.feld.hatfehler textarea{border-color:var(--rot);background:#FFF9F9}

/* Detail */
.paar{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.paar .zeile{border-bottom:1px solid var(--linie2);padding:7px 0}
.paar .was{font-size:14px;color:var(--soft)}
.paar .wert{font-size:17px;font-weight:600}

.ablauf{list-style:none;margin:0;padding:0}
.ablauf li{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--linie2)}
.ablauf .zeit{flex:0 0 66px;font-weight:700;font-variant-numeric:tabular-nums}
.ablauf .offen{color:var(--soft);font-weight:400}

.foto{width:100%;max-width:340px;border:2px solid var(--linie);border-radius:8px;
  background:var(--ink);cursor:pointer;display:block}
.fotos{display:flex;flex-wrap:wrap;gap:12px}

.verlauf{list-style:none;margin:0;padding:0;font-size:15px}
.verlauf li{padding:6px 0;border-bottom:1px solid var(--linie2);color:var(--soft)}
.verlauf b{color:var(--ink)}

/* Meldungen */
.meldung{border:2px solid var(--linie);border-left-width:8px;border-radius:var(--radius);
  padding:12px;margin-bottom:10px;background:var(--paper)}
.meldung.warn{border-left-color:var(--rot);background:var(--rot-flaeche)}
.meldung.info{border-left-color:var(--marine);background:var(--marine-flaeche)}
.meldung.erledigt{opacity:.62;background:var(--grau-flaeche);border-left-color:var(--soft)}
.meldung h3{font-size:17px;margin-bottom:4px}
.meldung .wann{font-size:14px;color:var(--soft)}
.gegenueber{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0}
.gegenueber div{flex:1 1 190px;border:2px solid var(--linie);border-radius:8px;padding:9px;
  background:var(--paper)}
.gegenueber .was{font-size:14px;color:var(--soft)}
.gegenueber .wert{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.04em}

/* Dialog */
dialog{border:3px solid var(--ink);border-radius:12px;padding:0;max-width:560px;width:calc(100% - 28px);
  background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(21,32,43,.55)}
.dlg-kopf{padding:14px;border-bottom:2px solid var(--linie);font-size:19px;font-weight:700}
.dlg-leib{padding:14px;font-size:17px}
.dlg-fuss{padding:14px;border-top:2px solid var(--linie);display:flex;gap:10px;flex-wrap:wrap;
  justify-content:flex-end}
.bild-dlg{max-width:92vw}
.bild-dlg img{width:100%;display:block;background:var(--ink)}

/* Stammdaten */
.liste-zeile{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:11px 0;
  border-bottom:2px solid var(--linie2)}
.liste-zeile .name{font-weight:700;font-size:17px;flex:1 1 180px}
.liste-zeile .neben{font-size:15px;color:var(--soft)}

/* ---------- Wochenplan ----------
   Gleiche Bausteine wie sonst: weiße Karten, dieselben Statusmarken,
   Farbe nie allein. Keine Diagramme, kein Ziehen mit der Maus. */
.tabelle.woche{min-width:1180px}
.tabelle.woche th,.tabelle.woche td{vertical-align:top;width:13%}
.tabelle.woche .woche-name{width:9%;min-width:150px;background:var(--grau-flaeche)}
.woche-leer{color:var(--soft)}
.woche-offen{display:flex;flex-wrap:wrap;gap:10px}
.woche-offen .wkarte{flex:1 1 260px;max-width:340px}

.wkarte{border:2px solid var(--linie);border-left-width:6px;border-radius:10px;
  padding:8px 9px;margin-bottom:8px;background:var(--paper)}
.wkarte:last-child{margin-bottom:0}
.wkarte-konflikt{border-left-color:var(--rot)}
.wkarte-offen{border-left-color:#B07100;background:#FFFDF5}
.wkarte-kopf{display:block;width:100%;text-align:left;border:0;background:none;padding:0 0 4px;
  cursor:pointer;font-family:inherit;color:var(--ink)}
.wkarte-kopf:hover .wnummer{text-decoration:underline}
.wzeit{font-weight:700;font-size:17px}
.wnummer{font-weight:700;font-size:15px;margin-left:6px}
.wbezug{display:block;font-size:13px;color:var(--soft);font-weight:400}
.wzeile{font-size:14px;line-height:1.35}
.wzeile.neben{color:var(--soft)}
.wmarken{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.wmarken .marke{font-size:13px;padding:1px 7px;border-width:2px}
.whinweis{margin-top:6px;font-size:13px;font-weight:600;color:var(--gelb);
  background:var(--gelb-flaeche);border-left:5px solid var(--gelb);padding:4px 7px;border-radius:0 4px 4px 0}
.wkonflikt{margin-top:6px;font-size:13px;font-weight:600;color:var(--rot);
  background:var(--rot-flaeche);border-left:5px solid var(--rot);padding:4px 7px;border-radius:0 4px 4px 0}
.wtun{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.wtun .btn{font-size:14px;padding:7px 10px;min-height:38px}

/* Handy: Tabellen werden zu Karten, damit nichts quer gescrollt werden muss */
@media (max-width:820px){
  .rahmen{flex-direction:column}
  .navi{flex:1 1 auto;width:100%;position:static;border-right:0;border-bottom:2px solid var(--linie);
    display:flex;gap:8px;overflow-x:auto;padding:10px}
  .navi button{width:auto;margin-bottom:0;white-space:nowrap;flex:0 0 auto}
  .inhalt{padding:12px}
  .tabellen-karte{overflow-x:visible}
  .tabelle{min-width:0}
  .tabelle.woche{min-width:0}
  .tabelle.woche th,.tabelle.woche td,.tabelle.woche .woche-name{width:auto}
  .woche-offen .wkarte{max-width:none}
  .tabelle thead{display:none}
  .tabelle,.tabelle tbody,.tabelle tr,.tabelle td{display:block;width:100%}
  .tabelle tr{border:2px solid var(--linie);border-radius:var(--radius);margin-bottom:12px;
    background:var(--paper);padding:6px}
  .tabelle tr.nichtzug{border-color:#B07100}
  .tabelle td{border-bottom:1px solid var(--linie2);padding:8px 6px}
  .tabelle td:last-child{border-bottom:0}
  .tabelle td::before{content:attr(data-titel);display:block;font-size:13px;color:var(--soft);
    font-weight:600;margin-bottom:2px}
}
@media (max-width:820px){
  /* Beim Umbruch soll der Demo-Zeitpunkt links stehen, nicht mittig hängen. */
  .demo-kopf .uhr{margin-left:0;flex-basis:100%}
}
@media (max-width:520px){
  body{font-size:16px}
  .demo-kopf h1{font-size:18px}
}
/* Freigabelinks in der Dispo */
.link-kasten{
  border:1px solid var(--linie2); border-radius:var(--radius);
  padding:12px 14px; margin-top:10px; background:var(--grau-flaeche);
}
.link-kopf{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:8px; }
.link-was{ font-weight:700; }
.link-adresse{
  display:block; font-size:14px; word-break:break-all; background:#fff;
  border:1px solid var(--linie2); border-radius:8px; padding:8px 10px;
}
.link-gueltig{ margin:8px 0 10px; font-size:14px; color:var(--soft); }
.kunde-kasten{
  border:1px solid var(--linie2); border-radius:var(--radius);
  padding:12px 14px; margin-bottom:14px;
}
.sim-satz{ margin:12px 0 0; color:var(--soft); font-size:15px; }
.dok-liste{ list-style:none; margin:0; padding:0; }
.dok-liste li{
  display:flex; flex-wrap:wrap; gap:10px; align-items:center;
  padding:10px 0; border-bottom:1px solid var(--linie2);
}
.dok-liste li:last-child{ border-bottom:0; }
.dok-name{ flex:1 1 260px; }

/* ===========================================================
   Auftraggeber-Ansicht

   Bewusst anders als die Dispo: keine Tabellen, keine Ampeln,
   keine Werkzeugleisten. Der Auftraggeber soll einen Tracking-Link
   sehen, keine Speditionssoftware. Zuerst fürs Handy gebaut,
   die Breite kommt darüber.
   =========================================================== */
body.extern-an{ background:#F4F5F3; }
body.extern-an .demo-kopf,
body.extern-an .demo-notiz,
body.extern-an .navi{ display:none; }
body.extern-an .rahmen{ max-width:none; margin:0; padding:0; box-shadow:none; border:0; background:transparent; }
body.extern-an .inhalt{ padding:0; background:transparent; }

.x-seite{ max-width:760px; margin:0 auto; padding:0 14px 40px; }

.x-demoleiste{
  display:flex; flex-wrap:wrap; align-items:center; gap:10px;
  background:#15202B; color:#fff; padding:10px 14px;
}
.x-demomarke{
  background:#F0B323; color:#15202B; font-weight:800; font-size:13px;
  letter-spacing:.04em; padding:3px 9px; border-radius:6px;
}
.x-demotext{ font-size:14px; color:#D7DCE1; }
.x-zurueck{
  margin-left:auto; background:#fff; color:#15202B; border:0; cursor:pointer;
  font:inherit; font-weight:700; font-size:15px; padding:9px 14px; border-radius:8px;
  min-height:44px;
}
.x-zurueck:hover{ background:#E9EBE7; }

.x-kopf{ padding:26px 0 18px; border-bottom:2px solid var(--linie); margin-bottom:18px; }
.x-marke{ font-weight:800; letter-spacing:.09em; font-size:15px; color:#1B4C78; }
.x-kopf h1{ font-size:27px; line-height:1.2; margin:6px 0 10px; letter-spacing:-.01em; }
.x-kunde{ margin:0; font-size:18px; font-weight:700; }
.x-zeitraum{ margin:3px 0 0; color:var(--soft); font-size:16px; }

.x-summe{ margin:0 0 14px; color:var(--soft); font-size:15px; }

.x-tag{ margin-bottom:18px; }
.x-tag h2{
  font-size:15px; letter-spacing:.05em; text-transform:uppercase;
  color:var(--soft); margin:0 0 8px;
}
.x-tag.leer h2{ opacity:.72; }
.x-leer{ margin:0; color:var(--soft); font-size:15px; }
.x-tag.leer .x-leer{
  background:var(--grau-flaeche); border-radius:var(--radius); padding:11px 14px;
}

.x-karte{
  background:#fff; border:1px solid var(--linie2); border-left:5px solid var(--linie);
  border-radius:var(--radius); padding:14px 15px; margin-bottom:10px; cursor:pointer;
}
.x-karte:hover{ border-color:#9FA9A2; }
.x-karte:focus-visible{ outline:3px solid #1B4C78; outline-offset:2px; }
.x-karte-kopf{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:8px; }
.x-nummer{ font-weight:800; font-size:17px; }
.x-karte-leib p{ margin:2px 0; font-size:16px; }
.x-route{ font-weight:600; }
.x-termin, .x-cont{ color:var(--soft); }
.x-verspaetet{ color:var(--rot); font-weight:700; }
.x-mehr{ display:inline-block; margin-top:9px; font-size:15px; font-weight:700; color:#1B4C78; }

.x-status{
  font-size:14px; font-weight:700; padding:4px 10px; border-radius:20px;
  border:1px solid transparent; white-space:nowrap;
}
.x-plan  { background:var(--grau-flaeche);   color:var(--soft);  border-color:var(--linie); }
.x-aktiv { background:var(--marine-flaeche); color:var(--marine);border-color:#B9CFE3; }
.x-gut   { background:var(--gruen-flaeche);  color:var(--gruen); border-color:#B7DCC6; }
.x-fertig{ background:var(--gruen-flaeche);  color:var(--gruen); border-color:#B7DCC6; }

.x-karte.x-plan  { border-left-color:var(--linie); }

.x-zurueck-liste{
  background:none; border:0; font:inherit; font-size:16px; font-weight:700;
  color:#1B4C78; cursor:pointer; padding:10px 0; min-height:44px;
}
.x-zurueck-liste:hover{ text-decoration:underline; }

.x-grossstatus{
  border-radius:var(--radius); padding:20px 18px; margin:6px 0 18px;
  display:flex; flex-direction:column; gap:6px; border:1px solid transparent;
}
.x-grosswort{ font-size:25px; font-weight:800; line-height:1.2; }
.x-grossnote{ font-size:17px; font-weight:700; color:var(--rot); }

.x-block{
  background:#fff; border:1px solid var(--linie2); border-radius:var(--radius);
  padding:16px; margin-bottom:14px;
}
.x-block h2{ font-size:18px; margin:0 0 12px; }
.x-demo{

<script>
"use strict";

/* ===========================================================
   1 · Zeitrechnung
   Dieselben Regeln wie in der Fahrer-Vorschau:
     Reserve = Termin minus voraussichtliche Ankunft
       über 10 Min.      → grün
       0 bis 10 Min.     → orange
       unter 0           → rot
       keine/alte Daten  → grau
     Alarm erst ab 20 Min. berechneter Verspätung, einmal je Auftrag,
     und nur wenn Prognose und Ortung frisch genug sind.
   =========================================================== */
const GRENZE_ORANGE = 10;    // bis hierhin orange
const GRENZE_ALARM  = 20;    // ab hier Dispo-Alarm
const MAX_ALTER     = 10;    // Minuten, bis Daten als veraltet gelten

/* Fester Demo-Zeitpunkt: heutiges Datum, 10:30 Uhr Ortszeit.
   Absichtlich nicht die echte Uhr — sonst sähe der Beispieltag je nach
   Aufrufzeit anders aus und nachts läge er sogar auf dem Vortag.
   Die Ortung ist ohnehin simuliert; ein fester Zeitpunkt macht das ehrlich
   sichtbar und hält die Farben nachvollziehbar. */
const DEMO_JETZT = (() => { const d = new Date(); d.setHours(10,30,0,0); return d; })();
const jetzt    = () => new Date(DEMO_JETZT.getTime());
const jetztIso = () => jetzt().toISOString();
const inMin    = (m, ab) => new Date((ab ? new Date(ab) : jetzt()).getTime() + m*60000).toISOString();
const minZw    = (a, b) => (new Date(b) - new Date(a)) / 60000;

function hhmm(iso){
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d)) return null;
  return d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit",hour12:false});
}
function tagVon(iso){
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d)) return null;
  const p = n => String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}
/* Langer Zufallstoken. Aus ihm lässt sich nichts über den Auftrag
   ableiten — er verweist nur auf einen Link-Datensatz, und erst dieser
   legt fest, was freigegeben ist. Deshalb steht nie eine Auftragsnummer
   in der Adresse. */
function tokenBauen(){
  const zeichen = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let t = "";
  for (let i = 0; i < 24; i++) t += zeichen[Math.floor(Math.random()*zeichen.length)];
  return t;
}
function tagLang(datum){
  if (!datum) return "—";
  const d = new Date(datum+"T12:00:00");
  if (isNaN(d)) return datum;
  return d.toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"});
}
function tagKurz(datum){
  if (!datum) return "—";
  const d = new Date(datum+"T12:00:00");
  if (isNaN(d)) return datum;
  return d.toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"});
}
/* Datum + Uhrzeit zu einem echten Zeitpunkt. Fehlt eines, gibt es keinen. */
function zeitpunkt(datum, uhrzeit){
  if (!datum || !uhrzeit) return null;
  const d = new Date(datum+"T"+uhrzeit+":00");
  return isNaN(d) ? null : d.toISOString();
}
const HEUTE   = () => tagVon(jetztIso());
const TAG_PLUS = n => tagVon(inMin(n*1440));

/* Reserve in Minuten. Ohne beide Zeitpunkte gibt es keine Reserve. */
function reserve(terminIso, ankunftIso){
  if (!terminIso || !ankunftIso) return null;
  return Math.round(minZw(ankunftIso, terminIso));
}
function ampel(res){
  if (res == null) return "grau";
  if (res < 0) return "rot";
  if (res <= GRENZE_ORANGE) return "gelb";
  return "gruen";
}
/* Erlaubte Uhrabweichung: Geräteuhren gehen selten exakt. Ein Zeitstempel
   darf deshalb ein kleines Stück in der Zukunft liegen, ohne verworfen zu
   werden. Alles darüber ist unplausibel und wird nicht geglaubt. */
const UHR_TOLERANZ = 2;      // Minuten

/* Prüft EINEN Zeitstempel vollständig: vorhanden, überhaupt ein gültiges
   Datum mit endlichem Zeitwert, nicht veraltet, nicht unplausibel in der
   Zukunft. Eine bloße Zeichenfolge reicht nicht. */
function zeitstempelPruefen(wert, bezeichnung){
  if (wert == null || wert === "")
    return { ok:false, grund:"Kein " + bezeichnung + " vorhanden" };
  const d = new Date(wert);
  const ms = d.getTime();
  if (typeof ms !== "number" || !isFinite(ms) || isNaN(ms))
    return { ok:false, grund:bezeichnung + " ist unlesbar" };
  const alter = minZw(d.toISOString(), jetztIso());   // positiv = Vergangenheit
  if (alter < -UHR_TOLERANZ)
    return { ok:false, grund:bezeichnung + " liegt unplausibel in der Zukunft" };
  if (alter > MAX_ALTER)
    return { ok:false, grund:bezeichnung + " ist älter als " + MAX_ALTER + " Minuten" };
  return { ok:true, grund:null };
}

/* Sind Prognose UND Ortung brauchbar? Beide werden einzeln geprüft und
   bleiben getrennt — eine Neuberechnung macht keine alte Ortung frisch. */
function datenZuverlaessig(prognoseZeit, ortungZeit){
  const o = zeitstempelPruefen(ortungZeit, "Ortungszeitpunkt");
  if (!o.ok) return o;
  const p = zeitstempelPruefen(prognoseZeit, "Prognosezeitpunkt");
  if (!p.ok) return p;
  return { ok:true, grund:null };
}

/* ===========================================================
   2 · Demo-Planwerte
   Ausdrücklich Planwerte dieser Vorschau, keine Verkehrsdaten
   und keine Tachographendaten.
   =========================================================== */
const PLAN = {

  fahrtWalsrodeBremen: 75,
  fahrtOrtsnah:        20,
  anfahrtAbholung:     25,   // Weg zur Abholstelle, bevor dort etwas passiert
  laden:               30,
  entladen:           120,
  nacharbeit:          15,
  fahrtZumDepot:       25,   // Weg zur Leercontainer-Rückgabe

/* Fahrzeit zwischen zwei Adressen — reiner Demo-Planwert aus dem Ortsnamen.
   Kein Routing, keine Verkehrsdaten. Unbekannte Strecken bekommen den
   Standardwert, damit nie eine Fahrzeit von 0 Minuten unterstellt wird. */
function fahrzeit(vonAdresse, nachAdresse){
  const ort = s => {
    const t = String(s||"").toLowerCase();
    if (t.indexOf("bremen") >= 0)      return "bremen";
    if (t.indexOf("walsrode") >= 0)    return "walsrode";
    if (t.indexOf("delmenhorst") >= 0) return "delmenhorst";
    return "sonstige";
  };
  const a = ort(vonAdresse), b = ort(nachAdresse);
  if (a === b) return PLAN.fahrtOrtsnah;
  const paar = [a,b].sort().join("-");
  if (paar === "bremen-walsrode")      return PLAN.fahrtBremenWalsrode;
  if (paar === "bremen-delmenhorst")   return 30;
  if (paar === "delmenhorst-walsrode") return 85;
  return PLAN.fahrtBremenWalsrode;
}

/* ===========================================================
   3 · Speicherung
   Demo-Eingaben liegen im localStorage dieses Browsers. Klappt das
   nicht, wird das ehrlich gesagt — es wird nichts behauptet.
   =========================================================== */
const SCHLUESSEL = "twistlock-dispo-demo-v2";
let speicherGeht = true;
let speicherGrund = "";

function speichern(){
  if (!speicherGeht) return false;
  try {
    localStorage.setItem(SCHLUESSEL, JSON.stringify(D));
    return true;
  } catch (e) {
    speicherGeht = false;
    speicherGrund = (e && e.message) || "Browser erlaubt kein Speichern";
    speicherNotizZeichnen();
    return false;
  }
}
function laden(){
  try {
    const roh = localStorage.getItem(SCHLUESSEL);
    if (!roh) return null;
    return JSON.parse(roh);
  } catch (e) {
    speicherGeht = false;
    speicherGrund = (e && e.message) || "Browser erlaubt kein Speichern";
    return null;
  }
}
function speicherNotizZeichnen(){
  const n = document.getElementById("speicher-notiz");
  if (speicherGeht) {
    n.innerHTML = '<b>Simuliert:</b> Ortung, Fahrzeiten, Nummernerkennung, Freigabe an den Fahrer, ' +
      'Anruf und jeder Versand. <b>Echt gerechnet:</b> Reserve und Farbe, die Alarmschwelle, ' +
      'Entladezeit und Folgeankunft, Prüfziffer der Containernummer, Doppelbelegungen. ' +
      'Eingaben werden in diesem Browser gespeichert (localStorage).';
  } else {
    n.innerHTML = '<b>Speichern nicht möglich:</b> ' + esc(speicherGrund) +
      '. Eingaben gelten nur, solange diese Seite offen bleibt — beim Neuladen sind sie weg. ' +
      'Es wird hier nichts als gespeichert angezeigt, was nicht gespeichert ist.';
  }
}

/* ===========================================================
   4 · Beispieldaten
   Termine liegen bewusst relativ zur Demo-Uhr, damit die Farben
   immer dasselbe zeigen — unabhängig davon, wann die Datei geöffnet wird.
   =========================================================== */
/* Ein Termin liegt immer auf einer vollen Minute: „HH:MM“ kennt keine
   Sekunden. Würde die Prognose Sekunden behalten, wäre die Reserve um
   eine Minute daneben — aus 15 Min. würden 14. Deshalb wird hier beides
   auf dieselbe volle Minute gesetzt. */
const _termine = new Map();
function demoTermin(inMinuten, reserveMin){
  const schluessel = inMinuten + "/" + (reserveMin == null ? "-" : reserveMin);
  if (_termine.has(schluessel)) return _termine.get(schluessel);
  const d = new Date(jetzt().getTime() + inMinuten*60000);
  d.setSeconds(0,0);
  const iso = d.toISOString();
  const t = { datum:tagVon(iso), zeit:hhmm(iso), iso,
              prognose: reserveMin == null ? null : inMin(-reserveMin, iso) };
  // Gemerkt, damit Datum und Uhrzeit derselben Stelle nie aus zwei
  // verschiedenen Minuten stammen — sonst bricht es genau um Mitternacht.
  _termine.set(schluessel, t);
  return t;
}

/* ===========================================================
   6 · Auswertung eines Auftrags
   =========================================================== */
const fahrerVon = id => D.fahrer.find(x => x.id === id) || null;
const zugVon    = id => D.zugmaschinen.find(x => x.id === id) || null;
const chsVon    = id => D.chassis.find(x => x.id === id) || null;

/* Welcher Termin ist für diesen Auftrag gerade der maßgebliche?
   Vor der Abholung zählt der Abholtermin, danach der Liefertermin.
   Das muss sichtbar sein — „Termin 11:00“ allein ist zweideutig. */
function massgeblich(a){
  /* Ist am Vortag beladen worden, gibt es am Einsatztag keinen Abholtermin
     mehr, auf den man pünktlich sein müsste — dann zählt die Anlieferung. */
  if (!vortagBeladen(a) && !a.ablauf.abholung && a.abhol.zeit)
    return { art:"Abholung", ort:a.abhol.firma, datum:a.abhol.datum, zeit:a.abhol.zeit,
             iso:zeitpunkt(a.abhol.datum, a.abhol.zeit) };
  return { art:"Anlieferung", ort:a.liefer.firma, datum:a.liefer.datum, zeit:a.liefer.zeit,
           iso:zeitpunkt(a.liefer.datum, a.liefer.zeit) };
}

/* Wurde der Container schon am Vortag auf das Chassis gezogen?
   Dann entfällt am Einsatztag die Beladezeit — das Fahrzeug fährt los. */
function vortagBeladen(a){
  return !!(a && a.beladung && a.beladung.art === "vortag");
}
/* Sehr früher Termin bei Beladung am selben Tag: sachlicher Hinweis,
   keine Sperre. Grenze bewusst als Konstante, damit sie auffindbar ist. */
const FRUEH_AB = "07:30";
function fruehterminHinweis(a){
  if (vortagBeladen(a)) return null;
  const m = massgeblich(a);
  const zeit = (a.abhol && a.abhol.zeit) || m.zeit;
  if (!zeit || zeit >= FRUEH_AB) return null;
  return "Früher Termin – Beladung am Vortag prüfen.";
}

/* Aktueller Arbeitsschritt in Worten. */
function schritt(a){
  if (a.storniert)           return { wort:"Storniert", klasse:"m-grau" };
  if (!a.planung.fahrerId)   return { wort:"Nicht zugewiesen", klasse:"m-gelb" };
  if (!a.freigegeben)        return { wort:"Entwurf", klasse:"m-grau" };
  if (a.ablauf.abgabe)       return { wort:"Fertig", klasse:"m-gruen" };
  if (a.ablauf.entladenEnde) return { wort:"Entladen fertig", klasse:"m-marine" };
  if (a.ablauf.entladenStart)return { wort:"Entladung läuft", klasse:"m-marine" };
  if (a.ablauf.warten)       return { wort:"Wartet", klasse:"m-gelb" };
  if (a.ablauf.ankunft)      return { wort:"Angekommen", klasse:"m-marine" };
  if (a.ablauf.abholung)     return { wort:"Unterwegs", klasse:"m-marine" };
  return { wort:"Geplant", klasse:"m-grau" };
}

/* Verbleibende Entladezeit.
   Rückgabe: { min } wenn sie bekannt ist, sonst { unklar:true, grund }.

   Wichtig: Ein abgelaufener Planwert heißt NICHT „fertig“. Fertig ist die
   Entladung erst, wenn der Fahrer sie bestätigt. Läuft die geplante Zeit
   ab, ohne dass er sich meldet, ist das Ende unklar — daraus darf keine
   sofortige Abfahrt gerechnet werden. */
function entladeRest(a){
  if (!a.ablauf.entladenStart || a.ablauf.entladenEnde)
    return { min:null, unklar:false, grund:null };

  const ver = a.entladeVerlaengerung;
  if (ver && ver.unbekannt)
    return { min:null, unklar:true,
             grund:"Der Fahrer hat „Weiß ich noch nicht“ gewählt." };

  /* „Dauert länger“: die neue Restzeit zählt ab dem Zeitpunkt der Eingabe. */
  const start = ver ? ver.ab : a.ablauf.entladenStart;
  const dauer = ver ? ver.min : a.planung.entladenMin;
  const rest = dauer - minZw(start, jetztIso());
  if (rest <= 0)
    return { min:null, unklar:true,
             grund:"Entladeende unklar: die geplante Entladezeit ist abgelaufen, " +
                   "der Fahrer hat aber noch nicht „Entladung fertig“ gemeldet." };
  return { min:rest, unklar:false, grund:null };
}

/* Das Ergebnis der Tourrechnung zu diesem Auftrag. Es ist die EINE
   Grundlage für Tagesplan, Auftragsdetail, Belegung und Alarmprüfung —
   damit nirgends zwei verschiedene Zahlen für dieselbe Sache stehen. */
function tourErgebnis(a){
  if (!a.rechnung2) ketteRechnen();
  return a.rechnung2 || null;
}

/* Voraussichtliche Ankunft am maßgeblichen Termin.
   Abholankunft und Kundenankunft werden getrennt geführt: „Termin 11:00“
   heißt je nach Stand Abholung oder Anlieferung, und beide Ankünfte
   verschieben sich unterschiedlich. */
function prognose(a){
  const m = massgeblich(a);
  if (!m.iso) return { iso:null, grund:"Kein Termin hinterlegt" };
  if (a.ablauf.abgabe) return { iso:null, grund:"Auftrag ist abgeschlossen" };

  /* Ist der Fahrer schon da, ist die Ankunft keine Vorhersage mehr,
     sondern eine Tatsache. */
  if (m.art === "Anlieferung" && a.ablauf.ankunft)
    return { iso:a.ablauf.ankunft, grund:null, istAnkunft:true };
  if (m.art === "Abholung" && a.ablauf.abholung)
    return { iso:a.ablauf.abholung, grund:null, istAnkunft:true };

  /* Prognosezeitpunkt und Ortungszeitpunkt werden getrennt geführt und
     einzeln geprüft. Neu gerechnet wird oft, geortet nicht. */
  const zuv = datenZuverlaessig(a.prognoseZeit || a.datenZeit, a.ortungZeit);
  if (!zuv.ok) return { iso:null, grund:zuv.grund };

  const r = tourErgebnis(a);
  if (!r) return { iso:null, grund:"Keine Berechnung vorhanden" };
  if (r.unklar) return { iso:null, grund:r.grund };

  const iso = m.art === "Abholung" ? r.abholAnkunft : r.kundenAnkunft;
  if (!iso) return { iso:null, grund:r.grund || "Keine Berechnung vorhanden" };
  return { iso, grund:null, ausKette:!!r.ausKette, nurPlan:!!r.nurPlan, bezug:m.art };
}

/* Zeitstatus: Farbe plus der Satz, der sie erklärt. */
function zeitstatus(a){
  const m = massgeblich(a);
  const p = prognose(a);
  if (a.storniert) return { klasse:"m-grau", satz:"Storniert", res:null, ankunft:null };
  if (a.ablauf.abgabe) return { klasse:"m-gruen", satz:"Abgeliefert", res:null, ankunft:null };
  if (!p.iso) return { klasse:"m-grau", satz:"Ankunft unklar", zusatz:p.grund, res:null, ankunft:null };
  /* Reiner Plan ohne Ortung und ohne Verzug: sachlich „nach Plan“, nicht
     „0 Min. Reserve“. Eine knappe Lage wäre eine Behauptung ohne Daten. */
  if (p.nurPlan)
    return { klasse:"m-marine", satz:"Nach Plan",
             zusatz:"noch keine Ortung, keine Abweichung berechnet",
             res:null, ankunft:p.iso, nurPlan:true };
  const res = reserve(m.iso, p.iso);
  const k = ampel(res);
  /* Bereits angekommen: das ist Vergangenheit, keine Vorhersage. */
  if (p.istAnkunft) {
    if (res < 0) return { klasse:"m-rot", satz:Math.abs(res)+" Min. zu spät angekommen",
                          zusatz:"Fahrzeug ist vor Ort", res, ankunft:p.iso, istAnkunft:true };
    return { klasse:"m-gruen", satz:"Pünktlich angekommen",
             zusatz:"Fahrzeug ist vor Ort", res, ankunft:p.iso, istAnkunft:true };
  }
  if (k === "rot")   return { klasse:"m-rot",  satz:Math.abs(res)+" Min. verspätet", res, ankunft:p.iso };
  if (k === "gelb")  return { klasse:"m-gelb", satz:res+" Min. Reserve", res, ankunft:p.iso };
  if (k === "gruen") return { klasse:"m-gruen",satz:res+" Min. Reserve", res, ankunft:p.iso };
  return { klasse:"m-grau", satz:"Ankunft unklar", res:null, ankunft:null };
}

/* ===========================================================
   7 · Alarme
   Erst ab 20 Minuten berechneter Verspätung, nur einmal je Auftrag,
   und niemals aus unzuverlässigen Daten.
   =========================================================== */
function alarmePruefen(){
  let neu = 0;
  D.auftraege.forEach(a => {
    if (a.storniert || a.ablauf.abgabe || a.alarmGesendet) return;
    /* Wer schon da ist, kommt nicht mehr voraussichtlich zu spät.
       Ein Verspätungsalarm ist eine Vorhersage, keine Nachricht über
       etwas, das bereits eingetreten und im Ablauf sichtbar ist. */
    if (a.ablauf.ankunft) return;
    const zuv = datenZuverlaessig(a.datenZeit, a.ortungZeit);
    if (!zuv.ok) return;                       // unzuverlässig → kein Alarm
    const s = zeitstatus(a);
    if (s.res == null || s.res > -GRENZE_ALARM) return;
    a.alarmGesendet = true;
    meldungAnlegen({
      art:"verspaetung", auftragId:a.id,
      titel:"Voraussichtlich " + Math.abs(s.res) + " Minuten verspätet.",
      text:"Kunde " + a.kunde + ", Termin " + (massgeblich(a).zeit || "—") + " Uhr (" +
           massgeblich(a).art + "). Alarm ab " + GRENZE_ALARM +
           " Minuten, einmal je Auftrag."
    });
    a.verlauf.push(v(jetztIso(), "Verspätungsalarm ausgelöst (" + Math.abs(s.res) + " Min.)"));
    neu++;
  });

  // Containerabweichung und ungeprüfte Nummer als Meldung, einmalig
  D.auftraege.forEach(a => {
    if (a.container.abweichung && !D.meldungen.some(m => m.auftragId===a.id && m.art==="abweichung")) {
      meldungAnlegen({ art:"abweichung", auftragId:a.id,
        titel:"Containernummer stimmt nicht überein.",
        text:"Kunde " + a.kunde + "." });
      neu++;
    }
    if (a.container.ungeprueft && !D.meldungen.some(m => m.auftragId===a.id && m.art==="ungeprueft")) {
      meldungAnlegen({ art:"ungeprueft", auftragId:a.id,
        titel:"Containernummer noch ungeprüft.",
        text:"Die Nummer konnte nicht sicher gelesen werden. Kunde " + a.kunde + "." });
      neu++;
    }
  });
  return neu;
}
function meldungAnlegen(m){
  D.meldungen.unshift(Object.assign({ id:"m"+Date.now()+Math.random().toString(36).slice(2,6),
                                      zeit:jetztIso(), gesehen:false }, m));
}

/* ===========================================================
   8 · Doppelbelegung
   Eine gefährdete Planung darf gespeichert werden, bleibt aber
   sichtbar als Konflikt stehen.
   =========================================================== */
/* Wann ist das Gespann für diesen Auftrag wirklich gebunden?
   Nicht nur am Lieferort: Anfahrt zur Abholung, Warten und Beladen dort,
   Fahrt zum Kunden, Warten und Entladen, Restarbeiten, gegebenenfalls
   Rückgabe-/Depotstopp und die Übergangsfahrt zum nächsten Auftrag.
   Alle Werte sind ausdrücklich Demo-Planwerte.

   Gerechnet wird durchgehend mit echten Zeitpunkten, deshalb greift das
   auch über Mitternacht. Der Einsatztag spielt dabei keine Rolle. */
/* GEPLANTE Belegung: allein aus den vereinbarten Terminen und Planwerten.
   Das ist der Anspruch an die Planung — unabhängig davon, wie der Tag
   tatsächlich läuft. Sie ist die Grundlage der Konfliktprüfung: Ob zwei
   Aufträge zusammen passen, entscheidet sich am Plan, nicht daran, dass
   die Tourkette sie ohnehin hintereinander legt. */
function belegungGeplant(a){
  const p = a.planung || {};
  const abIso = zeitpunkt(a.abhol.datum, a.abhol.zeit);
  const anIso = zeitpunkt(a.liefer.datum, a.liefer.zeit);
  const fehlt = [];
  if (!abIso && !anIso) fehlt.push("Abhol- oder Liefertermin");
  if (p.entladenMin == null) fehlt.push("geplante Entladezeit");
  if (p.ladenMin == null)    fehlt.push("geplante Ladezeit");
  if (fehlt.length) return { unvollstaendig:true, fehlt };

  const fahrtHin = fahrzeit(a.abhol.adresse, a.liefer.adresse);
  const wartenAbhol = p.wartenAbholMin || 0;
  const abschnitte = [];
  let t, von;

  if (vortagBeladen(a)) {
    /* Am Vortag beladen: am Einsatztag entfallen Anfahrt zur Abholung,
       Warten und Beladen. Das Gespann startet mit der Fahrt zum Kunden.
       Es wird keine zusätzliche Fahrzeit erfunden — nur weggelassen,
       was an diesem Tag nicht mehr anfällt. */
    const losfahrt = anIso ? inMin(-fahrtHin, anIso) : null;
    if (!losfahrt) return { unvollstaendig:true, fehlt:["Liefertermin"] };
    von = losfahrt; t = losfahrt;
    abschnitte.push({ min:0, wort:"Am Vortag beladen — keine Beladezeit am Einsatztag" });
  } else {
    const abholStart = abIso || inMin(-(wartenAbhol + p.ladenMin + fahrtHin), anIso);
    von = inMin(-PLAN.anfahrtAbholung, abholStart);
    t = abholStart;
    abschnitte.push({ min:PLAN.anfahrtAbholung, wort:"Anfahrt zur Abholung" });
  }
  const weiter = (min, wort) => { if (min > 0) { abschnitte.push({min, wort}); t = inMin(min, t); } };

  if (!vortagBeladen(a)) {
    weiter(wartenAbhol, "Warten bei der Abholung");
    weiter(p.ladenMin, "Beladung");
  }
  weiter(fahrtHin, "Fahrt zum Kunden");
  if (anIso && new Date(t) < new Date(anIso))
    weiter(Math.round(minZw(t, anIso)), "Warten bis zum Liefertermin");
  weiter(p.wartenMin || 0, "Warten beim Kunden");
  weiter(p.entladenMin, "Entladung");
  weiter(PLAN.nacharbeit, "Restarbeiten");
  if (a.container && a.container.rueckgabeOrt) {
    weiter(PLAN.fahrtZumDepot, "Fahrt zur Leercontainer-Rückgabe");
    weiter(PLAN.depotstopp, "Rückgabe / Depotstopp");
  }
  weiter(PLAN.uebergang, "Übergangsfahrt zum nächsten Auftrag");
  return { von, bis:t, abschnitte, unvollstaendig:false };
}

/* AKTUELLE Belegung aus der Tourrechnung: was der Tag gerade hergibt.
   Eine verlängerte Entladung verschiebt sie; ein unklares Entladeende
   lässt sie offen. Beides wird getrennt von der geplanten Belegung
   ausgewiesen, damit nichts Altes als aktuelle Aussage durchgeht. */
function belegung(a){
  const geplant = belegungGeplant(a);
  if (geplant.unvollstaendig) return geplant;

  const r = tourErgebnis(a);
  if (!r) return { von:geplant.von, bis:geplant.bis, offen:false,
                   geplant, abschnitte:geplant.abschnitte, unvollstaendig:false };

  if (r.unklar || !r.belegungBis) {
    return { von:r.belegungVon || geplant.von, bis:null, offen:true,
             grund:r.grund || "Entladeende unklar",
             geplant, geplantBis:geplant.bis,
             abschnitte:r.abschnitte || [], unvollstaendig:false };
  }
  return { von:r.belegungVon, bis:r.belegungBis, offen:false,
           geplant, geplantBis:geplant.bis,
           abschnitte:r.abschnitte || [], unvollstaendig:false };
}

function konflikte(a){
  const raus = [];
  if (a.storniert || a.ablauf.abgabe) return raus;
  const b = belegung(a);
  if (!b || b.unvollstaendig) return raus;

  const ueberschneidet = (x, y) =>
    !!(x && y && x.von && x.bis && y.von && y.bis &&
       new Date(x.von) < new Date(y.bis) && new Date(y.von) < new Date(x.bis));

  D.auftraege.forEach(o => {
    /* Ein anderer Einsatztag schließt einen Konflikt NICHT aus — eine Tour
       kann über Mitternacht laufen. Deshalb wird hier nicht nach Tag gefiltert. */
    if (o.id === a.id || o.storniert || o.ablauf.abgabe) return;
    const ob = belegung(o);
    if (!ob || ob.unvollstaendig) return;

    /* Zwei Arten von Konflikt, beide zählen:
       - Der Plan selbst geht nicht auf (geplant gegen geplant).
       - Die tatsächliche Bindung frisst in das zugesagte Fenster des
         anderen hinein (aktuell gegen geplant). Damit ändert sich die
         Anzeige, sobald eine Entladung länger dauert. */
    const ueberlappt = ueberschneidet(b.geplant, ob.geplant) ||
                       ueberschneidet(b, ob.geplant) ||
                       ueberschneidet(b.geplant, ob);
    if (!ueberlappt) return;

    /* Wer ist zuerst dran? Daraus wird der konkrete Satz gebaut.
       Genannt wird die tatsächliche Bindung, ersatzweise die geplante. */
    const nimmBel = x => (x.bis ? x : x.geplant);
    const bA = nimmBel(b), bO = nimmBel(ob);
    const frueher = new Date(bA.von) <= new Date(bO.von) ? {auf:a, bel:bA} : {auf:o, bel:bO};
    const spaeter = frueher.auf === a ? {auf:o, bel:bO} : {auf:a, bel:bA};
    const satz = (frueher.bel.bis
        ? "Gebunden noch bis etwa " + hhmm(frueher.bel.bis) + " Uhr (Auftrag " +
          frueher.auf.nummer + ")."
        : "Bindung von Auftrag " + frueher.auf.nummer + " ist offen.") +
      " Nächste Abholung bereits um " +
      hhmm(inMin(PLAN.anfahrtAbholung, spaeter.bel.von)) + " Uhr.";

    const nimm = (was, wer) => raus.push({ was, wer, mit:o, satz });
    if (a.planung.fahrerId && a.planung.fahrerId === o.planung.fahrerId)
      nimm("Fahrer", (fahrerVon(a.planung.fahrerId)||{}).name);
    if (a.planung.zugmaschineId && a.planung.zugmaschineId === o.planung.zugmaschineId)
      nimm("Zugmaschine", (zugVon(a.planung.zugmaschineId)||{}).kennzeichen);
    if (a.planung.chassisId && a.planung.chassisId === o.planung.chassisId)
      nimm("Chassis", (chsVon(a.planung.chassisId)||{}).nummer);
  });
  return raus;
}

/* Mit welchen Aufträgen gibt es eine Überschneidung? Ein Auftrag wird
   einmal genannt, auch wenn Fahrer, Zugmaschine und Chassis gleichzeitig
   kollidieren — das ist dieselbe Überschneidung. */
function konfliktAuftraege(kf){
  const raus = [];
  kf.forEach(k => { if (raus.indexOf(k.mit.nummer) < 0) raus.push(k.mit.nummer); });
  return raus;
}

/* Lässt sich die Planung überhaupt prüfen? Fehlen Planwerte, wird das
   gesagt — „Kein Konflikt“ wäre dann eine unbelegte Behauptung. */
function konfliktLage(a){
  if (a.storniert || a.ablauf.abgabe) return { pruefbar:true, konflikte:[] };
  const b = belegung(a);
  if (b && b.unvollstaendig)
    return { pruefbar:false, konflikte:[], fehlt:b.fehlt };
  /* Offenes Entladeende: es gibt kein belastbares Belegungsende. Dann wird
     weder ein Konflikt noch „kein Konflikt“ behauptet. */
  if (b && b.offen)
    return { pruefbar:false, offen:true, konflikte:[], grund:b.grund,
             text:"Belegung offen – nächste Tour derzeit nicht sicher planbar." };
  return { pruefbar:true, konflikte:konflikte(a) };
}

/* ===========================================================
   9 · Kleine Helfer für die Anzeige
   =========================================================== */
function esc(x){
  return String(x == null ? "" : x)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
/* Containernummer lesbar: MSCU 123456-6 */
function contLesbar(s){
  if (!s) return "—";
  const t = String(s).toUpperCase().replace(/[^A-Z0-9]/g,"");
  if (t.length !== 11) return String(s);
  return t.slice(0,4)+" "+t.slice(4,10)+"-"+t.slice(10);
}
/* Prüfziffer nach ISO 6346 — das rechnet die Vorschau wirklich. */
function contGueltig(s){
  const t = String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  if (!/^[A-Z]{4}\d{7}$/.test(t)) return false;
  const werte = {A:10,B:12,C:13,D:14,E:15,F:16,G:17,H:18,I:19,J:20,K:21,L:23,M:24,N:25,
                 O:26,P:27,Q:28,R:29,S:30,T:31,U:32,V:34,W:35,X:36,Y:37,Z:38};
  let summe = 0;
  for (let i=0;i<10;i++){
    const z = t[i];
    const w = /\d/.test(z) ? Number(z) : werte[z];
    summe += w * Math.pow(2,i);
  }
  return (summe % 11) % 10 === Number(t[10]);
}
function marke(klasse, text, zusatz){
  return '<span class="marke '+klasse+'">'+esc(text)+'</span>' +
         (zusatz ? '<span class="neben">'+esc(zusatz)+'</span>' : '');
}
const simMarke = txt => '<span class="sim">'+esc(txt||"Simuliert")+'</span>';

/* ===========================================================
   10 · Zeichnen
   =========================================================== */
const BEREICHE = [
  { k:"tagesplan",  wort:"Tagesplan" },
  { k:"wochenplan", wort:"Wochenplan" },
  { k:"auftraege",  wort:"Aufträge" },
  { k:"stamm",      wort:"Stammdaten" },
  { k:"meldungen",  wort:"Meldungen" }
];

/* ===========================================================
   10 · Auftraggeber-Ansicht (extern)

   Getrennte Oberfläche, aber dieselben Daten. Es gibt hier keine
   zweite Statuslogik, keine zweite Ankunftsberechnung und keine
   zweite Kopie der Aufträge — alles kommt aus denselben Funktionen,
   die auch die Dispo benutzt. Übersetzt wird nur die Sprache.

   Ein Token verweist auf einen Link-Datensatz. Erst dieser legt fest,
   was freigegeben ist. Aus der Adresse wird nichts übernommen außer
   dem Token selbst.
   =========================================================== */
const LINK_BASIS = "https://tracking.im-cargo.de/t/";
const linkAdresse = l => LINK_BASIS + l.token;
const kundeVon = id => (D.auftraggeber || []).find(k => k.id === id) || null;

function linkZustand(l){
  if (!l) return "unbekannt";
  if (l.status === "deaktiviert") return "deaktiviert";
  if (l.gueltigBis && HEUTE() > l.gueltigBis) return "abgelaufen";
  return "aktiv";
}

/* Auflösung eines Tokens. Später macht das der Server; der Aufbau ist
   hier schon derselbe: erst der Datensatz, dann die Aufträge — nie
   umgekehrt. Jeder Auftrag wird zusätzlich gegen die Auftraggeber-ID
   des Links geprüft. Ein Token kann damit nie einen fremden Auftrag
   öffnen, auch wenn eine ID irgendwo durchgereicht würde. */
function linkAufloesen(token){
  const l = (D.links || []).find(x => x.token === token);
  if (!l) return { ok:false, grund:"unbekannt" };
  const z = linkZustand(l);
  if (z !== "aktiv") return { ok:false, grund:z, link:l };
  const k = kundeVon(l.auftraggeberId);
  if (!k) return { ok:false, grund:"unbekannt", link:l };
  if (!k.externErlaubt) return { ok:false, grund:"gesperrt", link:l };

  let liste = [];
  if (l.art === "einzel") {
    const a = auftragVon(l.auftragId);
    if (a && a.auftraggeberId === l.auftraggeberId && !a.storniert && a.freigegeben) liste = [a];
  } else {
    const bis = tagPlusVon(l.wocheStart, 6);
    liste = D.auftraege.filter(a =>
      a.auftraggeberId && a.auftraggeberId === l.auftraggeberId &&
      !a.storniert && a.freigegeben &&
      a.tag >= l.wocheStart && a.tag <= bis);
  }
  /* Sortiert nach dem Termin, der auch angezeigt wird — der Anlieferung
     beim Auftraggeber. Der Abholtermin am Terminal ist seine Sache nicht. */
  liste = liste.slice().sort((x,y) => {
    if (x.tag !== y.tag) return x.tag < y.tag ? -1 : 1;
    const mx = externTermin(x).iso, my = externTermin(y).iso;
    if (!mx) return 1; if (!my) return -1;
    return new Date(mx) - new Date(my);
  });
  return { ok:true, link:l, kunde:k, auftraege:liste };
}

/* Kundensprache. Abgeleitet aus demselben Ablauf, den auch die Dispo
   liest — interne Begriffe kommen hier nicht vor. */
function externStatus(a){
  const b = a.ablauf;
  if (b.abgabe)        return { wort:"Transport abgeschlossen",  klasse:"x-fertig" };
  if (b.entladenEnde)  return { wort:"Entladung abgeschlossen",  klasse:"x-gut" };
  if (b.entladenStart) return { wort:"Entladung läuft",          klasse:"x-aktiv" };
  if (b.warten)        return { wort:"Wartet auf Entladung",     klasse:"x-aktiv" };
  if (b.ankunft)       return { wort:"Beim Empfänger angekommen",klasse:"x-gut" };
  if (b.abholung)      return { wort:"Unterwegs",                klasse:"x-aktiv" };
  if (a.bestaetigt)    return { wort:"Fahrer hat Auftrag erhalten", klasse:"x-plan" };
  return { wort:"Geplant", klasse:"x-plan" };
}

/* Der für den Auftraggeber maßgebliche Termin ist immer die Anlieferung
   bei ihm. Der Abholtermin am Terminal ist unsere Sache, nicht seine. */
function externTermin(a){
  return { datum:a.liefer.datum, zeit:a.liefer.zeit,
           iso:zeitpunkt(a.liefer.datum, a.liefer.zeit) };
}

/* Erwartete Ankunft beim Auftraggeber. Genommen wird dieselbe Rechnung wie
   intern — nur eben das Feld für die Kundenankunft. Es gibt hier keine
   zweite Ankunftsberechnung. Trägt die Rechnung nicht, wird das gesagt und
   keine Uhrzeit behauptet. */
function externAnkunft(a){
  if (a.ablauf.abgabe)
    return { iso:null, text:null, sicher:false, fertig:true, hinweis:null };
  /* Wer da ist, ist da — das ist eine Tatsache, keine Vorhersage. */
  if (a.ablauf.ankunft)
    return { iso:a.ablauf.ankunft, text:hhmm(a.ablauf.ankunft) + " Uhr",
             sicher:true, angekommen:true, hinweis:null };

  const unklar = { iso:null, text:null, sicher:false,
                   hinweis:"Aktuelle Ankunftszeit momentan nicht zuverlässig bestimmbar." };
  const r = tourErgebnis(a);
  if (!r || r.unklar || !r.kundenAnkunft) return unklar;
  if (r.nurPlan)
    return { iso:r.kundenAnkunft, text:"wie geplant " + hhmm(r.kundenAnkunft) + " Uhr",
             sicher:true, nurPlan:true, hinweis:null };
  if (!datenZuverlaessig(a.prognoseZeit || a.datenZeit, a.ortungZeit).ok) return unklar;
  return { iso:r.kundenAnkunft, text:"ca. " + hhmm(r.kundenAnkunft) + " Uhr",
           sicher:true, hinweis:null };
}

/* Verspätung ist eine eigene Angabe neben dem Status, kein Ersatz dafür.
   Solange nur der Plan vorliegt, gibt es keine Verspätung zu melden —
   das wäre eine Aussage ohne Datengrundlage. */
function externVerspaetung(a){
  if (a.ablauf.abgabe) return null;
  const ank = externAnkunft(a);
  if (!ank.sicher || ank.nurPlan) return null;
  const res = reserve(externTermin(a).iso, ank.iso);
  if (res == null || res >= 0) return null;
  return { min:Math.abs(res), angekommen:!!ank.angekommen };
}

/* Wie alt ist die Ortung? Dieselbe Prüfung wie intern, nur anders
   formuliert. */
function externOrtung(a){
  if (!a.ortungZeit) return { frisch:false, alterMin:null, zeit:null };
  return { frisch: zeitstempelPruefen(a.ortungZeit, "Ortungszeitpunkt").ok,
           alterMin: Math.round(minZw(a.ortungZeit, jetztIso())), zeit:a.ortungZeit };
}

/* Zeitleiste aus dem vorhandenen Ablauf. Keine eigene Historie. */
function externZeitleiste(a){
  const punkte = [];
  if (a.bestaetigt)          punkte.push({ zeit:a.bestaetigt, wort:"Fahrer hat Auftrag erhalten" });
  if (a.ablauf.abholung)     punkte.push({ zeit:a.ablauf.abholung, wort:"Container übernommen" });
  if (a.ablauf.ankunft)      punkte.push({ zeit:a.ablauf.ankunft, wort:"Beim Empfänger angekommen" });
  if (a.ablauf.warten)       punkte.push({ zeit:a.ablauf.warten, wort:"Wartet auf Entladung" });
  if (a.ablauf.entladenStart)punkte.push({ zeit:a.ablauf.entladenStart, wort:"Entladung begonnen" });
  if (a.ablauf.entladenEnde) punkte.push({ zeit:a.ablauf.entladenEnde, wort:"Entladung abgeschlossen" });
  if (a.ablauf.abgabe)       punkte.push({ zeit:a.ablauf.abgabe, wort:"Transport abgeschlossen" });
  return punkte;
}

/* ---------- Externe Ansicht zeichnen ---------- */
function ansichtExtern(){
  const E = U.extern;
  const r = linkAufloesen(E.token);
  let h = externDemoLeiste();
  if (!r.ok) return h + externSperre(r.grund);

  const einzeln = E.auftragId
    ? r.auftraege.find(x => x.id === E.auftragId)   // nur aus der erlaubten Menge
    : (r.link.art === "einzel" ? r.auftraege[0] : null);

  if (E.auftragId && !einzeln) return h + externSperre("unbekannt");

  h += externKopf(r, einzeln);
  h += einzeln ? externEinzel(einzeln, r) : externWoche(r);
  h += externFuss();
  return h;
}

function externDemoLeiste(){
  if (!U.extern || !U.extern.demo) return "";
  return '<div class="x-demoleiste"><span class="x-demomarke">DEMO – Auftraggeberansicht</span>' +
    '<span class="x-demotext">So sieht der Auftraggeber den Link. Nur in dieser Vorschau sichtbar.</span>' +
    '<button class="x-zurueck" data-tun="externZurueck">Zurück zur Dispo</button></div>';
}

function externSperre(grund){
  const satz = grund === "deaktiviert" || grund === "gesperrt"
    ? "Dieser Transportlink wurde deaktiviert."
    : "Dieser Link ist nicht mehr gültig.";
  return '<div class="x-seite"><div class="x-sperre">' +
    '<div class="x-marke">I&amp;M CARGO</div>' +
    '<p class="x-sperrsatz">' + esc(satz) + '</p>' +
    '<p class="x-sperrhilfe">Bitte wenden Sie sich an Ihren Ansprechpartner bei I&amp;M CARGO.</p>' +
    '</div></div>';
}

function externKopf(r, einzeln){
  const l = r.link;
  let unter;
  if (einzeln) unter = "Transport " + einzeln.nummer;
  else if (l.art === "woche")
    unter = "Kalenderwoche " + kwVon(l.wocheStart) + " · " +
            tagKurz(l.wocheStart) + " – " + tagKurz(tagPlusVon(l.wocheStart, 6));
  else unter = "Transport";

/* Kalenderwoche nach ISO — nur für die Überschrift. */
function kwVon(datum){
  const d = new Date(datum + "T12:00:00");
  const t = new Date(d.getTime());
  t.setDate(t.getDate() + 3 - ((d.getDay() + 6) % 7));
  const ersterDo = new Date(t.getFullYear(), 0, 4);
  ersterDo.setDate(ersterDo.getDate() + 3 - ((ersterDo.getDay() + 6) % 7));
  return 1 + Math.round((t - ersterDo) / (7 * 86400000));
}

function externWoche(r){
  const l = r.link;
  const tage = [];
  for (let i = 0; i < 7; i++) tage.push(tagPlusVon(l.wocheStart, i));
  let h = '<main class="x-woche">';
  const gesamt = r.auftraege.length;
  h += '<p class="x-summe">' + gesamt + (gesamt === 1 ? " Transport" : " Transporte") +
       ' in dieser Woche</p>';
  tage.forEach(t => {
    const liste = r.auftraege.filter(a => a.tag === t);
    h += '<section class="x-tag' + (liste.length ? "" : " leer") + '">' +
      '<h2>' + esc(tagKurz(t)) + '</h2>';
    if (!liste.length) h += '<p class="x-leer">Kein Transport geplant.</p>';
    else h += liste.map(a => externKarte(a)).join("");
    h += '</section>';
  });
  return h + '</main>';
}

/* Ein Satz zur Verspätung — vor der Ankunft eine Vorhersage, danach eine
   Feststellung. Beides darf nicht gleich klingen. */

  if (!vsp) return "";
  return vsp.angekommen
    ? vsp.min + " Minuten später als geplant eingetroffen"
    : "Voraussichtliche Verspätung: ca. " + vsp.min + " Minuten";
}
