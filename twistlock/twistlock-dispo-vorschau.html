/* Die einzige Stelle, an der die Auftraggeberansicht an neue Daten käme.
   Heute gibt es hier nichts zu holen: alles steht schon im Speicher dieses
   Browsers. Später tritt hier ein Aufruf an den Server an die Stelle des
   Rückgabewerts — entweder auf Anforderung (Schaltfläche) oder von selbst
   über eine offene Verbindung, die dann genau dieselbe Funktion aufruft.
   Wichtig dabei: mitgegeben wird nur das Token. Welche Aufträge es
   freigibt, entscheidet der Server, nicht diese Seite. */
function externStandHolen(token){
  return { echt:false, token, stand:linkAufloesen(token) };
}

/* Vorschau öffnen — im Demo-Modus aus der Dispo heraus. */
function externOeffnen(token, auftragId, demo){
  U.extern = { token, auftragId:auftragId || null, demo:!!demo };
  zeichne();
  window.scrollTo(0,0);
}

function zeichne(){
  /* Die Auftraggeberansicht ersetzt die Seite vollstaendig: keine
     Navigation, kein Dispo-Kopf, kein interner Hinweis. */
  const externAn = !!U.extern;
  document.body.classList.toggle("extern-an", externAn);
  if (externAn) {
    document.getElementById("navi").innerHTML = "";
    document.getElementById("inhalt").innerHTML = ansichtExtern();
    return;
  }
  naviZeichnen();
  const el = document.getElementById("inhalt");
  let html = "";
  if (U.notiz) html += '<div class="hinweis">'+U.notiz+'</div>';
  if (U.bereich === "tagesplan") html += ansichtTagesplan();
  else if (U.bereich === "wochenplan") html += ansichtWochenplan();
  else if (U.bereich === "auftraege") html += ansichtAuftraege();
  else if (U.bereich === "smart") html += ansichtSmart();
  else if (U.bereich === "stamm") html += ansichtStamm();
  else if (U.bereich === "meldungen") html += ansichtMeldungen();
  else if (U.bereich === "detail") html += ansichtDetail();
  else if (U.bereich === "formular") html += ansichtFormular();
  el.innerHTML = html;
}
function naviZeichnen(){
  const offeneMeldungen = D.meldungen.filter(m => !m.gesehen).length;
  document.getElementById("navi").innerHTML = BEREICHE.map(b => {
    /* Detail und Formular gehören optisch zu dem Bereich, aus dem sie
       geöffnet wurden — sonst springt die Markierung willkürlich. */
    const aktiv = (U.bereich === b.k) ||
                  ((U.bereich === "detail" || U.bereich === "formular") &&
                   b.k === (U.vorher || "tagesplan"));
    const zahl = (b.k === "meldungen" && offeneMeldungen)
      ? '<span class="zahl">'+offeneMeldungen+'</span>' : "";
    return '<button data-tun="bereich" data-wert="'+b.k+'"'+
           (aktiv ? ' aria-current="page"' : '')+'>'+esc(b.wort)+zahl+'</button>';
  }).join("");
}

/* ---------- Tagesplan ---------- */
function ansichtTagesplan(){
  const tag = U.tag;
  const alle = D.auftraege.filter(a => a.tag === tag && !a.storniert);
  const offen = alle.filter(a => !a.ablauf.abgabe).length;
  const nichtZug = alle.filter(a => !a.planung.fahrerId).length;
  const alarme = D.meldungen.filter(m => m.art === "verspaetung" && !m.gesehen).length;

  const gefiltert = alle.filter(a => {
    if (U.filter === "alle") return true;
    if (U.filter === "nichtzug") return !a.planung.fahrerId;
    if (U.filter === "unterwegs") return a.ablauf.abholung && !a.ablauf.ankunft && !a.ablauf.abgabe;
    if (U.filter === "warten") return (a.ablauf.ankunft || a.ablauf.warten || a.ablauf.entladenStart)
                                      && !a.ablauf.abgabe;
    if (U.filter === "fertig") return !!a.ablauf.abgabe;
    return true;
  }).sort((x,y) => {
    const mx = massgeblich(x).iso, my = massgeblich(y).iso;
    if (!mx) return 1; if (!my) return -1;
    return new Date(mx) - new Date(my);
  });

  let h = '<div class="leiste">' +
    '<button class="btn" data-tun="tag" data-wert="heute">Heute</button>' +
    '<button class="btn" data-tun="tag" data-wert="morgen">Morgen</button>' +
    '<label for="tagwahl" style="font-size:15px;font-weight:600">Datum</label>' +
    '<input type="date" id="tagwahl" value="'+esc(tag)+'" style="width:auto" data-tun="tagwahl">' +
    '<span class="tag">'+esc(tagLang(tag))+'</span>' +
    '<button class="btn haupt gross" data-tun="neu" style="margin-left:auto">+ Neuer Auftrag</button>' +
    '</div>';

  h += '<div class="zahlen">' +
    zahlFeld(offen, "Offene Aufträge an diesem Tag", false) +
    zahlFeld(nichtZug, "Noch nicht zugewiesen", nichtZug > 0) +
    zahlFeld(alarme, "Verspätungsalarme (ungesehen)", alarme > 0) +
    '</div>';

  h += '<div class="filter" role="group" aria-label="Filter">' +
    filterKnopf("alle","Alle") + filterKnopf("nichtzug","Nicht zugewiesen") +
    filterKnopf("unterwegs","Unterwegs") + filterKnopf("warten","Warten / Entladen") +
    filterKnopf("fertig","Fertig") + '</div>';

  if (!gefiltert.length) {
    h += '<div class="karte"><p class="leer">Für diesen Tag und Filter gibt es keinen Auftrag.</p></div>';
    return h;
  }

  h += '<div class="karte tabellen-karte" style="padding:0"><table class="tabelle"><thead><tr>' +
    '<th>Termin</th><th>Kunde und Strecke</th><th>Fahrer und Kennzeichen</th><th>Chassis</th>' +
    '<th>Schritt</th><th>Ankunft</th><th>Reserve</th><th>Fahrer bestätigt</th><th>Öffnen</th>' +
    '</tr></thead><tbody>';

  gefiltert.forEach(a => {
    const m = massgeblich(a);
    const s = zeitstatus(a);
    const sc = schritt(a);
    const f = fahrerVon(a.planung.fahrerId);
    const z = zugVon(a.planung.zugmaschineId);
    const c = chsVon(a.planung.chassisId);
    const kl = konfliktLage(a);
    const kf = kl.konflikte;

    h += '<tr'+(a.planung.fahrerId ? '' : ' class="nichtzug"')+'>' +
      '<td data-titel="Termin"><span class="haupt-zelle num">'+esc(m.zeit || "—")+' Uhr</span>' +
        '<span class="neben">'+esc(m.art)+'</span></td>' +
      '<td data-titel="Kunde und Strecke"><span class="haupt-zelle">'+esc(a.kunde || "—")+'</span>' +
        '<span class="neben">'+esc(kurzOrt(a.abhol.adresse))+' → '+esc(kurzOrt(a.liefer.adresse))+'</span>' +
        '<span class="neben">Auftrag '+esc(a.nummer)+'</span></td>' +
      '<td data-titel="Fahrer und Kennzeichen">' +
        (f ? '<span class="haupt-zelle">'+esc(f.name)+'</span>'
           : '<span class="marke m-gelb">Nicht zugewiesen</span>') +
        '<span class="neben">'+esc(z ? z.kennzeichen : "keine Zugmaschine")+'</span></td>' +
      '<td data-titel="Chassis">'+esc(c ? c.nummer : "—")+
        (c ? '<span class="neben">'+esc(c.groesse)+'</span>' : '')+'</td>' +
      '<td data-titel="Schritt"><span class="marke '+sc.klasse+'">'+esc(sc.wort)+'</span>' +
        (a.entwurf ? '<span class="neben" style="color:#8A5200;font-weight:600">'+
                     'Änderungen nicht freigegeben</span>' : '') +
        (kl.offen ? '<span class="neben" style="color:#8A5200;font-weight:600">'+
                    'Belegung offen</span>'
         : !kl.pruefbar ? '<span class="neben" style="color:#8A5200;font-weight:600">'+
                        'Planung nicht vollständig prüfbar</span>' : '') +
        (vortagBeladen(a) ? '<span class="neben" style="color:#1B4C78;font-weight:600">'+
                            'Am Vortag beladen</span>' : '') +
        (fruehterminHinweis(a) ? '<span class="neben" style="color:#8A5200;font-weight:600">'+
                                 'Früher Termin – Vortag prüfen</span>' : '') +
        (kf.length ? '<span class="neben" style="color:#A3161D;font-weight:600">Konflikt mit '+
                     esc(konfliktAuftraege(kf).join(", "))+'</span>' : '')+'</td>' +
      '<td data-titel="Voraussichtliche Ankunft" class="num">'+
        (s.ankunft ? esc(hhmm(s.ankunft))+' Uhr' : '—')+
        '<span class="neben">'+(s.ankunft ? "simuliert" : esc(s.zusatz || ""))+'</span></td>' +
      '<td data-titel="Reserve"><span class="marke '+s.klasse+'">'+esc(s.satz)+'</span></td>' +
      '<td data-titel="Fahrer bestätigt">'+
        (a.bestaetigt
          ? '<span class="marke m-gruen">Gesehen</span><span class="neben">'+esc(hhmm(a.bestaetigt))+' Uhr</span>'
          : '<span class="marke m-grau">Noch nicht</span>')+'</td>' +
      '<td data-titel="Aktion"><button class="btn" data-tun="oeffnenAus" data-wert="'+a.id+'" data-aus="tagesplan">Öffnen</button></td>' +
      '</tr>';
  });
  h += '</tbody></table></div>';

  h += '<div class="hinweis"><b>Zur Lesart:</b> „Termin“ nennt immer dazu, ob es der ' +
       'Abholtermin oder der Anlieferungstermin ist. Die Spalte „Ankunft“ ist eine ' +
       simMarke("simulierte Berechnung") + ' aus Demo-Planwerten — keine Ortung in Echtzeit, ' +
       'keine Verkehrsdaten und keine Aussage über die gesetzliche Lenkzeit.<br>' +
       '<b>Zu den Konflikten:</b> Geprüft wird die ganze Tour, nicht nur der Lieferstopp — ' +
       'Anfahrt, Beladen, Fahrt, Warten, Entladen, Restarbeiten, Rückgabestopp und ' +
       'Übergangsfahrt. Ein Auftrag bindet das Gespann damit rund fünf bis sechs Stunden. ' +
       'Dieser Beispieltag ist mit zwei Fahrern bewusst dicht belegt, damit die Regel ' +
       'sichtbar wird; die Überschneidungen sind daher echt und keine Anzeigefehler.</div>';
  return h;
}
function zahlFeld(n, wort, achtung){
  return '<div class="zahl-feld'+(achtung ? ' achtung' : '')+'">' +
         '<div class="gross">'+n+'</div><div class="wort">'+esc(wort)+'</div></div>';
}
function filterKnopf(k, wort){
  return '<button data-tun="filter" data-wert="'+k+'" aria-pressed="'+(U.filter===k)+'">'+esc(wort)+'</button>';
}
function kurzOrt(adresse){
  if (!adresse) return "—";
  const teile = String(adresse).split(",");
  const letzter = teile[teile.length-1].trim();
  return letzter.replace(/^\d{5}\s*/,"") || adresse;
}

/* ---------- Wochenplan ----------
   Zeilen: Fahrer bzw. Gespanne. Spalten: Montag bis Sonntag.
   Die Konfliktprüfung ist dieselbe wie überall (konfliktLage) — hier wird
   bewusst keine zweite Logik gebaut. Ein Klick öffnet die vorhandene
   Auftragsdetailansicht, es gibt keine zweite Auftragsmaske. */
const WOCHENTAGE = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];

/* Montag der Woche, in der dieses Datum liegt. */
function wochenStart(datum){
  const d = new Date((datum || HEUTE()) + "T12:00:00");
  if (isNaN(d)) return HEUTE();
  const versatz = (d.getDay() + 6) % 7;          // Montag = 0
  d.setDate(d.getDate() - versatz);
  return tagVon(d.toISOString());
}
/* Datum plus n Tage, wieder als „JJJJ-MM-TT“. 12:00 als Anker, damit
   die Sommerzeitumstellung den Tag nicht verschiebt. */
function tagPlusVon(datum, n){
  if (!datum) return null;
  const d = new Date(datum + "T12:00:00");
  if (isNaN(d)) return null;
  d.setDate(d.getDate() + n);
  return tagVon(d.toISOString());
}

function ansichtWochenplan(){
  const start = U.woche || wochenStart(U.tag || HEUTE());
  const tage = [];
  for (let i = 0; i < 7; i++) tage.push(tagPlusVon(start, i));

  let h = '<div class="leiste">' +
    '<button class="btn" data-tun="wocheZurueck">← Vorige Woche</button>' +
    '<button class="btn" data-tun="wocheHeute">Diese Woche</button>' +
    '<button class="btn" data-tun="wocheVor">Nächste Woche →</button>' +
    '<span class="tag">' + esc(tagKurz(start)) + ' bis ' + esc(tagKurz(tage[6])) + '</span>' +
    '<button class="btn haupt gross" data-tun="neu" style="margin-left:auto">+ Neuer Auftrag</button>' +
    '</div>';

  /* --- Nicht zugewiesen: eigener, gut sichtbarer Bereich --- */
  const offen = D.auftraege.filter(a => !a.storniert && tage.indexOf(a.tag) >= 0 &&
    (!a.planung.fahrerId || !a.planung.zugmaschineId || !a.planung.chassisId));
  h += '<div class="karte" style="border-color:#B07100;background:#FFF8E1">' +
    '<h2>Nicht zugewiesen (' + offen.length + ')</h2>';
  if (!offen.length) {
    h += '<p style="color:#47525D">Für diese Woche ist jeder Auftrag vollständig disponiert.</p>';
  } else {
    h += '<p style="margin-bottom:10px">Diese Aufträge sind <b>noch nicht vollständig ' +
         'disponiert</b> — es fehlt Fahrer, Zugmaschine oder Chassis.</p>' +
         '<div class="woche-offen">';
    offen.forEach(a => { h += wochenKarte(a, true); });
    h += '</div>';
  }
  h += '</div>';

  /* --- Raster: Fahrer × Wochentage --- */
  const fahrer = D.fahrer.slice();
  h += '<div class="karte tabellen-karte" style="padding:0">' +
    '<table class="tabelle woche"><thead><tr><th class="woche-name">Fahrer / Gespann</th>' +
    tage.map((t,i) => '<th>' + esc(WOCHENTAGE[i]) + '<span class="neben">' +
      esc(tagKurz(t)) + '</span></th>').join("") +
    '</tr></thead><tbody>';

  fahrer.forEach(f => {
    h += '<tr><td class="woche-name" data-titel="Fahrer"><span class="haupt-zelle">' +
      esc(f.name) + '</span>' +
      '<span class="neben">' + esc(f.aktiv ? "aktiv" : "nicht verfügbar") + '</span></td>';
    tage.forEach((t, i) => {
      const liste = D.auftraege
        .filter(a => !a.storniert && a.tag === t && a.planung.fahrerId === f.id)
        .sort(planVergleich);
      h += '<td data-titel="' + esc(WOCHENTAGE[i] + ", " + tagKurz(t)) + '">' +
        (liste.length ? liste.map(a => wochenKarte(a, false)).join("")
                      : '<span class="woche-leer">—</span>') + '</td>';
    });
    h += '</tr>';
  });
  h += '</tbody></table></div>';

  h += '<div class="hinweis"><b>Zur Lesart:</b> Jede Karte zeigt Uhrzeit, Auftrag, Kunde, ' +
       'Strecke, Gespann, Container und Zustand. Konflikte stammen aus derselben Prüfung ' +
       'wie im Tagesplan und im Auftragsdetail. „Am Vortag beladen“ heißt: der Container ' +
       'liegt schon auf dem Chassis, am Einsatztag fällt keine Beladezeit mehr an. ' +
       'Alle Zeiten sind ' + simMarke("Demo-Planwerte") + '.</div>';
  return h;
}

/* Eine kompakte Auftragskarte für den Wochenplan. */
function wochenKarte(a, ohneFahrerSpalte){
  const m = massgeblich(a);
  const s = zeitstatus(a);
  const sc = schritt(a);
  const kl = konfliktLage(a);
  const f = fahrerVon(a.planung.fahrerId);
  const z = zugVon(a.planung.zugmaschineId);
  const c = chsVon(a.planung.chassisId);
  const frueh = fruehterminHinweis(a);

  let h = '<div class="wkarte' + (kl.konflikte.length ? ' wkarte-konflikt' : '') +
          (a.planung.fahrerId ? '' : ' wkarte-offen') + '">' +
    '<button class="wkarte-kopf" data-tun="oeffnenAus" data-wert="' + a.id + '" ' +
      'data-aus="wochenplan">' +
      '<span class="wzeit num">' + esc(m.zeit || "—") + '</span> ' +
      '<span class="wnummer">Auftrag ' + esc(a.nummer) + '</span>' +
      '<span class="wbezug">' + esc(m.art) + '</span>' +
    '</button>' +
    '<div class="wzeile"><b>' + esc(a.kunde || "ohne Kunde") + '</b></div>' +
    '<div class="wzeile neben">' + esc(kurzOrt(a.abhol.adresse)) + ' → ' +
      esc(kurzOrt(a.liefer.adresse)) + '</div>' +
    '<div class="wzeile neben">' +
      esc(f ? f.name : "kein Fahrer") + ' · ' +
      esc(z ? z.kennzeichen : "keine Zugmaschine") + ' · ' +
      esc(c ? c.nummer : "kein Chassis") + '</div>' +
    '<div class="wzeile neben">Container ' +
      esc(a.container.bestaetigt ? contLesbar(a.container.bestaetigt)
          : a.container.erwartet ? contLesbar(a.container.erwartet) : "noch unbekannt") + '</div>' +
    '<div class="wmarken">' +
      '<span class="marke ' + sc.klasse + '">' + esc(sc.wort) + '</span>' +
      '<span class="marke ' + s.klasse + '">' + esc(s.satz) + '</span>' +
      (vortagBeladen(a) ? '<span class="marke m-marine">Am Vortag beladen</span>' : '') +
      (a.entwurf ? '<span class="marke m-gelb">Änderungen offen</span>' : '') +
      (a.freigegeben ? '' : '<span class="marke m-grau">Entwurf</span>') +
    '</div>';

  if (frueh)
    h += '<div class="whinweis">' + esc(frueh) + '</div>';

  if (kl.offen)
    h += '<div class="wkonflikt">Belegung offen – nächste Tour derzeit nicht sicher planbar.</div>';
  else if (kl.konflikte.length) {
    /* In der schmalen Wochenspalte höchstens zwei Sätze, sonst erschlägt
       ein Konflikt die ganze Karte. Vollständig steht es im Detail. */
    const saetze = konfliktSaetze(kl.konflikte);
    h += '<div class="wkonflikt">' + saetze.slice(0,2).map(esc).join("<br>") +
      (saetze.length > 2 ? '<br>und ' + (saetze.length - 2) + ' weitere — siehe Auftrag.' : '') +
      '</div>';
  }

  h += '<div class="wtun">' +
    '<button class="btn" data-tun="oeffnenAus" data-wert="' + a.id + '" data-aus="wochenplan">Öffnen</button>' +
    '<button class="btn" data-tun="bearbeitenAus" data-wert="' + a.id + '" data-aus="wochenplan">Bearbeiten</button>' +
    '<button class="btn" data-tun="fahrerAendernAus" data-wert="' + a.id + '" data-aus="wochenplan">Fahrer ändern</button>' +
    '</div></div>';
  return h;
}

/* Konkrete Konfliktsätze: welches Mittel kollidiert mit welchem Auftrag.
   Benutzt die vorhandene Konfliktliste, formuliert sie nur aus. */
function konfliktSaetze(kf){
  const raus = [];
  kf.forEach(k => {
    const satz = k.was === "Fahrer"
      ? "Fahrer " + (k.wer || "") + " überschneidet sich mit Auftrag " + k.mit.nummer + "."
      : k.was === "Zugmaschine"
      ? "Zugmaschine " + (k.wer || "") + " ist zu diesem Zeitpunkt bereits durch Auftrag " +
        k.mit.nummer + " belegt."
      : "Chassis " + (k.wer || "") + " ist zu diesem Zeitpunkt bereits durch Auftrag " +
        k.mit.nummer + " belegt.";
    if (raus.indexOf(satz) < 0) raus.push(satz);
  });
  return raus;
}
/* ---------- Aufträge (alle Tage) ---------- */
function ansichtAuftraege(){
  const liste = D.auftraege.slice().sort((x,y) =>
    (x.tag+"").localeCompare(y.tag+"") || String(x.abhol.zeit||"").localeCompare(String(y.abhol.zeit||"")));
  let h = '<div class="leiste"><h2 style="font-size:22px">Alle Aufträge</h2>' +
    '<button class="btn haupt gross" data-tun="neu" style="margin-left:auto">+ Neuer Auftrag</button></div>';
  h += '<div class="hinweis">In der Dispo bleiben alle Tage zugänglich. Der Fahrer sieht ' +
       'dagegen nur seinen aktuellen Arbeitstag — der nächste Tag erscheint bei ihm erst, ' +
       'wenn alle heutigen Aufträge abgeschlossen sind, und startet dort keine Tour automatisch.</div>';
  h += '<div class="karte tabellen-karte" style="padding:0"><table class="tabelle"><thead><tr>' +
    '<th>Tag</th><th>Auftrag</th><th>Kunde</th><th>Zustand</th><th>Fahrer</th><th>Öffnen</th>' +
    '</tr></thead><tbody>';
  liste.forEach(a => {
    const f = fahrerVon(a.planung.fahrerId);
    const sc = schritt(a);
    h += '<tr'+(a.storniert ? ' style="opacity:.55"' : '')+'>' +
      '<td data-titel="Tag">'+esc(tagKurz(a.tag))+'</td>' +
      '<td data-titel="Auftrag"><span class="haupt-zelle">'+esc(a.nummer)+'</span>' +
        '<span class="neben">'+esc(a.kundenRef || "ohne Referenz")+'</span></td>' +
      '<td data-titel="Kunde">'+esc(a.kunde || "—")+'</td>' +
      '<td data-titel="Zustand"><span class="marke '+sc.klasse+'">'+esc(sc.wort)+'</span>' +
        (a.freigegeben ? '' : '<span class="neben">Entwurf, nicht freigegeben</span>')+'</td>' +
      '<td data-titel="Fahrer">'+esc(f ? f.name : "—")+'</td>' +
      '<td data-titel="Aktion"><button class="btn" data-tun="oeffnenAus" data-wert="'+a.id+'" data-aus="auftraege">Öffnen</button></td>' +
      '</tr>';
  });
  h += '</tbody></table></div>';
  h += '<div class="btn-reihe"><button class="btn gefahr" data-tun="reset">Demodaten zurücksetzen</button></div>';
  return h;
}

/* ---------- Detail ---------- */
function ansichtDetail(){
  const a = auftragVon(U.auftragId);
  if (!a) return '<div class="karte"><p class="leer">Auftrag nicht gefunden.</p></div>';
  const f = fahrerVon(a.planung.fahrerId), z = zugVon(a.planung.zugmaschineId), c = chsVon(a.planung.chassisId);
  const m = massgeblich(a), s = zeitstatus(a), sc = schritt(a);
  const kl = konfliktLage(a);
  const kf = kl.konflikte;

  const zurueckWort = { tagesplan:"Tagesplan", wochenplan:"Wochenplan",
                        auftraege:"Aufträge", meldungen:"Meldungen" }[U.vorher] || "Tagesplan";
  let h = '<div class="leiste"><button class="btn" data-tun="zurueck">← Zurück zu: '+esc(zurueckWort)+'</button>' +
    '<h2 style="font-size:22px">Auftrag '+esc(a.nummer)+' — '+esc(a.kunde||"ohne Kunde")+'</h2>' +
    '<span class="marke '+sc.klasse+'" style="margin-left:auto">'+esc(sc.wort)+'</span></div>';

  if (a.storniert)
    h += '<div class="warnkasten"><b>Dieser Auftrag ist storniert.</b> Er zählt nicht mehr im Tagesplan.</div>';

  if (a.entwurf) {
    const felder = entwurfUnterschiede(a);
    h += '<div class="warnkasten"><b>Änderungen noch nicht freigegeben.</b> ' +
      'Der Fahrer sieht weiter den zuletzt freigegebenen Stand, seine Bestätigung bleibt gültig. ' +
      'Es wurde keine Benachrichtigung ausgelöst.' +
      (felder.length ? '<br>Geändert: ' + esc(felder.join(", ")) : '') +
      '<div class="btn-reihe" style="margin-top:10px">' +
      '<button class="btn haupt" data-tun="entwurfFreigeben">Änderungen freigeben</button>' +
      '<button class="btn" data-tun="bearbeiten">Entwurf bearbeiten</button>' +
      '<button class="btn gefahr" data-tun="entwurfVerwerfen">Änderungen verwerfen</button>' +
      '</div></div>';
  }

  if (kl.offen) {
    h += '<div class="warnkasten"><b>Belegung offen – nächste Tour derzeit nicht sicher planbar.</b>' +
         '<br>' + esc(kl.grund || "") +
         ' Solange das Entladeende nicht feststeht, wird hier weder ein Konflikt noch ' +
         '„kein Konflikt“ behauptet.</div>';
  } else if (!kl.pruefbar) {
    h += '<div class="warnkasten"><b>Planung nicht vollständig prüfbar.</b> Es fehlt: ' +
         esc((kl.fehlt||[]).join(", ")) + '. Solange das fehlt, wird hier <b>nicht</b> ' +
         '„kein Konflikt“ behauptet.</div>';
  } else if (kf.length) {
    /* Je überschneidendem Auftrag EIN Eintrag. Fahrer, Zugmaschine und
       Chassis derselben Überschneidung dreifach aufzulisten wäre Lärm. */
    const jeAuftrag = [];
    kf.forEach(k => {
      let e = jeAuftrag.find(x => x.mit.id === k.mit.id);
      if (!e) { e = { mit:k.mit, satz:k.satz, mittel:[] }; jeAuftrag.push(e); }
      e.mittel.push(k.was + (k.wer ? " " + k.wer : ""));
    });
    h += '<div class="warnkasten"><b>Planungskonflikt — bleibt bestehen, bis er aufgelöst wird:</b>' +
         '<ul style="margin:6px 0 0 18px">';
    jeAuftrag.forEach(k => {
      h += '<li>' + konfliktSaetze(kf.filter(x => x.mit.id === k.mit.id)).map(esc).join("<br>") +
           '<br><span style="font-weight:600">'+esc(k.satz)+'</span></li>';
    });
    h += '</ul><p style="margin-top:6px">Gerechnet über die ganze Tour: Anfahrt, Warten und ' +
         'Beladen, Fahrt, Warten und Entladen, Restarbeiten, Rückgabestopp und Übergangsfahrt ' +
         '(' + simMarke("Demo-Planwerte") + '). Die Planung darf so gespeichert werden, wird aber ' +
         'nicht als machbar dargestellt.</p></div>';
  }

  /* Die Tourbindung offenlegen, damit die Warnung nachvollziehbar ist. */
  const bel = belegung(a);
  if (bel && !bel.unvollstaendig && bel.offen) {
    h += '<div class="karte"><h2>Bindung des Gespanns</h2>' +
      '<div class="warnkasten" style="margin-bottom:0">' +
      '<b>Belegung offen – nächste Tour derzeit nicht sicher planbar.</b><br>' +
      esc(bel.grund || "") +
      (bel.geplantBis
        ? '<br>Ursprünglich <b>geplantes</b> Ende wäre ' + esc(hhmm(bel.geplantBis)) +
          ' Uhr gewesen — das ist keine aktuelle Aussage, sondern nur der alte Planwert.'
        : '') + '</div></div>';
  } else if (bel && !bel.unvollstaendig) {
    h += '<div class="karte"><h2>Bindung des Gespanns</h2>' +
      '<p>Von <b>'+esc(hhmm(bel.von))+' Uhr</b> bis <b>'+esc(hhmm(bel.bis))+' Uhr</b>' +
      (tagVon(bel.von) !== tagVon(bel.bis) ? ' (über Mitternacht)' : '') + '.</p>' +
      '<p style="margin-top:8px;font-size:15px;color:#47525D">' +
      bel.abschnitte.map(x => esc(x.wort)+" "+x.min+" Min.").join(" · ") +
      '<br>' + simMarke("Demo-Planwerte") + ' keine Verkehrsdaten, keine Tachographendaten.</p></div>';
  }

  /* Zeitlage */
  h += '<div class="karte"><h2>Zeitlage</h2><div class="paar">' +
    zeile("Maßgeblicher Termin", (m.zeit ? m.zeit+" Uhr" : "—") + " — " + m.art + " bei " + (m.ort||"—")) +
    zeile("Voraussichtliche Ankunft", (s.ankunft ? hhmm(s.ankunft)+" Uhr" : "—")) +
    '<div class="zeile"><div class="was">Reserve oder Verspätung</div>' +
      '<div class="wert"><span class="marke '+s.klasse+'">'+esc(s.satz)+'</span></div>' +
      (s.zusatz ? '<div class="was">'+esc(s.zusatz)+'</div>' : '') + '</div>' +
    zeile("Betrieblicher Puffer", a.planung.pufferMin + " Min. (getrennt von der Fahrzeit)") +
    '</div>' +
    '<p class="hinweis" style="margin-top:12px">' + simMarke("Simuliert") +
      ' Ortung und Ankunftsberechnung. Zuletzt gerechnet: ' + esc(hhmm(a.datenZeit)||"—") +
      ' Uhr, Ortung: ' + esc(hhmm(a.ortungZeit)||"—") + ' Uhr. Fahrzeiten sind Demo-Planwerte. ' +
      'Eine gesetzliche Restlenkzeit wird nicht angezeigt — dafür fehlen Tachographendaten.</p>' +
    '</div>';

  /* Stammdaten des Auftrags */
  h += '<div class="karte"><h2>Auftrag</h2><div class="paar">' +
    zeile("Interne Auftragsnummer", a.nummer) +
    zeile("Kunde", a.kunde) + zeile("Kundenreferenz", a.kundenRef || "—") +
    zeile("Auftraggeber", a.auftraggeberId
      ? ((kundeVon(a.auftraggeberId)||{}).firma || a.auftraggeberId) + " (" + a.auftraggeberId + ")"
      : "nicht zugeordnet") +
    zeile("Einsatztag", tagLang(a.tag)) +
    zeile("Freigabe", a.freigegeben ? "Für Fahrer freigegeben (Demo)" : "Entwurf, nicht freigegeben") +
    '</div></div>';

  /* Beladung: am selben Tag oder schon am Vortag. */
  const frueh = fruehterminHinweis(a);
  h += '<div class="karte"><h2>Beladung</h2>';
  if (vortagBeladen(a)) {
    h += '<p>' + marke("m-marine","Am Vortag beladen") + '</p><div class="paar">' +
      zeile("Datum der Beladung", a.beladung.datum ? tagLang(a.beladung.datum) : "—") +
      zeile("Geplante Uhrzeit", a.beladung.zeit ? a.beladung.zeit + " Uhr" : "—") +
      zeile("Beladestelle", a.beladung.stelle || "—") +
      zeile("Hinweis", a.beladung.hinweis || "—") +
      '</div>' +
      '<p class="hinweis" style="margin-top:10px">Der Container liegt bereits auf dem Chassis. ' +
      'Am Einsatztag fällt deshalb <b>keine Beladezeit</b> mehr an — das Gespann startet direkt ' +
      'mit der Fahrt zum Kunden. Es wird keine zusätzliche Fahrzeit angenommen.</p>';
  } else {
    h += '<p>' + marke("m-grau","Am selben Tag") + ' Anfahrt, Warten und Beladen fallen am ' +
         'Einsatztag an und sind in der Tourrechnung enthalten.</p>';
    if (frueh)
      h += '<div class="warnkasten" style="margin-top:10px"><b>' + esc(frueh) + '</b><br>' +
           'Der Termin liegt vor ' + FRUEH_AB + ' Uhr. Das ist ein Hinweis, keine Sperre — ' +
           'der Auftrag lässt sich unverändert speichern und freigeben.</div>';
  }
  h += '</div>';

  h += '<div class="karte"><h2>Abholung</h2><div class="paar">' +
    zeile("Firma / Terminal / Depot", a.abhol.firma) + zeile("Adresse", a.abhol.adresse) +
    zeile("Abholtermin", (a.abhol.zeit ? tagKurz(a.abhol.datum)+", "+a.abhol.zeit+" Uhr" : "ohne feste Uhrzeit")) +
    zeile("Referenz / Freistellnummer", a.abhol.referenz || "—") +
    zeile("Hinweis", a.abhol.hinweis || "—") +
    '</div></div>';

  h += '<div class="karte"><h2>Anlieferung</h2><div class="paar">' +
    zeile("Firma", a.liefer.firma) + zeile("Adresse", a.liefer.adresse) +
    zeile("Liefertermin", (a.liefer.zeit ? tagKurz(a.liefer.datum)+", "+a.liefer.zeit+" Uhr" : "—")) +
    zeile("Ansprechpartner", a.liefer.ansprech || "—") +
    zeile("Telefon", a.liefer.telefon || "—") +
    zeile("Hinweis für den Fahrer", a.liefer.hinweis || "—") +
    '</div></div>';

  /* Container: erwartet und bestätigt getrennt */
  h += '<div class="karte"><h2>Container</h2>' +
    '<div class="gegenueber">' +
      '<div><div class="was">Erwartete Nummer (Dispo)</div>' +
        '<div class="wert">'+esc(contLesbar(a.container.erwartet) || "Noch unbekannt")+'</div></div>' +
      '<div><div class="was">Vom Fahrer bestätigt</div>' +
        '<div class="wert">'+(a.container.bestaetigt ? esc(contLesbar(a.container.bestaetigt))
                                                     : "Noch nicht bestätigt")+'</div></div>' +
    '</div>';
  if (a.container.abweichung) {
    h += '<div class="warnkasten"><b>Die Nummern stimmen nicht überein.</b> ' +
      (a.container.trotzdem
        ? 'Der Fahrer hat ausdrücklich „Trotzdem abholen“ gewählt. Das ist die Entscheidung ' +
          'des Fahrers und <b>keine Genehmigung durch die Dispo</b>.'
        : 'Der Fahrer hat nicht „Trotzdem abholen“ gewählt.') + '</div>';
  }
  if (a.container.ungeprueft)
    h += '<div class="warnkasten">Die Nummer ist als <b>ungeprüft</b> markiert — sie konnte nicht sicher gelesen werden.</div>';
  h += '<div class="paar">' +
    zeile("Größe und Typ", a.container.groesse + " " + a.container.typ) +
    zeile("Siegelnummer", a.container.siegel || "—") +
    zeile("Zustand", a.container.beladen === "leer" ? "Leer" : "Beladen") +
    zeile("Leercontainer-Rückgabe", a.container.rueckgabeOrt || "—") +
    zeile("Rückgabetermin", a.container.rueckgabeTermin || "—") +
    '</div></div>';

  /* Planung */
  h += '<div class="karte"><h2>Planung</h2><div class="paar">' +
    zeile("Fahrer", f ? f.name + " · " + f.telefon : "Nicht zugewiesen") +
    zeile("Zugmaschine", z ? z.kennzeichen : "—") +
    zeile("Chassis", c ? c.nummer + " · " + c.groesse : "—") +
    zeile("Geplante Ladezeit", a.planung.ladenMin + " Min.") +
    zeile("Geplante Wartezeit", a.planung.wartenMin + " Min.") +
    zeile("Geplante Entladezeit", a.planung.entladenMin + " Min.") +
    zeile("Betrieblicher Puffer", a.planung.pufferMin + " Min.") +
    '</div></div>';

  /* Fahrerbestätigung */
  h += '<div class="karte"><h2>Fahrerbestätigung</h2>' +
    (a.bestaetigt
      ? '<p>' + marke("m-gruen","Gesehen und bestätigt") + ' am ' + esc(tagKurz(tagVon(a.bestaetigt))) +
        ' um ' + esc(hhmm(a.bestaetigt)) + ' Uhr.</p>'
      : '<p>' + marke("m-grau","Noch nicht bestätigt") +
        ' Der Fahrer hat den Auftrag noch nicht als gesehen markiert.</p>') +
    '<p class="hinweis" style="margin-top:10px">Nach einer wesentlichen Änderung (Adressen, Termine, ' +
    'Fahrer, Fahrzeug, Chassis oder erwartete Containernummer) muss der Fahrer erneut bestätigen. ' +
    'Eine reine interne Dispo-Notiz setzt die Bestätigung nicht zurück.</p></div>';

  /* Ablauf */
  h += '<div class="karte"><h2>Ablauf</h2><ul class="ablauf">' +
    ablaufZeile("Abholung", a.ablauf.abholung) +
    ablaufZeile("Ankunft beim Kunden", a.ablauf.ankunft) +
    ablaufZeile("Warten gemeldet", a.ablauf.warten) +
    ablaufZeile("Entladebeginn", a.ablauf.entladenStart) +
    ablaufZeile("Entladeende", a.ablauf.entladenEnde) +
    ablaufZeile("Ablieferung", a.ablauf.abgabe) +
    '</ul>';
  h += '<p style="margin-top:10px;color:#47525D;font-size:15px">Ankunft bedeutet nicht, dass die ' +
       'Entladung begonnen hat — das sind getrennte Schritte.</p>';

  if (a.ablauf.entladenStart && !a.ablauf.entladenEnde) {
    const rest = entladeRest(a);
    h += '<div class="hinweis" style="margin-top:10px"><b>Entladung läuft.</b> ' +
      (a.entladeVerlaengerung && a.entladeVerlaengerung.unbekannt
        ? 'Der Fahrer hat „Weiß ich noch nicht“ gewählt. Es wird bewusst keine nächste Ankunft vorhergesagt.'
        : (rest == null ? 'Restzeit unbekannt.'
           : 'Verbleibend etwa <b>'+Math.round(rest)+' Min.</b>' +
             (a.entladeVerlaengerung
               ? ' — verlängert um '+a.entladeVerlaengerung.min+' Min., gezählt ab '+
                 esc(hhmm(a.entladeVerlaengerung.ab))+' Uhr.'
               : ''))) +
      ' Ein ablaufender Timer schließt den Auftrag nicht ab; das macht nur der Fahrer.</div>';
    h += '<div class="btn-reihe" style="margin-top:10px">' +
      '<button class="btn" data-tun="fahrerschritt" data-wert="verlaengern30">Demo: Fahrer meldet +30 Min.</button>' +
      '<button class="btn" data-tun="fahrerschritt" data-wert="verlaengern60">Demo: Fahrer meldet +60 Min.</button>' +
      '<button class="btn" data-tun="fahrerschritt" data-wert="unbekannt">Demo: „Weiß ich noch nicht“</button>' +
      '<button class="btn haupt" data-tun="fahrerschritt" data-wert="entladenFertig">Demo: Entladung fertig</button>' +
      '</div>';
  }
  h += '<div class="paar" style="margin-top:12px">' +
    zeile("Geplante Warte-/Entladezeit", a.planung.wartenMin + " / " + a.planung.entladenMin + " Min.") +
    zeile("Tatsächliche Entladezeit",
      (a.ablauf.entladenStart && a.ablauf.entladenEnde)
        ? Math.round(minZw(a.ablauf.entladenStart, a.ablauf.entladenEnde)) + " Min."
        : "noch nicht abgeschlossen") +
    '</div></div>';

  /* Fotos */
  h += '<div class="karte"><h2>Fotos</h2><div class="fotos">' +
    fotoFeld("Abholfoto", a.fotos.abholung) + fotoFeld("Ablieferfoto", a.fotos.abgabe) +
    '</div><p style="margin-top:8px;color:#47525D;font-size:15px">' + simMarke("Simuliert") +
    ' Demo-Bilder, keine Kamera und keine Nummernerkennung.</p></div>';

  /* Dokumente */
  h += '<div class="karte"><h2>Dokumente</h2>';
  if (!a.dokumente.length) {
    h += '<p style="color:#47525D">Noch kein Dokument hinterlegt.</p>';
  } else {
    /* Je Dokument einzeln entscheiden. Es wird nie automatisch alles
       freigegeben, was intern hinterlegt ist. */
    h += '<ul class="dok-liste">' + a.dokumente.map((d,i) =>
      '<li><span class="dok-name"><b>'+esc(d.art)+'</b> — '+esc(d.name)+
        ' <span class="neben">('+esc(d.stand)+')</span></span>' +
      '<span class="marke '+(d.extern?"m-gruen":"m-grau")+'">' +
        (d.extern?"Für Auftraggeber freigegeben":"Nur intern")+'</span>' +
      '<button class="btn" data-tun="dokExtern" data-wert="'+i+'">' +
        (d.extern?"Freigabe zurücknehmen":"Für Auftraggeber freigeben")+'</button></li>').join("") +
      '</ul>';
  }
  h += '<div class="btn-reihe" style="margin-top:10px">' +
    ['EIR','CMR','Lieferschein'].map(art =>
      '<button class="btn" data-tun="dok" data-wert="'+art+'">'+art+' hinterlegen (Demo)</button>').join("") +
    '</div></div>';

  /* Freigabelink für den Auftraggeber */
  h += karteFreigabelink(a);

  /* Route, ETA und Automatik */
  h += karteRouteEta(a);
  h += karteAutomatik(a);

  /* Nächster Auftrag */
  const naechster = naechsterAuftrag(a);
  h += '<div class="karte"><h2>Nächster Auftrag</h2>';
  if (!naechster) {
    h += '<p style="color:#47525D">Für diesen Fahrer ist an diesem Tag kein weiterer Auftrag geplant.</p>';
  } else {
    const np = folgePrognose(a, naechster);
    const nm = massgeblich(naechster);
    /* Angezeigt wird genau die Zahl, mit der auch Tagesplan und Alarmprüfung
       arbeiten — sonst widersprächen sich die Ansichten. */
    const npAnzeige = prognose(naechster);
    const nres = npAnzeige.iso ? reserve(nm.iso, npAnzeige.iso) : null;
    const nk = ampel(nres);
    const klasse = nres == null ? "m-grau"
                 : nk === "rot" ? "m-rot" : nk === "gelb" ? "m-gelb" : "m-gruen";
    const satz = nres == null ? "Ankunft unklar"
               : nres < 0 ? Math.abs(nres)+" Min. verspätet" : nres+" Min. Reserve";
    h += '<div class="paar">' +
      zeile("Auftrag", naechster.nummer + " · " + naechster.kunde) +
      zeile("Maßgeblicher Termin", (nm.zeit ? nm.zeit+" Uhr" : "—") + " — " + nm.art) +
      zeile("Prognostizierte Ankunft",
        npAnzeige.iso ? hhmm(npAnzeige.iso)+" Uhr ("+(np.bezug||nm.art)+")" : "—") +
      '<div class="zeile"><div class="was">Zeitreserve</div><div class="wert">' +
        '<span class="marke '+klasse+'">'+esc(satz)+'</span></div></div>' +
      '</div>';
    if (!npAnzeige.ausKette && npAnzeige.iso)
      h += '<div class="hinweis" style="margin-top:10px">Dieses Fahrzeug ist bereits unterwegs. ' +
           'Es gilt seine eigene laufende Ankunftsprognose (' + simMarke("simuliert") +
           '), nicht die Kettenrechnung von diesem Auftrag aus. Die Kettenrechnung steht ' +
           'darunter als Vergleich.</div>';
    if (np.rechnung && np.rechnung.length) {
      h += '<p style="margin-top:10px;font-size:15px;color:#47525D"><b>So gerechnet (' +
        simMarke("Demo-Planwerte") + '):</b></p>' +
        '<ul class="ablauf" style="margin-top:6px">' +
        np.rechnung.map(x => {
          /* Die Zeile, die den maßgeblichen Termin trifft, wird markiert —
             sonst ist unklar, welche Zahl oben in der Reserve steckt. */
          const trifft = npAnzeige.ausKette && x.bis === npAnzeige.iso;
          return '<li><span class="zeit">'+esc(hhmm(x.bis))+'</span><span'+
            (trifft ? ' style="font-weight:700"' : '')+'>' +
            (x.min > 0 ? '+ '+x.min+' Min. — ' : '') + esc(x.wort) +
            (trifft ? ' — maßgeblich für den Termin („'+esc(nm.art)+'“)' : '') +
            '</span></li>';
        }).join("") +
        '</ul>';
    }
    if (np.grund) h += '<div class="hinweis" style="margin-top:10px">'+esc(np.grund)+'</div>';
  }
  h += '</div>';

  /* Verlauf */
  /* Jeder Eintrag nennt seine Quelle: „angekommen“ heißt etwas anderes,
     wenn das GPS es gemeldet hat, als wenn der Fahrer es gedrückt hat. */
  h += '<div class="karte"><h2>Verlauf</h2><ul class="verlauf">' +
    a.verlauf.slice().reverse().map(e => {
      const q = QUELLEN[e.quelle] || QUELLEN.dispo;
      return '<li><span class="quelle '+q.klasse+'" title="'+esc(q.erklaer)+'">'+esc(q.wort)+'</span>' +
        '<b>'+esc(tagKurz(tagVon(e.zeit)))+' '+esc(hhmm(e.zeit))+' Uhr</b> — '+esc(e.text)+'</li>';
    }).join("") +
    '</ul><p class="sim-satz">Automatisch = aus Ortung und Zone erkannt. Fahrer = in der ' +
    'Fahrer-App gemeldet. Dispo = hier eingetragen. System = berechnet.</p></div>';

  /* Dispo-Notiz */
  h += '<div class="karte"><h2>Interne Dispo-Notiz</h2>' +
    '<div class="feld"><label for="notizfeld">Nur für die Dispo sichtbar. Ändert die Fahrerbestätigung nicht.</label>' +
    '<textarea id="notizfeld">'+esc(a.dispoNotiz||"")+'</textarea></div>' +
    '<div class="btn-reihe" style="margin-top:10px">' +
    '<button class="btn" data-tun="notizSpeichern">Notiz speichern</button></div></div>';

  /* Aktionen */
  h += '<div class="karte"><h2>Aktionen</h2><div class="btn-reihe">' +
    '<button class="btn haupt" data-tun="bearbeiten">Bearbeiten</button>' +
    '<button class="btn" data-tun="fahrerAendern">Fahrer ändern</button>' +
    '<button class="btn" data-tun="kopieren">Auftrag kopieren</button>' +
    '<button class="btn" data-tun="anrufen">Fahrer anrufen</button>' +
    (a.freigegeben ? '' : '<button class="btn" data-tun="freigeben">Für Fahrer freigeben</button>') +
    (a.storniert ? '' : '<button class="btn gefahr" data-tun="stornieren">Stornieren</button>') +
    '</div></div>';
  return h;
}
/* ---------- Route & ETA im Auftrag ----------
   Eine Karte, die zusammenfasst, worauf die Ankunft beruht: wo das
   Fahrzeug steht, welcher Weg noch vor ihm liegt, was die Rechnung
   daraus macht und wie belastbar das ist. */
function karteRouteEta(a){
  const z = zugVon(a.planung.zugmaschineId);
  const t = z && z.telematik;
  const g = datenGuete(a);
  const auto = automatisierungsGrad(a);

  let h = '<div class="karte"><h2>Route &amp; ETA</h2>';

  if (!t || !t.verbunden) {
    h += '<p style="color:#47525D">Für ' +
      esc(z ? z.kennzeichen : "dieses Fahrzeug") + ' ist kein Telematikgerät verbunden. ' +
      'Ohne Position lässt sich keine Reststrecke bestimmen; es gilt die Planung.</p>';
    h += '<div class="paar" style="margin-top:10px">' +
      zeile("Automatisierung", auto.wort) +
      zeile("Routing", anbieterSatz("routing")) + '</div></div>';
    return h;
  }

  /* Wohin geht es als Nächstes? Vor der Abholung zur Abholstelle,
     danach zum Kunden. Dieselbe Unterscheidung wie überall sonst. */
  const zumKunden = !!a.ablauf.abholung;
  const ziel = zumKunden
    ? { firma:a.liefer.firma, adresse:a.liefer.adresse }
    : { firma:a.abhol.firma,  adresse:a.abhol.adresse };
  const zielOrt = ortVon(ziel.adresse);
  const frisch = zeitstempelPruefen(t.letzteMeldung, "Ortungszeitpunkt").ok;

  /* Reststrecke aus den Koordinaten — nicht aus dem Ortsnamen im
     Positionstext. „A27 bei Verden, Richtung Walsrode“ enthält beide
     Orte; daraus eine Strecke zu lesen, ginge zwangsläufig schief. */
  const restKm = (zielOrt && typeof t.latitude === "number")
    ? Math.round(luftlinieKm(t.latitude, t.longitude, zielOrt.lat, zielOrt.lng) * STRECKENFAKTOR)
    : null;
  /* Die Erfahrungswerte gehören zur Strecke des Auftrags, nicht zum
     Reststück ab der aktuellen Position. */
  const le = lernEta(a.abhol.adresse, a.liefer.adresse, z, jetztIso());
  const p = prognose(a);
  /* Genau EINE Ankunftszeit: die der laufenden Berechnung. Die
     verbleibende Fahrzeit wird daraus abgeleitet, nicht daneben neu
     gerechnet — sonst stünden zwei Zahlen da, die sich widersprechen. */
  const restMin = p.iso ? Math.max(0, Math.round(minZw(jetztIso(), p.iso))) : null;
  const m = massgeblich(a);
  const res = (p.iso && m.iso) ? reserve(m.iso, p.iso) : null;
  const lage = zoneLage(a);

  h += '<div class="paar">' +
    zeile("Aktuelle Position", (t.ort || "unbekannt") +
      (t.geschwindigkeit ? " · " + t.geschwindigkeit + " km/h" : " · steht")) +
    zeile("Nächstes Ziel", ziel.firma + (zielOrt ? " (" + zielOrt.wort + ")" : "")) +
    zeile("Reststrecke", restKm != null ? restKm + " km" : "—") +
    zeile("Verbleibende Zeit bis Ankunft", restMin != null ? restMin + " Min." : "—") +
    zeile("ETA", p.iso ? hhmm(p.iso) + " Uhr" : "nicht belastbar bestimmbar") +
    zeile("Termin", (m.zeit ? m.zeit + " Uhr" : "—") + " — " + m.art) +
    '<div class="zeile"><div class="was">Reserve</div><div class="wert">' +
      (res == null ? '<span class="marke m-grau">nicht bestimmbar</span>'
                   : '<span class="marke ' + (res < 0 ? "m-rot" : res <= GRENZE_ORANGE ? "m-gelb" : "m-gruen") +
                     '">' + (res < 0 ? Math.abs(res) + " Min. zu spät" : res + " Min.") + '</span>') +
      '</div></div>' +
    zeile("Datenstand", frisch
      ? "Ortung " + hhmm(t.letzteMeldung) + " Uhr, aktuell"
      : "Ortung " + (t.letzteMeldung ? hhmm(t.letzteMeldung) + " Uhr" : "unbekannt") +
        " — älter als " + MAX_ALTER + " Minuten") +
    zeile("Routing", anbieterSatz("routing")) +
    '<div class="zeile"><div class="was">Datenqualität</div><div class="wert">' +
      '<span class="marke ' + g.klasse + '">' + esc(g.stufe.charAt(0).toUpperCase()+g.stufe.slice(1)) + '</span>' +
      '</div></div>' +
    '</div>';

  if (lage.frisch && (lage.beiKunde || lage.beiAbholung))
    h += '<p class="sim-satz">Das Fahrzeug befindet sich in der Zone „' +
         esc(lage.zone ? lage.zone.name : "") + '“.</p>';

  if (!frisch)
    h += '<div class="warnkasten" style="margin:10px 0 0">' +
         '<b>Ankunftszeit derzeit nicht belastbar.</b> Die letzte Ortung ist zu alt. ' +
         'Es wird bewusst keine genaue Uhrzeit angezeigt.</div>';

  h += '<p class="sim-satz">' + simMarke("Simuliert") + ' Position, Verkehr und Routing stammen ' +
       'aus dieser Vorschau. ' + esc((ANBIETER.routing.hinweis||"")) + '. ' +
       '<b>Echt gerechnet:</b> Entfernung, Reserve und die Gewichtung der Erfahrungswerte.</p>';

  /* Lern-/Routingvergleich offenlegen, damit die Zahl nicht vom Himmel fällt. */
  h += '<div class="lernkasten"><b>Prognosegrundlage</b> ' + simMarke("KI-/Lernprognose – Demo") +
       '<p>Die angezeigte ETA kommt aus der laufenden Tourberechnung — es gibt nur diese eine. ' +
       'Darunter steht, woraus sich die Fahrzeit für die Strecke ' +
       esc(kurzOrt(a.abhol.adresse)) + ' → ' + esc(kurzOrt(a.liefer.adresse)) + ' speist:</p>' +
       '<p>' + esc(le.erklaerung) + '</p>';
  const ls = lernStandzeit(a.auftraggeberId, "entladung");
  if (ls.minuten != null)
    h += '<p>Standzeit bei diesem Auftraggeber bisher im Schnitt <b>' + ls.minuten +
         ' Minuten</b> aus ' + ls.anzahl + ' Beobachtungen (geplant: ' +
         esc(String(a.planung.entladenMin)) + ' Minuten).</p>';
  else
    h += '<p>Für diesen Auftraggeber liegen noch zu wenige eigene Standzeiten vor – ' +
         'es wird mit dem Planwert gerechnet.</p>';
  h += '</div>';
  return h + '</div>';
}

/* ---------- Automatisierung, Vorschläge und Korrektur ---------- */
function karteAutomatik(a){
  const auto = automatisierungsGrad(a);
  const st = transportStatus(a);
  const offen = (a.vorschlaege || []).filter(x => !x.erledigt);

  let h = '<div class="karte"><h2>Automatischer Status</h2>' +
    '<div class="paar">' +
    '<div class="zeile"><div class="was">Automatisierung</div><div class="wert">' +
      '<span class="marke ' + auto.klasse + '">' + esc(auto.wort) + '</span></div></div>' +
    zeile("Aktueller Zustand", (STATUS_WOERTER[st]||{}).intern || st) +
    '</div>' +
    '<p class="sim-satz">' + esc(auto.grund) + '</p>';

  if (a.automatik && a.automatik.an === false)
    h += '<div class="hinweis" style="margin-top:10px">Die Automatik ist für diesen Auftrag ' +
         'ausgeschaltet, weil der Status von Hand korrigiert wurde' +
         (a.automatik.korrigiert ? ' (' + esc(hhmm(a.automatik.korrigiert)) + ' Uhr)' : '') +
         '. Automatische Zonenwechsel überschreiben die Korrektur nicht.</div>';

  if (offen.length) {
    h += '<div class="vorschlagliste">';
    offen.forEach(vs => {
      h += '<div class="vorschlag"><b>' + esc(vs.titel) + '</b>' +
        '<p>' + esc(vs.text) + '</p>' +
        '<div class="btn-reihe">' +
        '<button class="btn haupt" data-tun="vorschlagJa" data-wert="'+esc(vs.id)+'">Bestätigen</button>' +
        '<button class="btn" data-tun="vorschlagNein" data-wert="'+esc(vs.id)+'">Nicht bestätigen</button>' +
        '</div></div>';
    });
    h += '</div>';
  }

  h += '<div class="btn-reihe" style="margin-top:12px">' +
    '<button class="btn" data-tun="statusKorrigieren">Status korrigieren</button>' +
    '<button class="btn" data-tun="automatikSchalten">' +
      (a.automatik && a.automatik.an === false ? "Automatik wieder einschalten" : "Automatik ausschalten") +
    '</button></div>';
  return h + '</div>';
}

function zeile(was, wert){
  return '<div class="zeile"><div class="was">'+esc(was)+'</div><div class="wert">'+esc(wert==null?"—":wert)+'</div></div>';
}
function ablaufZeile(wort, iso){
  return '<li><span class="zeit'+(iso?'':' offen')+'">'+(iso ? esc(hhmm(iso)) : "—")+'</span>' +
         '<span'+(iso?'':' class="offen"')+'>'+esc(wort)+(iso?'':' — noch offen')+'</span></li>';
}
function fotoFeld(wort, bild){
  if (!bild) return '<div><div class="was" style="font-size:14px;color:#47525D">'+esc(wort)+'</div>' +
                    '<p style="color:#47525D">Noch kein Foto.</p></div>';
  return '<div><div class="was" style="font-size:14px;color:#47525D;margin-bottom:4px">'+esc(wort)+'</div>' +
         '<img class="foto" src="'+esc(bild)+'" alt="'+esc(wort)+'" data-tun="bild" data-wert="'+esc(wort)+'"></div>';
}

/* Stabiler Reihenfolge-Schlüssel.
   Bewusst NICHT massgeblich(): der springt vom Abhol- auf den Liefertermin,
   sobald abgeholt ist — dann würde sich die Reihenfolge mitten am Tag
   verschieben und plötzlich ein anderer Folgeauftrag drankommen. */
function planSchluessel(a){
  const iso = zeitpunkt(a.abhol.datum, a.abhol.zeit) ||
              zeitpunkt(a.liefer.datum, a.liefer.zeit);
  return { iso, nummer:String(a.nummer) };
}
function planVergleich(x, y){
  const sx = planSchluessel(x), sy = planSchluessel(y);
  if (sx.iso && sy.iso) {
    const d = new Date(sx.iso) - new Date(sy.iso);
    if (d) return d;
  } else if (sx.iso !== sy.iso) {
    return sx.iso ? -1 : 1;                       // ohne Termin ans Ende
  }
  return sx.nummer.localeCompare(sy.nummer);      // gleicher Termin: feste Ordnung
}

/* Die geplante Tourfolge eines Fahrers an einem Einsatztag.
   Bewusst je Tag: eine Tour ist eine Tagesleistung. Nach Feierabend
   erbt der nächste Tag keine Verzögerung des Vortags.
   (Für die Konfliktprüfung gilt das NICHT — dort werden Tage bewusst
   übergreifend verglichen, weil eine Tour über Mitternacht laufen kann.) */
function tourFolge(fahrerId, tag){
  if (!fahrerId) return [];
  return D.auftraege
    .filter(o => !o.storniert && o.planung.fahrerId === fahrerId &&
                 (tag == null || o.tag === tag))
    .sort(planVergleich);
}

/* Nächster noch offener Auftrag desselben Fahrers an demselben Einsatztag. */
function naechsterAuftrag(a){
  const folge = tourFolge(a.planung.fahrerId, a.tag);
  const i = folge.findIndex(o => o.id === a.id);
  if (i < 0) return null;
  for (let k = i + 1; k < folge.length; k++) {
    if (!folge[k].ablauf.abgabe) return folge[k];
  }
  return null;
}

/* ===========================================================
   Tourrechnung — die EINE Grundlage

   Für jeden Fahrer und Einsatztag wird die Tour einmal durchgerechnet.
   Ergebnis je Auftrag liegt danach in a.rechnung2 und speist Tagesplan,
   Auftragsdetail, Belegung, Konfliktprüfung und Alarme. Es gibt bewusst
   keine zweite Rechnung daneben.

   Grundgedanke: Ein Auftrag beginnt, wenn der Fahrer nach dem Vorgänger
   verfügbar ist — frühestens jedoch zum vereinbarten Abholtermin. Dadurch
   fängt vorhandene Leerzeit eine Verzögerung von selbst auf, statt dass
   pauschal Minuten auf alle Termine addiert werden.

   Abholankunft und Kundenankunft werden getrennt geführt. Ist das
   Entladeende unklar, bleibt alles Nachfolgende ebenfalls unklar.
   =========================================================== */
function tourRechnen(folge){
  let freiAb = null;          // wann der Fahrer nach dem Vorgänger frei ist
  let vorher = null;          // vorheriger Auftrag (für die Übergangsfahrt)
  let unklarGrund = null;     // ab hier ist die Kette nicht mehr bestimmbar

  folge.forEach(o => {
    const p = o.planung || {};
    const schritte = [];
    const schritt = (min, wort, bis) => {
      if (min > 0 || min === 0) schritte.push({ wort, min:Math.round(min), bis });
    };
    const geplantAbhol = zeitpunkt(o.abhol.datum, o.abhol.zeit);
    const geplantLiefer = zeitpunkt(o.liefer.datum, o.liefer.zeit);
    const fahrtHin = fahrzeit(o.abhol.adresse, o.liefer.adresse);
    const wartenAbhol = p.wartenAbholMin || 0;

    /* Ein abgeschlossener Auftrag bindet nichts mehr. */
    if (o.ablauf.abgabe) {
      o.rechnung2 = { abholAnkunft:o.ablauf.abholung, kundenAnkunft:o.ablauf.ankunft,
                      entladeEnde:o.ablauf.entladenEnde, belegungVon:null, belegungBis:null,
                      abschnitte:[], unklar:false, grund:null, erledigt:true, ausKette:false };
      freiAb = o.ablauf.abgabe; vorher = o; return;
    }

    /* --- 1 · Ankunft an der Abholstelle ------------------------------- */
    let abholAnkunft = null, ausKette = false;
    if (o.ablauf.abholung) {
      abholAnkunft = o.ablauf.abholung;                 // Tatsache
      schritt(0, "Abholung bestätigt", abholAnkunft);
    } else if (unklarGrund) {
      o.rechnung2 = { abholAnkunft:null, kundenAnkunft:null, entladeEnde:null,
                      belegungVon:null, belegungBis:null, abschnitte:[],
                      unklar:true, grund:unklarGrund, ausKette:true };
      vorher = o; return;
    } else if (freiAb) {
      /* Verfügbarkeit nach dem Vorgänger, zuzüglich Übergangsfahrt. */
      const uebergang = vorher ? fahrzeit(vorher.liefer.adresse, o.abhol.adresse) : 0;
      const frueheste = inMin(uebergang, freiAb);
      schritt(uebergang, "Fahrt zur nächsten Abholung", frueheste);
      /* Freie Zeit fängt Verzögerung auf: es gilt der spätere der beiden. */
      if (geplantAbhol && new Date(geplantAbhol) > new Date(frueheste)) {
        abholAnkunft = geplantAbhol;
        schritt(Math.round(minZw(frueheste, geplantAbhol)),
                "Wartet bis zum vereinbarten Abholtermin", abholAnkunft);
      } else {
        abholAnkunft = frueheste;
        ausKette = true;                                 // verspätet aus der Tour
      }
    } else {
      abholAnkunft = geplantAbhol;
      /* Bei Vortagsbeladung gibt es am Einsatztag keine Abholung — der
         Schritt würde die Rechnung nur verwirren. */
      if (abholAnkunft && !vortagBeladen(o)) schritt(0, "Abholung geplant", abholAnkunft);
    }

    if (!abholAnkunft && !geplantLiefer) {
      o.rechnung2 = { abholAnkunft:null, kundenAnkunft:null, entladeEnde:null,
                      belegungVon:null, belegungBis:null, abschnitte:schritte,
                      unklar:true, grund:"Kein Abhol- oder Liefertermin hinterlegt",
                      ausKette:false };
      vorher = o; return;
    }
    if (!abholAnkunft)
      abholAnkunft = inMin(-(wartenAbhol + p.ladenMin + fahrtHin), geplantLiefer);

    /* --- 2 · Ankunft beim Kunden -------------------------------------- */
    let kundenAnkunft, t = abholAnkunft;
    if (o.ablauf.ankunft) {
      kundenAnkunft = o.ablauf.ankunft;                 // Tatsache
      schritt(0, "Beim Kunden angekommen", kundenAnkunft);
    } else if (o.ablauf.abholung && o.prognose &&
               datenZuverlaessig(o.prognoseZeit || o.datenZeit, o.ortungZeit).ok) {
      /* Fahrzeug rollt: seine eigene laufende Prognose ist die bessere
         Auskunft als eine Rechnung vom Vorgängerstopp. */
      kundenAnkunft = o.prognose;
      schritt(0, "Unterwegs, Ankunft beim Kunden voraussichtlich", kundenAnkunft);
    } else if (vortagBeladen(o)) {
      /* Am Vortag beladen: es wird nur noch gefahren. Frühestens los geht
         es, wenn der Fahrer frei ist; ohne Vorgänger zum Liefertermin hin
         gerechnet. Keine erfundene Zusatzzeit. */
      const losSpaetestens = geplantLiefer ? inMin(-fahrtHin, geplantLiefer) : abholAnkunft;
      const los = (freiAb && new Date(abholAnkunft) > new Date(losSpaetestens))
        ? abholAnkunft : losSpaetestens;
      schritt(0, "Am Vortag beladen — Abfahrt ohne Beladezeit", los);
      t = inMin(fahrtHin, los); schritt(fahrtHin, "Fahrt zum Kunden", t);
      kundenAnkunft = t;
    } else {
      t = inMin(wartenAbhol, t); if (wartenAbhol) schritt(wartenAbhol, "Warten bei der Abholung", t);
      t = inMin(p.ladenMin, t);  schritt(p.ladenMin, "Beladung", t);
      t = inMin(fahrtHin, t);    schritt(fahrtHin, "Fahrt zum Kunden", t);
      kundenAnkunft = t;
    }

    /* --- 3 · Entladeende ---------------------------------------------- */
    let entladeEnde = null, entladeUnklar = null;
    if (o.ablauf.entladenEnde) {
      entladeEnde = o.ablauf.entladenEnde;
      schritt(0, "Entladung fertig gemeldet", entladeEnde);
    } else if (o.ablauf.entladenStart) {
      const rest = entladeRest(o);
      if (rest.unklar) { entladeUnklar = rest.grund; }
      else { entladeEnde = inMin(rest.min); schritt(rest.min, "Restliche Entladung", entladeEnde); }
    } else {
      /* Vor dem Liefertermin wird gewartet; Entladen beginnt nicht früher. */
      let start = kundenAnkunft;
      if (geplantLiefer && new Date(start) < new Date(geplantLiefer)) {
        const w = Math.round(minZw(start, geplantLiefer));
        start = geplantLiefer; schritt(w, "Warten bis zum Liefertermin", start);
      }
      if (p.wartenMin) { start = inMin(p.wartenMin, start); schritt(p.wartenMin, "Warten beim Kunden", start); }
      entladeEnde = inMin(p.entladenMin, start);
      schritt(p.entladenMin, "Entladung (geplant)", entladeEnde);
    }

    /* --- 4 · Belegung und Verfügbarkeit für den nächsten Auftrag ------- */
    /* Am Vortag beladen: die Bindung am Einsatztag beginnt mit der Abfahrt
       zum Kunden, nicht mit einer Anfahrt zur Abholstelle. */
    const belegungVon = vortagBeladen(o)
      ? inMin(-fahrzeit(o.abhol.adresse, o.liefer.adresse), kundenAnkunft)
      : inMin(-PLAN.anfahrtAbholung, abholAnkunft);
    let belegungBis = null, geplantBelegungBis = null;
    const nachlauf = (ab) => {
      let x = inMin(PLAN.nacharbeit, ab);
      if (o.container && o.container.rueckgabeOrt)
        x = inMin(PLAN.fahrtZumDepot + PLAN.depotstopp, x);
      return x;
    };
    if (entladeEnde) {
      const nach = nachlauf(entladeEnde);
      schritt(PLAN.nacharbeit, "Restarbeiten", inMin(PLAN.nacharbeit, entladeEnde));
      if (o.container && o.container.rueckgabeOrt)
        schritt(PLAN.fahrtZumDepot + PLAN.depotstopp, "Rückgabe / Depotstopp", nach);
      belegungBis = inMin(PLAN.uebergang, nach);
      freiAb = inMin(PLAN.pause, nach);
      schritt(PLAN.pause, "Eingeplante Pause", freiAb);
    } else {
      /* Unklares Ende: kein Belegungsende behaupten. Der geplante Wert
         bleibt als ausdrücklich so benannter Vergleich erhalten. */
      const geplantEnde = inMin(p.entladenMin, o.ablauf.entladenStart || kundenAnkunft);
      geplantBelegungBis = inMin(PLAN.uebergang, nachlauf(geplantEnde));
      unklarGrund = entladeUnklar;
      freiAb = null;
    }

    /* Reiner Planauftrag: nichts ist passiert, nichts wurde geortet und die
       Tour hat ihn nicht verschoben. Dann ist die „Ankunft“ einfach der
       vereinbarte Termin — daraus darf keine knappe Reserve abgeleitet
       werden, das wäre eine Aussage, die die Daten nicht hergeben. */
    const nurPlan = !ausKette && !o.ablauf.abholung && !o.ablauf.ankunft &&
                    !o.ablauf.entladenStart && !o.prognose;

    o.rechnung2 = { abholAnkunft, kundenAnkunft, entladeEnde,
                    belegungVon, belegungBis, geplantBelegungBis,
                    abschnitte:schritte, unklar:!!entladeUnklar,
                    grund:entladeUnklar, ausKette, nurPlan };
    vorher = o;
  });
}

/* Alle Touren neu rechnen. Nach „Dauert länger“, „Entladung fertig“,
   jeder Planänderung und beim Start.
   Wichtig: Nur der Prognosezeitpunkt wird dabei frisch — der
   Ortungszeitpunkt bleibt unberührt. */
function ketteRechnen(){
  D.auftraege.forEach(a => { a.rechnung2 = null; });

  /* Je Fahrer und Einsatztag eine eigene Kette. */
  const gruppen = [];
  D.auftraege.forEach(a => {
    if (!a.planung.fahrerId || a.storniert) return;
    const s = a.planung.fahrerId + "|" + a.tag;
    if (gruppen.indexOf(s) < 0) gruppen.push(s);
  });
  gruppen.forEach(s => {
    const teile = s.split("|");
    tourRechnen(tourFolge(teile[0], teile[1]));
  });

  /* Aufträge ohne Fahrer stehen für sich allein. */
  D.auftraege.forEach(a => {
    if (!a.rechnung2 && !a.storniert) tourRechnen([a]);
  });
}

/* Prognose für den Folgeauftrag — dieselbe Rechnung, nur aus Sicht des
   aktuellen Auftrags dargestellt. */
function folgePrognose(a, n){
  const r = tourErgebnis(n);
  if (!r) return { iso:null, rechnung:null, grund:"Keine Berechnung vorhanden" };
  if (r.unklar) return { iso:null, rechnung:null, grund:r.grund };
  const m = massgeblich(n);
  return { iso: m.art === "Abholung" ? r.abholAnkunft : r.kundenAnkunft,
           isoAbholung:r.abholAnkunft, isoKunde:r.kundenAnkunft,
           bezug:m.art, rechnung:r.abschnitte, grund:null };
}

function feld(name, wort, wert, E, typ, erklaer, gesperrt){

/* Formular aus den Feldern einlesen */
function formLesen(){
  const F = U.formular;
  const g = id => { const e = document.getElementById("f_"+id); return e ? e.value : ""; };
  const c = id => { const e = document.getElementById("f_"+id); return e ? e.checked : false; };
  ["kunde","kundenRef","auftraggeberId","tag","abholFirma","abholAdresse","abholDatum","abholZeit","abholRef",
   "abholHinweis","lieferFirma","lieferAdresse","lieferDatum","lieferZeit","lieferAnsprech",
   "lieferTelefon","lieferHinweis","contErwartet","contGroesse","contTyp","contSiegel",
   "contBeladen","contRueckgabe","contRueckTermin","fahrerId","zugId","chsId",
   "beladungArt","beladungDatum","beladungZeit","beladungStelle","beladungHinweis"
  ].forEach(k => F[k] = g(k));
  ["ladenMin","wartenAbholMin","wartenMin","entladenMin","pufferMin"].forEach(k => F[k] = Number(g(k)) || 0);
  F.contUnbekannt = c("contUnbekannt");
  return F;
}

/* Prüfung. Entwürfe dürfen unvollständig sein, Freigaben nicht. */
function pruefen(F, fuerFreigabe){
  const E = {};
  if (!fuerFreigabe) {
    // Ein Entwurf braucht nur etwas, woran man ihn wiedererkennt.
    if (!F.kunde.trim()) E.kunde = "Bitte wenigstens den Kunden eintragen, damit der Entwurf auffindbar bleibt.";
    return E;
  }
  if (!F.kunde.trim())        E.kunde = "Ohne Kunde kann der Fahrer den Auftrag nicht zuordnen.";
  if (!F.tag)                 E.tag = "Bitte den Einsatztag angeben.";
  if (!F.abholFirma.trim())   E.abholFirma = "Bitte angeben, wo abgeholt wird.";
  if (!F.abholAdresse.trim()) E.abholAdresse = "Der Fahrer braucht die vollständige Abholadresse.";
  if (!F.abholDatum)          E.abholDatum = "Bitte das Datum der Abholung angeben.";
  if (!F.lieferFirma.trim())  E.lieferFirma = "Bitte angeben, wohin geliefert wird.";
  if (!F.lieferAdresse.trim())E.lieferAdresse = "Der Fahrer braucht die vollständige Lieferadresse.";
  if (!F.lieferDatum)         E.lieferDatum = "Bitte das Datum der Anlieferung angeben.";
  if (!F.lieferZeit)          E.lieferZeit = "Ohne Liefertermin lässt sich keine Reserve berechnen.";
  if (!F.fahrerId)            E.fahrerId = "Bitte einen Fahrer zuweisen.";
  if (!F.zugId)               E.zugId = "Bitte eine Zugmaschine zuweisen.";
  if (!F.chsId)               E.chsId = "Bitte ein Chassis zuweisen.";

  const nr = (F.contErwartet||"").trim();
  if (!F.contUnbekannt) {
    if (!nr) E.contErwartet = "Bitte die Nummer eintragen — oder „noch unbekannt“ ankreuzen.";
    else if (!contGueltig(nr))
      E.contErwartet = "Diese Nummer ist nicht gültig: vier Buchstaben, sieben Ziffern, " +
                       "und die Prüfziffer muss stimmen.";
  }
  if (F.entladenMin <= 0) E.entladenMin = "Bitte eine Entladezeit größer als 0 angeben.";
  return E;
}

/* Auftrag aus dem Formular bauen oder aktualisieren. */
/* Die Angaben, die der Fahrer für seine Fahrt braucht. Ändert sich hier
   etwas, muss er erneut bestätigen. */
function wesentlichesAus(q){
  return JSON.stringify([
    q.abhol, q.liefer, q.planung.fahrerId, q.planung.zugmaschineId,
    q.planung.chassisId, q.container.erwartet, q.tag, q.beladung || null
  ]);
}
/* Formularwerte in die Auftragsform bringen — ohne sie schon zu setzen. */
function formZuStand(F, alt){
  return {
    tag:F.tag, kunde:F.kunde.trim(), kundenRef:F.kundenRef.trim(),
    auftraggeberId:F.auftraggeberId || null,
    abhol:{ firma:F.abholFirma.trim(), adresse:F.abholAdresse.trim(), datum:F.abholDatum,
            zeit:F.abholZeit||null, referenz:F.abholRef.trim(), hinweis:F.abholHinweis.trim() },
    liefer:{ firma:F.lieferFirma.trim(), adresse:F.lieferAdresse.trim(), datum:F.lieferDatum,
             zeit:F.lieferZeit||null, ansprech:F.lieferAnsprech.trim(),
             telefon:F.lieferTelefon.trim(), hinweis:F.lieferHinweis.trim() },
    container: Object.assign({}, (alt && alt.container) || {}, {
      erwartet: F.contUnbekannt ? "" : (F.contErwartet||"").trim().toUpperCase(),
      groesse:F.contGroesse, typ:F.contTyp, siegel:F.contSiegel.trim(),
      beladen:F.contBeladen, rueckgabeOrt:F.contRueckgabe.trim(),
      rueckgabeTermin:F.contRueckTermin||null
    }),
    planung:{ fahrerId:F.fahrerId||null, zugmaschineId:F.zugId||null, chassisId:F.chsId||null,
              ladenMin:F.ladenMin, wartenMin:F.wartenMin, wartenAbholMin:F.wartenAbholMin,
              entladenMin:F.entladenMin, pufferMin:F.pufferMin },
    beladung:{ art:F.beladungArt || "selberTag",
               datum:F.beladungArt === "vortag" ? (F.beladungDatum || null) : null,
               zeit: F.beladungArt === "vortag" ? (F.beladungZeit || null) : null,
               stelle:F.beladungArt === "vortag" ? (F.beladungStelle || "") : "",
               hinweis:F.beladungArt === "vortag" ? (F.beladungHinweis || "") : "" }
  };
}
/* Welche Angaben unterscheiden den Entwurf vom freigegebenen Stand?
   Damit die Dispo sieht, worüber sie eigentlich entscheidet. */
function entwurfUnterschiede(a){
  if (!a.entwurf) return [];
  const e = a.entwurf, raus = [];
  const gleich = (x,y) => JSON.stringify(x) === JSON.stringify(y);
  if (!gleich(e.abhol, a.abhol)) raus.push("Abholung");
  if (!gleich(e.liefer, a.liefer)) raus.push("Anlieferung");
  if (e.tag !== a.tag) raus.push("Einsatztag");
  if (e.kunde !== a.kunde) raus.push("Kunde");
  if (e.kundenRef !== a.kundenRef) raus.push("Kundenreferenz");
  if (("auftraggeberId" in e) && (e.auftraggeberId||null) !== (a.auftraggeberId||null))
    raus.push("Auftraggeber");
  if ((e.container||{}).erwartet !== (a.container||{}).erwartet) raus.push("erwartete Containernummer");
  if (e.planung.fahrerId !== a.planung.fahrerId) raus.push("Fahrer");
  if (e.planung.zugmaschineId !== a.planung.zugmaschineId) raus.push("Zugmaschine");
  if (e.planung.chassisId !== a.planung.chassisId) raus.push("Chassis");
  if (JSON.stringify(e.beladung||null) !== JSON.stringify(a.beladung||null)) raus.push("Beladung");
  if (!gleich([e.planung.ladenMin,e.planung.wartenAbholMin,e.planung.wartenMin,
               e.planung.entladenMin,e.planung.pufferMin],
              [a.planung.ladenMin,a.planung.wartenAbholMin,a.planung.wartenMin,
               a.planung.entladenMin,a.planung.pufferMin])) raus.push("Zeitplanung");
  return raus;
}

/* Den Stand in den Auftrag übernehmen. */
function standSetzen(a, s){
  a.tag = s.tag; a.kunde = s.kunde; a.kundenRef = s.kundenRef;
  if ("auftraggeberId" in s) a.auftraggeberId = s.auftraggeberId || null;
  a.abhol = s.abhol; a.liefer = s.liefer;
  a.container = Object.assign({}, a.container, s.container);
  a.planung = s.planung;
  if (s.beladung) a.beladung = s.beladung;
}
/* Was steht beim Bearbeiten im Formular: der Entwurf, sonst der freigegebene Stand. */
function standZumBearbeiten(a){
  return a.entwurf ? Object.assign({}, a, a.entwurf) : a;
}

function formSpeichern(fuerFreigabe){
  const F = formLesen();
  const E = pruefen(F, fuerFreigabe);
  U.fehler = E;
  if (Object.keys(E).length) {
    U.notiz = fuerFreigabe
      ? "Die Freigabe ist noch nicht möglich. Die rot markierten Felder erklären, was fehlt."
      : "Der Entwurf braucht mindestens einen Kunden.";
    zeichne();
    const erstes = document.querySelector(".feld.hatfehler input, .feld.hatfehler select");
    if (erstes) erstes.focus();
    return;
  }

  let a = F.id ? auftragVon(F.id) : null;
  const istNeu = !a;
  let wesentlichGeaendert = false;

  /* Ein bereits freigegebener Auftrag wird durch „Entwurf speichern“ NICHT
     verändert. Der Fahrer sieht weiter den freigegebenen Stand, seine
     Bestätigung bleibt gültig. Die Änderungen liegen daneben, bis sie
     ausdrücklich freigegeben werden. */
  if (!istNeu && !fuerFreigabe && a.freigegeben) {
    a.entwurf = formZuStand(F, a);
    a.entwurf.gespeichert = jetztIso();
    a.verlauf.push(v(jetztIso(), "Änderungsentwurf gespeichert — noch nicht freigegeben"));
    speichern();
    U.fehler = {}; U.formular = null; U.auftragId = a.id; U.bereich = "detail";
    U.notiz = '<b>Änderungen noch nicht freigegeben.</b> Der Fahrer sieht weiter den zuletzt ' +
              'freigegebenen Stand; seine Bestätigung bleibt gültig. Es wurde keine ' +
              'Benachrichtigung ausgelöst.';
    zeichne();
    return;
  }

  if (istNeu) {
    D.laufNummer++;
    a = {
      id:"a"+Date.now(), nummer:String(D.laufNummer), storniert:false,
      ablauf:{ abholung:null, ankunft:null, warten:null, entladenStart:null,
               entladenEnde:null, abgabe:null },
      entladeVerlaengerung:null, fotos:{abholung:null,abgabe:null}, dokumente:[],
      bestaetigt:null, dispoNotiz:"", entwurf:null,
      ortungZeit:null, datenZeit:null, prognoseZeit:null, prognose:null,
      alarmGesendet:false, verlauf:[ v(jetztIso(),"Auftrag angelegt") ],
      auftraggeberId:null, bilder:[], standort:null,
      container:{}, planung:{}, abhol:{}, liefer:{},
      beladung:{ art:"selberTag", datum:null, zeit:null, stelle:"", hinweis:"" }
    };
    D.auftraege.push(a);
  }

  const vorher = istNeu ? null : wesentlichesAus(a);
  const neu = formZuStand(F, a);
  standSetzen(a, neu);
  if (!istNeu) wesentlichGeaendert = vorher !== wesentlichesAus(a);

  if (fuerFreigabe) {
    const warFrei = a.freigegeben;
    a.freigegeben = true;
    a.entwurf = null;                       // Entwurf ist in den Stand übergegangen
    a.verlauf.push(v(jetztIso(), warFrei
      ? "Änderungen freigegeben (Demo)" + (wesentlichGeaendert ? " — wesentliche Angaben geändert" : "")
      : "Für Fahrer freigegeben (Demo)"));
  } else if (istNeu) {
    a.freigegeben = false;
    a.verlauf.push(v(jetztIso(), "Als Entwurf gespeichert"));
  } else {
    a.verlauf.push(v(jetztIso(), "Auftrag bearbeitet"));
  }

  if (wesentlichGeaendert && a.bestaetigt) {
    a.bestaetigt = null;
    a.verlauf.push(v(jetztIso(), "Wesentliche Änderung — Fahrerbestätigung ist wieder offen"));
  }

  /* Eine Planänderung verschiebt die ganze Tour: alles neu rechnen,
     damit Tagesplan, Detail, Konflikte und Alarme dieselbe Zahl benutzen. */
  a.prognoseZeit = jetztIso();
  ketteRechnen();
  const kf = konflikte(a);
  alarmePruefen();
  speichern();

  U.fehler = {}; U.formular = null; U.auftragId = a.id; U.bereich = "detail";
  U.notiz = (fuerFreigabe
      ? '<b>Demo-Freigabe.</b> Der Auftrag ist in dieser Vorschau als freigegeben markiert. ' +
        'Es wurde nichts zugestellt — die Fahrer-App ist noch nicht verbunden.'
      : '<b>Entwurf gespeichert.</b> Entwürfe dürfen unvollständig bleiben und werden dem Fahrer nicht gezeigt.') +
    (wesentlichGeaendert ? ' Die Fahrerbestätigung wurde zurückgesetzt.' : '') +
    (kf.length ? ' <b>Achtung:</b> Es besteht ein Planungskonflikt — siehe unten.' : '');
  zeichne();
}

    '<button class="btn" data-tun="stammNeu" data-art="chassis">+ Chassis anlegen</button></div></div>';
  return h;
}

        (a ? ' · Auftrag '+esc(a.nummer)+' · '+esc(a.kunde) : '')+

      (m.text ? '<p style="margin-top:6px">'+esc(m.text)+'</p>' : '');

    if (m.art === "abweichung" && a) {

          esc(contLesbar(a.container.erwartet))+'</div></div>' +
        '<div><div class="was">Fotografiert / bestätigt</div><div class="wert">'+
          esc(contLesbar(a.container.bestaetigt))+'</div></div>' +
        '</div>';
      if (a.fotos.abholung)
        h += '<img class="foto" src="'+esc(a.fotos.abholung)+'" alt="Abholfoto" ' +
             'data-tun="bild" data-wert="Abholfoto">';
      h += '<p style="margin-top:8px">' +
        (a.container.trotzdem
          ? 'Der Fahrer hat ausdrücklich <b>„Trotzdem abholen“</b> bestätigt. ' +
            'Das ist die Entscheidung des Fahrers und <b>keine Genehmigung durch die Dispo</b>.'
          : 'Der Fahrer hat <b>nicht</b> „Trotzdem abholen“ gewählt.') + '</p>';

    h += '<div class="btn-reihe" style="margin-top:10px">' +
      (a ? '<button class="btn" data-tun="oeffnen" data-wert="'+a.id+'">Auftrag öffnen</button>' : '') +
      (m.gesehen
        ? '<span class="marke m-grau">Gesehen</span>'
        : '<button class="btn haupt" data-tun="gesehen" data-wert="'+m.id+'">Gesehen</button>') +
