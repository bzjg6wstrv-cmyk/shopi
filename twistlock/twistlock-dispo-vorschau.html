<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15202B">
<title>TWISTLOCK Dispo — Demo-Vorschau</title>
<style>
/* ===========================================================
   TWISTLOCK Dispo — Demo-Vorschau für I&M CARGO, Bremen

   Eine Datei, keine Anhänge, kein Server. Farben und Begriffe
   sind bewusst dieselben wie in der Fahrer-Vorschau, damit beides
   als ein Produkt wirkt.

   Grundsatz der Gestaltung: Farbe ist nie die einzige Information.
   Neben jeder Farbe steht immer ein Satz, der sie erklärt.
   =========================================================== */
:root{
  --ink:#15202B;          /* Text                                 */
  --soft:#47525D;         /* Nebentext, Kontrast 7,4:1 auf Weiß   */
  --paper:#FFFFFF;
  --seite:#E9EBE7;
  --linie:#CBD0CC;
  --linie2:#E3E6E2;

  --gruen:#0A6B31;  --gruen-flaeche:#E4F1E9;
  --gelb:#8A5200;   --gelb-flaeche:#FBEFD6;
  --rot:#A3161D;    --rot-flaeche:#FAE8E8;
  --marine:#1B4C78; --marine-flaeche:#E8F0F7;
  --grau-flaeche:#F2F3F1;

  --rand:16px;
  --radius:10px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--seite);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:17px;
  line-height:1.45;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3{margin:0;line-height:1.2}
p{margin:0}
button{font-family:inherit}

:focus-visible{outline:3px solid var(--marine);outline-offset:2px;border-radius:4px}

/* ---------- Demo-Kopf ---------- */
.demo-kopf{background:var(--ink);color:#fff;padding:12px var(--rand)}
.demo-kopf .zeile{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.demo-marke{display:inline-block;padding:3px 9px;border-radius:4px;font-weight:700;
  background:#FFD34D;color:#2A1D00;letter-spacing:.06em;font-size:14px}
.demo-kopf h1{font-size:20px;font-weight:700}
.demo-kopf .uhr{margin-left:auto;font-size:15px;color:#D6DBD9;font-variant-numeric:tabular-nums}
.demo-kopf .unter{font-size:15px;color:#D6DBD9;margin-top:6px;max-width:96ch}

.demo-notiz{background:#FFF8E1;border-left:8px solid #B07100;color:#5E3A00;
  padding:10px 14px;font-size:15px}
.demo-notiz b{color:#4A2E00}

/* ---------- Gerüst ---------- */
.rahmen{display:flex;align-items:flex-start;gap:0;min-height:60vh}
.navi{flex:0 0 232px;background:var(--paper);border-right:2px solid var(--linie);
  padding:12px;position:sticky;top:0}
.navi button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:13px 12px;margin-bottom:8px;border:2px solid var(--linie);border-radius:var(--radius);
  background:var(--paper);color:var(--ink);font-size:17px;font-weight:600;cursor:pointer}
.navi button:hover{background:var(--grau-flaeche)}
.navi button[aria-current="page"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.navi .zahl{margin-left:auto;font-size:15px;font-weight:700;padding:1px 8px;border-radius:999px;
  background:var(--rot);color:#fff}
.navi button[aria-current="page"] .zahl{background:#fff;color:var(--rot)}

.inhalt{flex:1 1 auto;min-width:0;padding:var(--rand)}

/* ---------- Bausteine ---------- */
.karte{background:var(--paper);border:2px solid var(--linie);border-radius:var(--radius);
  padding:14px;margin-bottom:14px}
.karte > h2{font-size:20px;margin-bottom:10px}
.karte > h3{font-size:17px;margin-bottom:8px}

.btn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--ink);
  border-radius:var(--radius);background:var(--paper);color:var(--ink);
  padding:11px 15px;font-size:16px;font-weight:600;cursor:pointer;min-height:46px}
.btn:hover{background:var(--grau-flaeche)}
.btn.haupt{background:var(--ink);color:#fff}
.btn.haupt:hover{background:#25313D}
.btn.gross{font-size:18px;padding:14px 20px;min-height:54px}
.btn.gefahr{border-color:var(--rot);color:var(--rot)}
.btn.gefahr:hover{background:var(--rot-flaeche)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-reihe{display:flex;flex-wrap:wrap;gap:10px}

/* Statusfarben — immer mit erklärendem Text daneben */
.marke{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;
  border:2px solid;font-size:15px;font-weight:700;white-space:nowrap}
.m-gruen{color:var(--gruen);background:var(--gruen-flaeche);border-color:var(--gruen)}
.m-gelb {color:var(--gelb); background:var(--gelb-flaeche); border-color:var(--gelb)}
.m-rot  {color:var(--rot);  background:var(--rot-flaeche);  border-color:var(--rot)}
.m-grau {color:var(--soft); background:var(--grau-flaeche); border-color:var(--soft)}
.m-marine{color:var(--marine);background:var(--marine-flaeche);border-color:var(--marine)}
.m-ink  {color:#fff;background:var(--ink);border-color:var(--ink)}

.sim{display:inline-block;padding:1px 8px;border-radius:4px;background:#FFD34D;color:#2A1D00;
  font-size:13px;font-weight:700;letter-spacing:.04em;white-space:nowrap}

.hinweis{background:var(--marine-flaeche);border-left:8px solid var(--marine);color:#16324B;
  padding:10px 13px;border-radius:0 6px 6px 0;font-size:15px;margin-bottom:12px}
.warnkasten{background:var(--rot-flaeche);border-left:8px solid var(--rot);color:#5E1013;
  padding:10px 13px;border-radius:0 6px 6px 0;font-size:15px;margin-bottom:12px}

/* Kennzahlen — bewusst nur drei, als Text, ohne Diagramme */
.zahlen{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.zahl-feld{flex:1 1 190px;border:2px solid var(--linie);border-radius:var(--radius);
  background:var(--paper);padding:11px 13px}
.zahl-feld .gross{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.zahl-feld .wort{font-size:15px;color:var(--soft)}
.zahl-feld.achtung{border-color:var(--rot);background:var(--rot-flaeche)}
.zahl-feld.achtung .gross{color:var(--rot)}

/* Datumsleiste + Filter */
.leiste{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.leiste .tag{font-weight:700;font-size:18px}
input[type=date],input[type=time],input[type=text],input[type=tel],input[type=number],select,textarea{
  font-family:inherit;font-size:16px;padding:10px;border:2px solid var(--linie);
  border-radius:8px;background:var(--paper);color:var(--ink);min-height:46px;width:100%}
textarea{min-height:72px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--marine);outline:none}

.filter{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filter button{border:2px solid var(--linie);background:var(--paper);color:var(--ink);
  border-radius:999px;padding:8px 14px;font-size:16px;font-weight:600;cursor:pointer;min-height:44px}
.filter button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* Tabelle */
/* Die Tabelle hat viele Spalten. Statt sie abzuschneiden, darf dieser
   eine Kasten waagerecht rollen — die Seite selbst nie. Ohne das wäre
   die Schaltfläche „Öffnen“ am rechten Rand unerreichbar. */
.tabellen-karte{overflow-x:auto}
.tabelle{width:100%;border-collapse:collapse;background:var(--paper);min-width:940px}
.tabelle th,.tabelle td{text-align:left;padding:9px 8px;border-bottom:2px solid var(--linie2);
  vertical-align:top;font-size:16px}
.tabelle td:first-child,.tabelle th:first-child{white-space:nowrap}
.tabelle th{background:var(--grau-flaeche);font-size:15px;border-bottom:2px solid var(--linie)}
.tabelle tr.nichtzug{background:#FFF8E1}
.tabelle tr.nichtzug td{border-bottom-color:#E8D9A8}
.tabelle .haupt-zelle{font-weight:700}
.tabelle .neben{display:block;font-size:14px;color:var(--soft);font-weight:400}
.num{font-variant-numeric:tabular-nums}

.leer{padding:22px;text-align:center;color:var(--soft);background:var(--paper);font-size:17px}

/* Formular */
.gruppe{border:2px solid var(--linie);border-radius:var(--radius);padding:13px;margin-bottom:14px;
  background:var(--paper)}
.gruppe > legend{font-weight:700;font-size:18px;padding:0 6px}
.felder{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.feld label{display:block;font-size:15px;font-weight:600;margin-bottom:4px}
.feld .erklaer{font-size:14px;color:var(--soft);margin-top:3px}
.feld.breit{grid-column:1/-1}
.feld .fehler{display:block;font-size:15px;color:var(--rot);font-weight:600;margin-top:4px}
.feld.hatfehler input,.feld.hatfehler select,.feld.hatfehler textarea{border-color:var(--rot);background:#FFF9F9}

/* Detail */
.paar{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.paar .zeile{border-bottom:1px solid var(--linie2);padding:7px 0}
.paar .was{font-size:14px;color:var(--soft)}
.paar .wert{font-size:17px;font-weight:600}

.ablauf{list-style:none;margin:0;padding:0}
.ablauf li{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--linie2)}
.ablauf .zeit{flex:0 0 66px;font-weight:700;font-variant-numeric:tabular-nums}
.ablauf .offen{color:var(--soft);font-weight:400}

.foto{width:100%;max-width:340px;border:2px solid var(--linie);border-radius:8px;
  background:var(--ink);cursor:pointer;display:block}
.fotos{display:flex;flex-wrap:wrap;gap:12px}

.verlauf{list-style:none;margin:0;padding:0;font-size:15px}
.verlauf li{padding:6px 0;border-bottom:1px solid var(--linie2);color:var(--soft)}
.verlauf b{color:var(--ink)}

/* Meldungen */
.meldung{border:2px solid var(--linie);border-left-width:8px;border-radius:var(--radius);
  padding:12px;margin-bottom:10px;background:var(--paper)}
.meldung.warn{border-left-color:var(--rot);background:var(--rot-flaeche)}
.meldung.info{border-left-color:var(--marine);background:var(--marine-flaeche)}
.meldung.erledigt{opacity:.62;background:var(--grau-flaeche);border-left-color:var(--soft)}
.meldung h3{font-size:17px;margin-bottom:4px}
.meldung .wann{font-size:14px;color:var(--soft)}
.gegenueber{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0}
.gegenueber div{flex:1 1 190px;border:2px solid var(--linie);border-radius:8px;padding:9px;
  background:var(--paper)}
.gegenueber .was{font-size:14px;color:var(--soft)}
.gegenueber .wert{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.04em}

/* Dialog */
dialog{border:3px solid var(--ink);border-radius:12px;padding:0;max-width:560px;width:calc(100% - 28px);
  background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(21,32,43,.55)}
.dlg-kopf{padding:14px;border-bottom:2px solid var(--linie);font-size:19px;font-weight:700}
.dlg-leib{padding:14px;font-size:17px}
.dlg-fuss{padding:14px;border-top:2px solid var(--linie);display:flex;gap:10px;flex-wrap:wrap;
  justify-content:flex-end}
.bild-dlg{max-width:92vw}
.bild-dlg img{width:100%;display:block;background:var(--ink)}

/* Stammdaten */
.liste-zeile{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:11px 0;
  border-bottom:2px solid var(--linie2)}
.liste-zeile .name{font-weight:700;font-size:17px;flex:1 1 180px}
.liste-zeile .neben{display:block;font-size:15px;font-weight:400;color:var(--soft);margin-top:2px}

/* ---------- Wochenplan ----------
   Gleiche Bausteine wie sonst: weiße Karten, dieselben Statusmarken,
   Farbe nie allein. Keine Diagramme, kein Ziehen mit der Maus. */
.tabelle.woche{min-width:1180px}
.tabelle.woche th,.tabelle.woche td{vertical-align:top;width:13%}
.tabelle.woche .woche-name{width:9%;min-width:150px;background:var(--grau-flaeche)}
.woche-leer{color:var(--soft)}
.woche-offen{display:flex;flex-wrap:wrap;gap:10px}
.woche-offen .wkarte{flex:1 1 260px;max-width:340px}

.wkarte{border:2px solid var(--linie);border-left-width:6px;border-radius:10px;
  padding:8px 9px;margin-bottom:8px;background:var(--paper)}
.wkarte:last-child{margin-bottom:0}
.wkarte-konflikt{border-left-color:var(--rot)}
.wkarte-offen{border-left-color:#B07100;background:#FFFDF5}
.wkarte-kopf{display:block;width:100%;text-align:left;border:0;background:none;padding:0 0 4px;
  cursor:pointer;font-family:inherit;color:var(--ink)}
.wkarte-kopf:hover .wnummer{text-decoration:underline}
.wzeit{font-weight:700;font-size:17px}
.wnummer{font-weight:700;font-size:15px;margin-left:6px}
.wbezug{display:block;font-size:13px;color:var(--soft);font-weight:400}
.wzeile{font-size:14px;line-height:1.35}
.wzeile.neben{color:var(--soft)}
.wmarken{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.wmarken .marke{font-size:13px;padding:1px 7px;border-width:2px}
.whinweis{margin-top:6px;font-size:13px;font-weight:600;color:var(--gelb);
  background:var(--gelb-flaeche);border-left:5px solid var(--gelb);padding:4px 7px;border-radius:0 4px 4px 0}
.wkonflikt{margin-top:6px;font-size:13px;font-weight:600;color:var(--rot);
  background:var(--rot-flaeche);border-left:5px solid var(--rot);padding:4px 7px;border-radius:0 4px 4px 0}
.wtun{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.wtun .btn{font-size:14px;padding:7px 10px;min-height:38px}

/* Handy: Tabellen werden zu Karten, damit nichts quer gescrollt werden muss */
@media (max-width:820px){
  .rahmen{flex-direction:column}
  .navi{flex:1 1 auto;width:100%;position:static;border-right:0;border-bottom:2px solid var(--linie);
    display:flex;gap:8px;overflow-x:auto;padding:10px}
  .navi button{width:auto;margin-bottom:0;white-space:nowrap;flex:0 0 auto}
  .inhalt{padding:12px}
  .tabellen-karte{overflow-x:visible}
  .tabelle{min-width:0}
  .tabelle.woche{min-width:0}
  .tabelle.woche th,.tabelle.woche td,.tabelle.woche .woche-name{width:auto}
  .woche-offen .wkarte{max-width:none}
  .tabelle thead{display:none}
  .tabelle,.tabelle tbody,.tabelle tr,.tabelle td{display:block;width:100%}
  .tabelle tr{border:2px solid var(--linie);border-radius:var(--radius);margin-bottom:12px;
    background:var(--paper);padding:6px}
  .tabelle tr.nichtzug{border-color:#B07100}
  .tabelle td{border-bottom:1px solid var(--linie2);padding:8px 6px}
  .tabelle td:last-child{border-bottom:0}
  .tabelle td::before{content:attr(data-titel);display:block;font-size:13px;color:var(--soft);
    font-weight:600;margin-bottom:2px}
}
@media (max-width:820px){
  /* Beim Umbruch soll der Demo-Zeitpunkt links stehen, nicht mittig hängen. */
  .demo-kopf .uhr{margin-left:0;flex-basis:100%}
}
@media (max-width:520px){
  body{font-size:16px}
  .demo-kopf h1{font-size:18px}
}
/* Prognosegrundlage, Vorschläge, Ereignisquellen */
.lernkasten{margin-top:12px;background:var(--grau-flaeche);border:1px solid var(--linie2);
  border-radius:var(--radius);padding:11px 13px;font-size:15px}
.lernkasten p{margin:6px 0 0;color:var(--soft)}
.lernkasten b{color:var(--ink)}
.vorschlagliste{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.vorschlag{border:2px solid var(--gelb);border-left-width:8px;background:var(--gelb-flaeche);
  border-radius:0 var(--radius) var(--radius) 0;padding:11px 13px}
.vorschlag b{font-size:17px}
.vorschlag p{margin:5px 0 10px;font-size:15px;color:#5E3A00}
.quelle{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.03em;
  padding:1px 7px;border-radius:4px;border:1px solid;margin-right:7px;white-space:nowrap}
.q-auto  {color:var(--marine);background:var(--marine-flaeche);border-color:#B9CFE3}
.q-fahrer{color:var(--gruen); background:var(--gruen-flaeche); border-color:#B7DCC6}
.q-dispo {color:var(--ink);   background:#fff;                 border-color:var(--linie)}
.q-system{color:var(--soft);  background:var(--grau-flaeche);  border-color:var(--linie)}
.q-ki    {color:var(--gelb);  background:var(--gelb-flaeche);  border-color:#E0C489}
.verlauf li{display:flex;gap:4px;flex-wrap:wrap;align-items:baseline}

/* Dispo-Assistent */
.empfehlung{border:2px solid var(--linie);border-left-width:8px;border-radius:0 var(--radius) var(--radius) 0;
  padding:12px 14px;margin-bottom:12px;background:var(--paper)}
.empfehlung.e-hoch{border-left-color:var(--rot);background:var(--rot-flaeche)}
.empfehlung.e-mittel{border-left-color:var(--gelb);background:var(--gelb-flaeche)}
.empfehlung.e-klein{border-left-color:var(--marine);background:var(--marine-flaeche)}
.e-kopf{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px}
.e-kopf b{flex:1 1 320px;font-size:17px}
.warum{margin:0 0 10px}
.warum>summary{cursor:pointer;font-weight:700;font-size:15px;padding:6px 0;min-height:32px}
.warum>summary:hover{text-decoration:underline}
.warum ul{margin:4px 0 0 18px;font-size:15px}
.warum li{padding:2px 0}
.tabelle.vergleich{min-width:0}
.tabelle.vergleich td:nth-child(2){color:var(--soft)}
.tabelle.vergleich td:nth-child(3){font-weight:700}
.wennkasten{margin-top:14px;border:2px solid var(--marine);border-radius:var(--radius);
  padding:13px;background:var(--marine-flaeche)}
.wennkasten h3{font-size:18px;margin-bottom:10px}
.wennkasten ul{margin:4px 0 0 18px}
.ki-beispiele{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ki-beispiele .btn{font-size:14px;padding:7px 11px;min-height:38px}
.ki-antwort{margin-top:14px;border:2px solid var(--linie);border-radius:var(--radius);
  padding:13px;background:var(--grau-flaeche)}
.ki-satz{font-size:17px;font-weight:700}
.ki-antwort ul{margin:8px 0 0 18px}
.ki-antwort li{padding:3px 0}

/* Freigabelinks in der Dispo */
.link-kasten{
  border:1px solid var(--linie2); border-radius:var(--radius);
  padding:12px 14px; margin-top:10px; background:var(--grau-flaeche);
}
.link-kopf{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:8px; }
.link-was{ font-weight:700; }
.link-adresse{
  display:block; font-size:14px; word-break:break-all; background:#fff;
  border:1px solid var(--linie2); border-radius:8px; padding:8px 10px;
}
.link-gueltig{ margin:8px 0 10px; font-size:14px; color:var(--soft); }
.kunde-kasten{
  border:1px solid var(--linie2); border-radius:var(--radius);
  padding:12px 14px; margin-bottom:14px;
}
.sim-satz{ margin:12px 0 0; color:var(--soft); font-size:15px; }
.dok-liste{ list-style:none; margin:0; padding:0; }
.dok-liste li{
  display:flex; flex-wrap:wrap; gap:10px; align-items:center;
  padding:10px 0; border-bottom:1px solid var(--linie2);
}
.dok-liste li:last-child{ border-bottom:0; }
.dok-name{ flex:1 1 260px; }

/* ===========================================================
   Auftraggeber-Ansicht

   Bewusst anders als die Dispo: keine Tabellen, keine Ampeln,
   keine Werkzeugleisten. Der Auftraggeber soll einen Tracking-Link
   sehen, keine Speditionssoftware. Zuerst fürs Handy gebaut,
   die Breite kommt darüber.
   =========================================================== */
body.extern-an{ background:#F4F5F3; }
body.extern-an .demo-kopf,
body.extern-an .demo-notiz,
body.extern-an .navi{ display:none; }
body.extern-an .rahmen{ max-width:none; margin:0; padding:0; box-shadow:none; border:0; background:transparent; }
body.extern-an .inhalt{ padding:0; background:transparent; }

.x-seite{ max-width:760px; margin:0 auto; padding:0 14px 40px; }

.x-demoleiste{
  display:flex; flex-wrap:wrap; align-items:center; gap:10px;
  background:#15202B; color:#fff; padding:10px 14px;
}
.x-demomarke{
  background:#F0B323; color:#15202B; font-weight:800; font-size:13px;
  letter-spacing:.04em; padding:3px 9px; border-radius:6px;
}
.x-demotext{ font-size:14px; color:#D7DCE1; }
.x-zurueck{
  margin-left:auto; background:#fff; color:#15202B; border:0; cursor:pointer;

<script>
"use strict";

/* ===========================================================
   1 · Zeitrechnung
   Dieselben Regeln wie in der Fahrer-Vorschau:
     Reserve = Termin minus voraussichtliche Ankunft
       über 10 Min.      → grün
       0 bis 10 Min.     → orange
       unter 0           → rot
       keine/alte Daten  → grau
     Alarm erst ab 20 Min. berechneter Verspätung, einmal je Auftrag,
     und nur wenn Prognose und Ortung frisch genug sind.
   =========================================================== */
const GRENZE_ORANGE = 10;    // bis hierhin orange
const GRENZE_ALARM  = 20;    // ab hier Dispo-Alarm
const MAX_ALTER     = 10;    // Minuten, bis Daten als veraltet gelten

/* Fester Demo-Zeitpunkt: heutiges Datum, 10:30 Uhr Ortszeit.
   Absichtlich nicht die echte Uhr — sonst sähe der Beispieltag je nach
   Aufrufzeit anders aus und nachts läge er sogar auf dem Vortag.
   Die Ortung ist ohnehin simuliert; ein fester Zeitpunkt macht das ehrlich
   sichtbar und hält die Farben nachvollziehbar. */
const DEMO_JETZT = (() => { const d = new Date(); d.setHours(10,30,0,0); return d; })();
const jetzt    = () => new Date(DEMO_JETZT.getTime());
const jetztIso = () => jetzt().toISOString();
const inMin    = (m, ab) => new Date((ab ? new Date(ab) : jetzt()).getTime() + m*60000).toISOString();
const minZw    = (a, b) => (new Date(b) - new Date(a)) / 60000;

function hhmm(iso){
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d)) return null;
  return d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit",hour12:false});
}
function tagVon(iso){
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d)) return null;
  const p = n => String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}
/* Langer Zufallstoken. Aus ihm lässt sich nichts über den Auftrag
   ableiten — er verweist nur auf einen Link-Datensatz, und erst dieser
   legt fest, was freigegeben ist. Deshalb steht nie eine Auftragsnummer
   in der Adresse. */
function tokenBauen(){
  const zeichen = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let t = "";
  for (let i = 0; i < 24; i++) t += zeichen[Math.floor(Math.random()*zeichen.length)];
  return t;
}
function tagLang(datum){
  if (!datum) return "—";
  const d = new Date(datum+"T12:00:00");
  if (isNaN(d)) return datum;
  return d.toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"});
}
function tagKurz(datum){
  if (!datum) return "—";
  const d = new Date(datum+"T12:00:00");
  if (isNaN(d)) return datum;
  return d.toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"});
}
/* Datum + Uhrzeit zu einem echten Zeitpunkt. Fehlt eines, gibt es keinen. */
function zeitpunkt(datum, uhrzeit){
  if (!datum || !uhrzeit) return null;
  const d = new Date(datum+"T"+uhrzeit+":00");
  return isNaN(d) ? null : d.toISOString();
}
const HEUTE   = () => tagVon(jetztIso());
const TAG_PLUS = n => tagVon(inMin(n*1440));

/* Reserve in Minuten. Ohne beide Zeitpunkte gibt es keine Reserve. */
function reserve(terminIso, ankunftIso){
  if (!terminIso || !ankunftIso) return null;
  return Math.round(minZw(ankunftIso, terminIso));
}
function ampel(res){
  if (res == null) return "grau";
  if (res < 0) return "rot";
  if (res <= GRENZE_ORANGE) return "gelb";
  return "gruen";
}
/* Erlaubte Uhrabweichung: Geräteuhren gehen selten exakt. Ein Zeitstempel
   darf deshalb ein kleines Stück in der Zukunft liegen, ohne verworfen zu
   werden. Alles darüber ist unplausibel und wird nicht geglaubt. */
const UHR_TOLERANZ = 2;      // Minuten

/* Prüft EINEN Zeitstempel vollständig: vorhanden, überhaupt ein gültiges
   Datum mit endlichem Zeitwert, nicht veraltet, nicht unplausibel in der
   Zukunft. Eine bloße Zeichenfolge reicht nicht. */
function zeitstempelPruefen(wert, bezeichnung){
  if (wert == null || wert === "")
    return { ok:false, grund:"Kein " + bezeichnung + " vorhanden" };
  const d = new Date(wert);
  const ms = d.getTime();
  if (typeof ms !== "number" || !isFinite(ms) || isNaN(ms))
    return { ok:false, grund:bezeichnung + " ist unlesbar" };
  const alter = minZw(d.toISOString(), jetztIso());   // positiv = Vergangenheit
  if (alter < -UHR_TOLERANZ)
    return { ok:false, grund:bezeichnung + " liegt unplausibel in der Zukunft" };
  if (alter > MAX_ALTER)
    return { ok:false, grund:bezeichnung + " ist älter als " + MAX_ALTER + " Minuten" };
  return { ok:true, grund:null };
}

/* Sind Prognose UND Ortung brauchbar? Beide werden einzeln geprüft und
   bleiben getrennt — eine Neuberechnung macht keine alte Ortung frisch. */
function datenZuverlaessig(prognoseZeit, ortungZeit){
  const o = zeitstempelPruefen(ortungZeit, "Ortungszeitpunkt");
  if (!o.ok) return o;
  const p = zeitstempelPruefen(prognoseZeit, "Prognosezeitpunkt");
  if (!p.ok) return p;
  return { ok:true, grund:null };
}

/* ===========================================================
   2 · Demo-Planwerte
   Ausdrücklich Planwerte dieser Vorschau, keine Verkehrsdaten
   und keine Tachographendaten.
   =========================================================== */
const PLAN = {
  fahrtBremenWalsrode: 75,
  fahrtWalsrodeBremen: 75,
  fahrtOrtsnah:        20,
  anfahrtAbholung:     25,   // Weg zur Abholstelle, bevor dort etwas passiert
  laden:               30,
  entladen:           120,
  nacharbeit:          15,
  fahrtZumDepot:       25,   // Weg zur Leercontainer-Rückgabe
  depotstopp:          20,
  pause:               45,
  uebergang:           20,   // Übergangsfahrt zum nächsten Auftrag
  puffer:              15
};

/* Fahrzeit zwischen zwei Adressen — reiner Demo-Planwert aus dem Ortsnamen.
   Kein Routing, keine Verkehrsdaten. Unbekannte Strecken bekommen den
   Standardwert, damit nie eine Fahrzeit von 0 Minuten unterstellt wird. */
function fahrzeit(vonAdresse, nachAdresse){
  const ort = s => {
    const t = String(s||"").toLowerCase();
    if (t.indexOf("bremen") >= 0)      return "bremen";
    if (t.indexOf("walsrode") >= 0)    return "walsrode";
    if (t.indexOf("delmenhorst") >= 0) return "delmenhorst";
    return "sonstige";
  };
  const a = ort(vonAdresse), b = ort(nachAdresse);
  if (a === b) return PLAN.fahrtOrtsnah;
  const paar = [a,b].sort().join("-");
  if (paar === "bremen-walsrode")      return PLAN.fahrtBremenWalsrode;
  if (paar === "bremen-delmenhorst")   return 30;
  if (paar === "delmenhorst-walsrode") return 85;
  return PLAN.fahrtBremenWalsrode;
}

/* ===========================================================
   2b · Anbieter, Telematik, Routing, Geofences

   Alles, was später an ein echtes System geht, läuft über einen
   Anbieter. Heute steht überall „demo“. Wird morgen ein echter
   Dienst angeschlossen, ändert sich hier die Art — nicht die
   Fachlogik darüber.

   Was hier wirklich gerechnet wird und was nur so tut, steht an
   jeder Stelle dabei. Nichts gibt vor, mit einem echten Gerät oder
   Dienst zu sprechen.
   =========================================================== */
const ANBIETER = {
  telematik:   { art:"demo", name:"Demo-Telematik",   geraet:"Teltonika FMC650 (simuliert)" },
  routing:     { art:"demo", name:"Demo-Lkw-Routing", hinweis:"Luftlinie mal Streckenfaktor, keine echten Straßendaten" },
  ki:          { art:"demo", name:"Demo-Assistent",   hinweis:"Regeln über den Daten dieser Vorschau, kein Sprachmodell" },
  karten:      { art:"demo", name:"Demo-Karte",       hinweis:"schematisch, kein Kartendienst" },
  kamera:      { art:"demo", name:"Demo-Kamera",      geraet:"Teltonika DashCam (simuliert)" },
  nachrichten: { art:"demo", name:"Demo-Versand",     hinweis:"es wird nichts verschickt" }
};
/* Kurzer Satz für die Oberfläche: welcher Anbieter, und dass er simuliert. */
function anbieterSatz(schluessel){
  const p = ANBIETER[schluessel] || {};
  return (p.name || "Demo") + (p.art === "demo" ? " (simuliert)" : "");
}

/* ---- Orte mit Koordinaten ----
   Nur die Orte, die in dieser Vorschau vorkommen. Die Koordinaten sind
   grob und dienen der Entfernungsrechnung, nicht der Navigation. */
const ORTE = {
  bremen:      { lat:53.0793, lng:8.8017,  wort:"Bremen" },
  walsrode:    { lat:52.8617, lng:9.5928,  wort:"Walsrode" },
  delmenhorst: { lat:53.0503, lng:8.6310,  wort:"Delmenhorst" },
  verden:      { lat:52.9226, lng:9.2311,  wort:"Verden" },
  hemelingen:  { lat:53.0533, lng:8.8975,  wort:"Bremen-Hemelingen" }
};
function ortSchluessel(adresse){
  const t = String(adresse||"").toLowerCase();
  if (t.indexOf("hemelingen") >= 0)   return "hemelingen";
  if (t.indexOf("walsrode") >= 0)     return "walsrode";
  if (t.indexOf("delmenhorst") >= 0)  return "delmenhorst";
  if (t.indexOf("verden") >= 0)       return "verden";
  if (t.indexOf("bremen") >= 0)       return "bremen";
  return null;
}
function ortVon(adresse){
  const k = ortSchluessel(adresse);
  return k ? Object.assign({ schluessel:k }, ORTE[k]) : null;
}

/* Entfernung zweier Punkte in Kilometern. Das ist echte Rechnung
   (Haversine), aber eben Luftlinie — keine gefahrene Strecke. */
function luftlinieKm(aLat, aLng, bLat, bLng){
  if ([aLat,aLng,bLat,bLng].some(x => typeof x !== "number" || !isFinite(x))) return null;
  const R = 6371, r = Math.PI/180;
  const dLat = (bLat-aLat)*r, dLng = (bLng-aLng)*r;
  const s = Math.sin(dLat/2)**2 +
            Math.cos(aLat*r)*Math.cos(bLat*r)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.min(1, Math.sqrt(s)));
}
const STRECKENFAKTOR = 1.25;   // Luftlinie → Straße, Demo-Annahme

/* Lkw-Vorgaben für das Routing. Ein echter Dienst braucht genau diese
   Angaben, um Brücken, Tunnel und Fahrverbote zu berücksichtigen. */
function routingStandard(){
  return { hoeheM:4.0, breiteM:2.55, laengeM:16.5, gewichtT:40,
           achslastT:null, gefahrgut:false };
}
/* Telematikgerät im Ausgangszustand: nichts verbunden, nichts bekannt.
   So bekommt auch ein alter gespeicherter Stand ein vollständiges Feld,
   ohne dass irgendwo eine Verbindung behauptet wird. */
function telematikStandard(){
  return { geraet:"FMC650", verbunden:false, letzteMeldung:null,
           latitude:null, longitude:null, geschwindigkeit:0,
           zuendung:false, bewegung:false, gpsGueltig:false, signal:"unbekannt",
           stromversorgung:true, backupBatterie:true, jamming:false, manipulation:false,
           ort:null };
}
function kameraStandard(){
  return { verbunden:false, letzteMeldung:null, letztesBild:null, ereignisse:[] };
}
function sicherungStandard(){
  return { wegfahrsperre:"aus",      // aus | vorgemerkt | aktiv | fehler
           vorgemerktAm:null, aktivSeit:null, fehlerGrund:null,
           diebstahlModus:false, diebstahlSeit:null, spur:[] };
}

/* ---- Geofences ----
   Eine Zone ist ein Kreis um eine Adresse. Mehr braucht diese Stufe
   nicht: Terminal, Depot und Kundenhöfe sind rund genug. */
function geofenceStandard(){
  const z = (id, name, adresse, ort, radiusM, art) => {
    const o = ORTE[ort];
    return { id, name, adresse, lat:o.lat, lng:o.lng, radiusM, art };
  };
  return [
    z("geo_terminal_bremen", "Hansa Terminal Bremen", "Am Speicher 12, 28197 Bremen",
      "bremen", 400, "terminal"),
    z("geo_depot_hemelingen", "Depot Bremen Hemelingen", "Depot Bremen Hemelingen",
      "hemelingen", 300, "depot"),
    z("geo_roland_bremen", "Roland Umschlag, Bremen", "Roland Umschlag, Bremen",
      "bremen", 250, "beladestelle"),
    z("geo_poco_walsrode", "Poco Einrichtungsmarkt Walsrode", "Zum Gewerbegebiet 5, 29664 Walsrode",
      "walsrode", 250, "kunde"),
    z("geo_moeller_walsrode", "Möller Baustoffe GmbH", "Lange Straße 4, 29664 Walsrode",
      "walsrode", 200, "kunde"),
    z("geo_nordsee_walsrode", "Nordsee Handel KG", "Industriestraße 7, 29664 Walsrode",
      "walsrode", 200, "kunde"),
    z("geo_aller_walsrode", "Aller Papier GmbH", "Bahnhofstraße 60, 29664 Walsrode",
      "walsrode", 200, "kunde"),
    z("geo_lueneburger_walsrode", "Lüneburger Holzwerke GmbH", "Sägewerkstraße 3, 29664 Walsrode",
      "walsrode", 200, "kunde"),
    z("geo_weserhof_delmenhorst", "Weserhof Logistik", "Annenheider Damm 145, 27755 Delmenhorst",
      "delmenhorst", 250, "kunde"),
    z("geo_hansebau_delmenhorst", "Hanse Bau Delmenhorst", "Stedinger Straße 22, 27749 Delmenhorst",
      "delmenhorst", 200, "kunde"),
    z("geo_elbe_bremen", "Elbe Stahlhandel GmbH", "Hafenstraße 9, 28237 Bremen",
      "bremen", 200, "kunde")
  ];
}
/* Welche Zone gehört zu dieser Adresse? Gesucht wird zuerst nach der
   Adresse selbst, dann nach dem Firmennamen — beides genau, nie geraten. */
function geofenceFuer(adresse, firma){
  const liste = D.geofences || [];
  const gleich = (x,y) => String(x||"").trim().toLowerCase() === String(y||"").trim().toLowerCase();
  return liste.find(g => gleich(g.adresse, adresse)) ||
         liste.find(g => gleich(g.name, firma)) || null;
}
/* Steht das Fahrzeug in dieser Zone? Reine Rechnung aus Koordinaten. */
function inZone(lat, lng, zone){
  if (!zone || typeof lat !== "number" || typeof lng !== "number") return false;
  const km = luftlinieKm(lat, lng, zone.lat, zone.lng);
  return km != null && km * 1000 <= zone.radiusM;
}

/* ===========================================================
   Routing-Engine

   Ab hier läuft JEDE Fahrzeitberechnung über routeBerechnen(). Die alte
   fahrzeit() bleibt als Rückfallebene erhalten und wird von hier aus
   aufgerufen — sie ist nicht verschwunden, sie ist jetzt der Notnagel,
   wenn kein Ort erkannt wird.

   Ein echter Lkw-Routingdienst bekäme genau dieselben Eingaben:
   Start, Ziel, Fahrzeugmaße, Abfahrtszeit. Das ist der Grund für diese
   Signatur.
   =========================================================== */
/* Verkehrsaufschlag nach Tageszeit — eine bewusst grobe Demo-Annahme.
   Ein echter Dienst liefert das aus Messdaten; hier steht eine Tabelle,
   damit die Zahl nachvollziehbar bleibt statt zufällig zu wirken. */
function verkehrsFaktor(abfahrtIso){
  if (!abfahrtIso) return { faktor:1.0, wort:"ohne Verkehrsannahme" };
  const d = new Date(abfahrtIso);
  if (isNaN(d)) return { faktor:1.0, wort:"ohne Verkehrsannahme" };
  const std = d.getHours(), tag = d.getDay();       // 0 = Sonntag
  if (tag === 0) return { faktor:0.92, wort:"Sonntag, wenig Verkehr" };
  if (std >= 6 && std < 9)   return { faktor:1.18, wort:"Morgenverkehr" };
  if (std >= 15 && std < 18) return { faktor:1.22, wort:"Nachmittagsverkehr" };
  if (std >= 22 || std < 5)  return { faktor:0.90, wort:"Nachtfahrt" };
  return { faktor:1.0, wort:"normaler Verkehr" };
}

/* Der einzige Weg zu einer Fahrzeit.
   Rückgabe: { minuten, km, quelle, verkehr, guete, hinweis, echt }
     guete: "hoch" | "mittel" | "niedrig" — wie belastbar die Zahl ist.
     echt:  was davon wirklich gerechnet wurde. */
function routeBerechnen(von, nach, fahrzeug, abfahrtIso){
  const prov = ANBIETER.routing;
  if (prov.art !== "demo") {
    /* Hier käme der Aufruf des echten Dienstes hin. Solange keiner
       angeschlossen ist, wird nichts behauptet. */
    return { minuten:null, km:null, quelle:prov.name, guete:"niedrig",
             hinweis:"Routingdienst nicht erreichbar", echt:false };
  }
  const a = ortVon(von), b = ortVon(nach);
  const verkehr = verkehrsFaktor(abfahrtIso);

  if (!a || !b) {
    /* Ort unbekannt: der alte Planwert trägt weiter. Lieber ein grober
       bekannter Wert als eine erfundene Strecke. */
    return { minuten:fahrzeit(von, nach), km:null, quelle:"Demo-Planwert",
             verkehr:null, guete:"niedrig",
             hinweis:"Ort nicht erkannt, fester Planwert", echt:false };
  }
  const luft = luftlinieKm(a.lat, a.lng, b.lat, b.lng);
  const km = Math.max(1, Math.round(luft * STRECKENFAKTOR));

  /* Schnitt aus Landstraße und Autobahn, je nach Länge. Kurze Wege im
     Stadtgebiet sind deutlich langsamer als eine Autobahnetappe. */
  const schnitt = km < 15 ? 32 : km < 40 ? 55 : 68;   // km/h
  let minuten = (km / schnitt) * 60 * verkehr.faktor;

  /* Lkw-Zuschlag aus den Fahrzeugmaßen. Ein 40-Tonner ist langsamer
     und darf nicht überall lang — beides kostet Zeit. */
  const r = (fahrzeug && fahrzeug.routing) || routingStandard();
  if (r.gewichtT >= 26) minuten *= 1.08;
  if (r.hoeheM >= 4.0)  minuten *= 1.03;
  if (r.gefahrgut)      minuten *= 1.05;

  return { minuten:Math.max(5, Math.round(minuten)), km,
           quelle:ANBIETER.routing.name, verkehr:verkehr.wort, guete:"mittel",
           hinweis:"Luftlinie × " + STRECKENFAKTOR + ", Demo-Annahmen für Tempo und Verkehr",
           echt:false };
}

/* Fahrzeit für die Tourrechnung. Genau eine Stelle, an der die
   Kettenrechnung an das Routing kommt — damit Tagesplan, Wochenplan,
   Auftrag und Auftraggeberansicht nie verschiedene Fahrzeiten benutzen. */
function fahrzeitFuer(von, nach, fahrzeug, abfahrtIso){
  const r = routeBerechnen(von, nach, fahrzeug, abfahrtIso);
  return (r && r.minuten != null) ? r.minuten : fahrzeit(von, nach);
}

/* ===========================================================
   2c · Eigene Erfahrungswerte („lernende“ Prognose)

   Ein Routingdienst kennt die Straße. Er kennt nicht, dass bei einem
   bestimmten Kunden montags eine Stunde länger entladen wird. Genau
   dafür führt TWISTLOCK eigene Beobachtungen mit.

   Hier sind es Beispieldaten. Die Rechnung darüber ist aber echt: es
   wird tatsächlich gemittelt, nicht geraten — und wenn zu wenig Daten
   vorliegen, sagt die Funktion das, statt eine Zahl zu erfinden.
   =========================================================== */
const LERN_MINDEST = 3;          // weniger Beobachtungen → keine Aussage

function demoHistorie(){
  /* Gefahrene Strecken: Ort → Ort, Wochentag, Stunde, tatsächliche Minuten.
     Bewusst so gewählt, dass der Morgen schneller und der Freitagnachmittag
     deutlich langsamer ist als der Routingwert. */
  const f = [];
  const fahrt = (von, nach, tag, std, min, n) => {
    for (let i = 0; i < n; i++) f.push({ von, nach, tag, stunde:std, minuten:min + (i%3) - 1 });
  };
  fahrt("bremen","walsrode", 1,  5, 67, 6);    // Montag früh
  fahrt("bremen","walsrode", 1,  9, 74, 5);
  fahrt("bremen","walsrode", 5, 15, 92, 4);    // Freitagnachmittag
  fahrt("bremen","walsrode", 3, 11, 73, 5);
  fahrt("walsrode","bremen", 1, 12, 71, 4);
  fahrt("bremen","delmenhorst", 2, 8, 34, 4);
  fahrt("bremen","hemelingen", 1, 13, 22, 5);
  fahrt("verden","walsrode", 1, 10, 29, 4);
  fahrt("verden","walsrode", 1, 16, 34, 3);

  /* Standzeiten je Auftraggeber. Zwei sehr verschiedene Kunden, damit
     der Unterschied sichtbar wird. */
  const s = [];
  const stopp = (kunde, art, min, n) => {
    for (let i = 0; i < n; i++) s.push({ auftraggeberId:kunde, art, minuten:min + (i%5)*3 - 6 });
  };
  stopp("kunde_poco",    "entladung", 48, 7);
  stopp("kunde_nordsee", "entladung", 103, 6);
  stopp("kunde_elbe",    "entladung", 62, 4);
  stopp("kunde_moeller", "entladung", 55, 2);     // zu wenige → keine Aussage
  return { fahrten:f, stopps:s };
}

function mittel(zahlen){
  if (!zahlen.length) return null;
  return Math.round(zahlen.reduce((a,b) => a+b, 0) / zahlen.length);
}

/* Erfahrungswert für eine Strecke zu einer bestimmten Zeit.
   Gesucht wird erst eng (gleicher Wochentag, ±2 Stunden), dann weiter
   (nur die Strecke). Wie eng getroffen wurde, steht im Ergebnis. */
function lernFahrzeit(vonAdresse, nachAdresse, abfahrtIso){
  const a = ortSchluessel(vonAdresse), b = ortSchluessel(nachAdresse);
  const H = (D.historie && D.historie.fahrten) || [];
  if (!a || !b || !H.length) return { minuten:null, anzahl:0, treffer:"keine" };
  const passend = H.filter(x => x.von === a && x.nach === b);
  if (!passend.length) return { minuten:null, anzahl:0, treffer:"keine" };

  const d = abfahrtIso ? new Date(abfahrtIso) : null;
  if (d && !isNaN(d)) {
    const tag = d.getDay(), std = d.getHours();
    const eng = passend.filter(x => x.tag === tag && Math.abs(x.stunde - std) <= 2);
    if (eng.length >= LERN_MINDEST)
      return { minuten:mittel(eng.map(x => x.minuten)), anzahl:eng.length, treffer:"genau" };
  }
  if (passend.length >= LERN_MINDEST)
    return { minuten:mittel(passend.map(x => x.minuten)), anzahl:passend.length, treffer:"strecke" };
  return { minuten:null, anzahl:passend.length, treffer:"zuwenig" };
}

/* Erfahrungswert für die Standzeit bei einem Auftraggeber. */
function lernStandzeit(auftraggeberId, art){
  const S = (D.historie && D.historie.stopps) || [];
  const passend = S.filter(x => x.auftraggeberId === auftraggeberId && x.art === (art||"entladung"));
  if (passend.length < LERN_MINDEST)
    return { minuten:null, anzahl:passend.length, treffer:"zuwenig" };
  return { minuten:mittel(passend.map(x => x.minuten)), anzahl:passend.length, treffer:"genau" };
}

/* Routing und Erfahrung zusammenführen.
   Gibt es genug eigene Fahrten, wiegen sie schwerer als die Modellrechnung —
   aber die Routingzahl verschwindet nicht, beide stehen im Ergebnis. */
function lernEta(vonAdresse, nachAdresse, fahrzeug, abfahrtIso){
  const route = routeBerechnen(vonAdresse, nachAdresse, fahrzeug, abfahrtIso);
  const lern  = lernFahrzeit(vonAdresse, nachAdresse, abfahrtIso);
  if (lern.minuten == null || route.minuten == null)
    return { minuten:route.minuten, route, lern, gewicht:0,
             guete:route.guete || "niedrig",
             erklaerung:"Nur Routingwert – zu wenige eigene Fahrten auf dieser Strecke." };
  /* Gewicht steigt mit der Zahl der Beobachtungen, bleibt aber gedeckelt:
     eigene Daten sind gut, aber nie die ganze Wahrheit. */
  const g = lern.treffer === "genau" ? Math.min(0.7, 0.1 * lern.anzahl)
                                     : Math.min(0.4, 0.07 * lern.anzahl);
  const minuten = Math.round(route.minuten * (1-g) + lern.minuten * g);
  return { minuten, route, lern, gewicht:Math.round(g*100),
           guete: lern.treffer === "genau" ? "hoch" : "mittel",
           erklaerung:"Routing " + route.minuten + " Min., eigene Fahrten " + lern.minuten +
                      " Min. aus " + lern.anzahl + " Beobachtungen, gewichtet " +
                      Math.round(g*100) + " %." };
}

/* ===========================================================
   2d · Datenqualität

   Jede Prognose sagt dazu, worauf sie steht. Bei „niedrig“ wird bewusst
   keine genaue Uhrzeit versprochen.
   =========================================================== */
function datenGuete(a){
  const gruende = [];
  const z = a && a.planung ? zugVon(a.planung.zugmaschineId) : null;
  const t = z && z.telematik;
  let punkte = 0;

  if (t && t.verbunden && t.gpsGueltig &&
      zeitstempelPruefen(t.letzteMeldung, "Ortungszeitpunkt").ok) {
    punkte += 2; gruende.push("Ortung frisch");
  } else if (t && t.verbunden) {
    gruende.push("Ortung veraltet");
  } else {
    gruende.push("keine Ortung");
  }

  const r = routeBerechnen(a.abhol.adresse, a.liefer.adresse, z, jetztIso());
  if (r && r.minuten != null && r.km != null) { punkte += 1; gruende.push("Strecke bekannt"); }
  else gruende.push("Strecke nur als Planwert");

  const l = lernFahrzeit(a.abhol.adresse, a.liefer.adresse, jetztIso());
  if (l.minuten != null) { punkte += 1; gruende.push("eigene Fahrten vorhanden"); }
  else gruende.push("kaum eigene Fahrten");

  const e = entladeRest(a);
  if (e.unklar) { punkte -= 1; gruende.push("Entladeende unklar"); }

  const stufe = punkte >= 4 ? "hoch" : punkte >= 2 ? "mittel" : "niedrig";
  return { stufe, punkte, gruende,
           klasse: stufe === "hoch" ? "m-gruen" : stufe === "mittel" ? "m-gelb" : "m-grau" };
}

   3 · Speicherung

   nicht, wird das ehrlich gesagt — es wird nichts behauptet.
   =========================================================== */
const SCHLUESSEL = "twistlock-dispo-demo-v2";

function speichern(){
  if (!speicherGeht) return false;
  try {
    localStorage.setItem(SCHLUESSEL, JSON.stringify(D));
    return true;
  } catch (e) {
    speicherGeht = false;
    speicherGrund = (e && e.message) || "Browser erlaubt kein Speichern";

    return false;
  }
}

  try {
    const roh = localStorage.getItem(SCHLUESSEL);
    if (!roh) return null;
    return JSON.parse(roh);
  } catch (e) {
    speicherGeht = false;
    speicherGrund = (e && e.message) || "Browser erlaubt kein Speichern";
    return null;
  }
}

/* Ein Termin liegt immer auf einer vollen Minute: „HH:MM“ kennt keine
   Sekunden. Würde die Prognose Sekunden behalten, wäre die Reserve um
   eine Minute daneben — aus 15 Min. würden 14. Deshalb wird hier beides
   auf dieselbe volle Minute gesetzt. */
const _termine = new Map();
function demoTermin(inMinuten, reserveMin){
  const schluessel = inMinuten + "/" + (reserveMin == null ? "-" : reserveMin);
  if (_termine.has(schluessel)) return _termine.get(schluessel);
  const d = new Date(jetzt().getTime() + inMinuten*60000);
  d.setSeconds(0,0);
  const iso = d.toISOString();
  const t = { datum:tagVon(iso), zeit:hhmm(iso), iso,
              prognose: reserveMin == null ? null : inMin(-reserveMin, iso) };
  // Gemerkt, damit Datum und Uhrzeit derselben Stelle nie aus zwei
  // verschiedenen Minuten stammen — sonst bricht es genau um Mitternacht.
  _termine.set(schluessel, t);
  return t;
}

/* Verlaufseintrag. Die Quelle gehört dazu: „angekommen“ heißt etwas
   anderes, wenn es das GPS gemeldet hat, als wenn der Fahrer es gedrückt

function v(zeit, text, quelle){ return { zeit, text, quelle:quelle || "dispo" }; }

function naechsterMontag(){
  const d = jetzt();
  const tage = (8 - d.getDay()) % 7 || 7;   // immer der kommende Montag

  bereich:"tagesplan",

function start(){
  const gespeichert = laden();
  D = gespeichert || demoDaten();
  migrieren();
  if (!gespeichert) { alarmePruefen(); speichern(); }
  U.tag = HEUTE();
  speicherNotizZeichnen();
  ketteRechnen();
  /* Einmal beim Start: aus der aktuellen Lage die sicheren Statuswechsel
     ableiten. Bewusst nicht bei jedem Zeichnen — das liefe im Kreis. */
  automatikLauf();
  ketteRechnen();
  risikoRechnen();
  alarmePruefen();
  zeichne();
  uhrZeigen();
  setInterval(uhrZeigen, 20000);
}
/* Ein gespeicherter Stand aus einer älteren Fassung kennt die neuen
   Felder noch nicht. Sie werden ergänzt — nichts wird gelöscht und
   nichts Bestehendes überschrieben. Genau deshalb bleibt der
   Speicherschlüssel derselbe. */
function migrieren(){
  if (!Array.isArray(D.auftraggeber)) D.auftraggeber = [];
  if (!Array.isArray(D.links)) D.links = [];
  if (!Array.isArray(D.meldungen)) D.meldungen = [];
  if (!Array.isArray(D.geofences) || !D.geofences.length) D.geofences = geofenceStandard();
  if (!Array.isArray(D.geofenceEreignisse)) D.geofenceEreignisse = [];
  if (!D.historie || !Array.isArray(D.historie.fahrten)) D.historie = demoHistorie();
  if (!Array.isArray(D.vorschlaege)) D.vorschlaege = [];

  D.zugmaschinen.forEach(z => {
    if (!z.telematik) z.telematik = telematikStandard();
    else Object.keys(telematikStandard()).forEach(k => {
      if (!(k in z.telematik)) z.telematik[k] = telematikStandard()[k];
    });
    if (!z.routing) z.routing = routingStandard();
    if (!z.kamera) z.kamera = kameraStandard();
    if (!Array.isArray(z.kamera.ereignisse)) z.kamera.ereignisse = [];
    if (!z.sicherung) z.sicherung = sicherungStandard();
    if (!Array.isArray(z.sicherung.spur)) z.sicherung.spur = [];
  });

  D.auftraege.forEach(a => {
    if (!("auftraggeberId" in a)) a.auftraggeberId = null;
    if (!Array.isArray(a.bilder)) a.bilder = [];
    if (!("standort" in a)) a.standort = null;
    if (!a.automatik) a.automatik = { an:true, korrigiert:null, letzterWechsel:null };
    if (!Array.isArray(a.zonen)) a.zonen = [];        // erlebte Geofence-Ereignisse
    if (!("risiko" in a)) a.risiko = null;
    (a.dokumente || []).forEach(dk => { if (!("extern" in dk)) dk.extern = false; });
    /* Verlaufseinträge ohne Quelle stammen aus der Zeit vor dem
       Ereignisprotokoll — sie gelten als Eintrag der Dispo. */
    (a.verlauf || []).forEach(e => { if (!e.quelle) e.quelle = "dispo"; });
  });
}
